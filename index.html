<style>
html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}

:root{
  --bg:#eceff4; --surface:#fff; --panel:#f4f7fa; --sunk:#e5eaf1;
  --ink:#0d151f; --ink-2:#33465c; --muted:#61748a; --line:#d5dde7; --line-2:#bdc9d7;
  --accent:#00288c; --accent-soft:#e3e7f2; --accent-ink:#fff;
  --route:#cf5209; --route-soft:#fbe6d4; --ok:#2e7d32;
  --shadow-1:0 1px 2px rgba(13,21,31,.05),0 8px 22px rgba(13,21,31,.08);
  --shadow-2:0 2px 6px rgba(13,21,31,.08),0 22px 48px rgba(13,21,31,.14);
  --plan-bg:#f7f9fc; --slab:#fdfefe; --slab-edge:#c6d1dd;
  --wall:#3f4d5e; --hair:#a8b7c6;
  --ground:rgba(13,21,31,.16); --fsh:rgba(13,21,31,.20);
  --r:11px; --ease:cubic-bezier(.22,.68,.24,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080d13; --surface:#121a24; --panel:#0f161f; --sunk:#0c131b;
  --ink:#e7eef6; --ink-2:#c2d0e0; --muted:#8ba0b7; --line:#1f2c3a; --line-2:#2c3c4c;
  --accent:#799aec; --accent-soft:#0d1c42; --accent-ink:#05101b;
  --route:#ff8c3f; --route-soft:#3a2211; --ok:#7fd18a;
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.5);
  --shadow-2:0 2px 8px rgba(0,0,0,.55),0 26px 56px rgba(0,0,0,.6);
  --plan-bg:#0b131c; --slab:#16202b; --slab-edge:#2b3a4a;
  --wall:#8ba1b8; --hair:#2c3b4b;
  --ground:rgba(0,0,0,.5); --fsh:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#080d13; --surface:#121a24; --panel:#0f161f; --sunk:#0c131b;
  --ink:#e7eef6; --ink-2:#c2d0e0; --muted:#8ba0b7; --line:#1f2c3a; --line-2:#2c3c4c;
  --accent:#799aec; --accent-soft:#0d1c42; --accent-ink:#05101b;
  --route:#ff8c3f; --route-soft:#3a2211; --ok:#7fd18a;
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.5);
  --shadow-2:0 2px 8px rgba(0,0,0,.55),0 26px 56px rgba(0,0,0,.6);
  --plan-bg:#0b131c; --slab:#16202b; --slab-edge:#2b3a4a;
  --wall:#8ba1b8; --hair:#2c3b4b;
  --ground:rgba(0,0,0,.5); --fsh:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Open Sans","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
/* Csak képernyőolvasónak: a látható elrendezésből kikerül, de a fókusz és a
   felolvasás eléri. display:none vagy visibility:hidden nem jó — azokat a
   képernyőolvasó is kihagyná. */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cond{font-family:"Metropolis","Open Sans",system-ui,sans-serif}

/* ------------------------------------------------------------- shell */
.app{height:100dvh;display:grid;grid-template-columns:334px 1fr;grid-template-rows:auto 1fr;
  grid-template-areas:"head head" "side map"}
.head{grid-area:head;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-family:"Metropolis","Open Sans",system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:.005em;color:var(--accent)}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);
  transition:color .18s,background .18s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.seg.icons button{padding:5px 8px;font-size:13px}

.side{grid-area:side;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
.map-wrap{grid-area:map;position:relative;min-height:0;overflow:hidden;background:var(--plan-bg)}

/* ------------------------------------------------------------- sidebar */
.search{padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:9px;background:var(--sunk);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;transition:border-color .18s,box-shadow .18s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input{flex:1;border:0;background:none;outline:none;min-width:0}
.field svg{flex:none;color:var(--muted)}
.field kbd{font-family:inherit;font-size:11px;color:var(--muted);border:1px solid var(--line-2);
  border-radius:5px;padding:1px 5px;line-height:1.4}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}

.res-item{display:flex;align-items:center;gap:11px;padding:9px 14px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:background .15s}
/* aria-current, nem aria-selected: az utóbbi listboxban/fülön értelmes, egy
   sima gombon a felolvasó figyelmen kívül hagyja. */
.res-item:hover,.res-item[aria-current="true"]{background:var(--panel)}
.dotc{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.res-main{min-width:0;flex:1}
.res-code{font-size:12px;font-weight:600;letter-spacing:.01em}
.res-name{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}

.sec{padding:16px 14px;border-bottom:1px solid var(--line);animation:rise .34s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:9px}

.rcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.rcard .top{padding:12px 13px 11px;border-left:4px solid var(--cat,var(--line-2))}
.rcard .code{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.rcard .name{font-size:17.5px;font-weight:600;line-height:1.25;margin-top:2px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.btn-row{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.btn{flex:1;background:var(--surface);padding:10px;font-size:13px;font-weight:500;
  transition:background .16s,color .16s}
.btn:hover{background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent);color:var(--accent-ink)}

.ends{display:flex;flex-direction:column;gap:6px;position:relative}
.ends:before{content:"";position:absolute;left:15px;top:26px;bottom:26px;width:2px;
  background:repeating-linear-gradient(var(--line-2) 0 3px,transparent 3px 7px)}
.ep{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;width:100%;text-align:left;transition:border-color .16s}
.ep:hover{border-color:var(--accent)}
.ep .pin{width:10px;height:10px;border-radius:50%;flex:none;border:3px solid var(--accent);
  background:var(--surface);z-index:1}
.ep.to .pin{border-radius:3px;background:var(--route);border-color:var(--route)}
.ep .txt{flex:1;min-width:0}
.ep .txt small{display:block;font-size:10px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.ep .txt span{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .x{color:var(--muted);font-size:16px;padding:0 2px;line-height:1}
.ep .x:hover{color:var(--ink)}

/* Útvonalválasztó: lépcső vagy lift. A kiválasztott az akcentszínt kapja. */
.eyebrow.sub{margin:14px 0 7px}
.eyebrow.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shr{flex:none;width:30px;height:30px;margin:-7px -4px -7px 0;border-radius:9px;display:grid;
  place-items:center;color:var(--muted);transition:background .16s,color .16s}
.shr:hover{background:var(--sunk);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:var(--bg);font-size:13px;padding:10px 16px;border-radius:99px;
  box-shadow:var(--shadow-2);opacity:0;pointer-events:none;
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){ .toast{bottom:calc(22px + env(safe-area-inset-bottom))} }
.viasw{display:flex;gap:7px}
.via{flex:1;display:flex;align-items:center;gap:10px;padding:10px 11px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);
  transition:border-color .16s,background .16s,color .16s}
.via:hover{border-color:var(--line-2)}
.via .vico{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  font-size:14px;background:var(--sunk);color:var(--ink-2)}
.via .vtx{min-width:0}
.via .vtx b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.via .vtx small{display:block;font-size:11px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.via.on{border-color:var(--accent);background:var(--accent-soft)}
.via.on .vico{background:var(--accent);color:var(--accent-ink)}
.via.on .vtx small{color:var(--ink-2)}

/* Foglalható termek listája */
.tmlist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);
  display:flex;flex-direction:column;gap:1px}
.tmrow{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"n c b" "s s s";
  gap:2px 9px;align-items:center;width:100%;text-align:left;padding:11px 12px;background:var(--panel);
  color:var(--ink);transition:background .16s}
.tmrow:hover{background:var(--sunk)}
.tmrow.open{background:var(--accent-soft)}
.tmn{grid-area:n;display:flex;align-items:baseline;gap:8px;min-width:0}
.tmn b{font-size:15px;font-weight:600}
.tmn i{font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmc{grid-area:c;font-size:12px;color:var(--muted);white-space:nowrap}
.tms{grid-area:s;font-size:12px;color:var(--ink-2);margin-top:2px}
.tmb{grid-area:b;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;white-space:nowrap}
.tmb.free{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tmb.busy{background:var(--route-soft);color:var(--route)}
.tmb.none{background:var(--sunk);color:var(--muted)}
.tmd{background:var(--sunk);padding:9px 12px 11px;font-size:12.5px}
.tmdh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tmr{display:flex;gap:10px;padding:3px 0;color:var(--ink-2)}
.tmr .mono{color:var(--ink);flex:none}
.tmr.empty2{color:var(--muted)}
.tmf{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.tmf .tag{font-size:10.5px;padding:2px 7px}

.sum{display:flex;gap:2px;margin:13px 0 4px;border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;background:var(--line)}
.sum div{flex:1;background:var(--panel);padding:10px 11px}
.sum b{font-size:20px;font-weight:600;letter-spacing:-.015em}
.sum i{font-style:normal;font-size:12px;color:var(--muted);margin-left:2px}
.sum small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}

.steps{list-style:none;margin:12px 0 0;padding:0;position:relative}
.steps:before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--line)}
.step{display:flex;gap:11px;align-items:flex-start;padding:5px 0;width:100%;text-align:left}
.step .ico{width:28px;height:28px;flex:none;border-radius:50%;background:var(--surface);
  border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--ink-2);
  z-index:1;transition:border-color .16s,color .16s,transform .16s}
.step.v .ico{border-color:var(--route);color:var(--route)}
.step:hover .ico{border-color:var(--accent);color:var(--accent);transform:scale(1.08)}
.step .b{padding-top:4px}
.step .t{font-size:13.5px;line-height:1.35}
.step .d{font-size:11.5px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.foot{padding:14px;font-size:11px;color:var(--muted);line-height:1.5}
.qgrid{display:grid;gap:7px;padding:14px}
.qbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--panel);width:100%;text-align:left;font-size:13.5px;
  color:var(--ink);transition:border-color .16s,background .16s}
.qbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.qbtn svg{flex:none;color:var(--accent)}
.qbtn small{display:block;font-size:11.5px;color:var(--muted)}
.legfold{display:none}

/* ------------------------------------------------------------- 3D map */
.stage{position:absolute;inset:0;perspective:2100px;perspective-origin:50% 46%;
  touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;
  transition:transform 1s var(--ease)}
.world.now{transition:none;will-change:transform}
.floor{position:absolute;left:0;top:0;transform-style:preserve-3d;
  transition:transform 1s var(--ease),opacity .55s var(--ease),filter .55s var(--ease)}
.rooms{transition:opacity .5s var(--ease)}
.walls{transition:opacity .5s var(--ease)}
.floor svg{display:block;overflow:visible}
.slab{fill:var(--slab);stroke:var(--slab);stroke-width:.55;stroke-linejoin:round}
.slabsh{fill:var(--fsh);stroke:var(--fsh);stroke-width:1.1;stroke-linejoin:round;opacity:0;
  transition:opacity .5s var(--ease)}
.m3 .slabsh{opacity:1}
.slabline{fill:none;stroke:var(--slab-edge);stroke-width:.12}
.room{stroke:var(--hair);stroke-width:.1;transition:opacity .3s}
.walls{fill:var(--wall)}
.lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:600;fill:var(--ink);text-anchor:middle;letter-spacing:-.04em}
.lbl2{font-family:"Metropolis","Open Sans",system-ui,sans-serif;fill:var(--muted);text-anchor:middle}
.glabel{pointer-events:none;transition:opacity .4s var(--ease)}

/* Navigálás közben minden per-frame költséget kikapcsolunk: a backdrop-blur
   újraszámolná a mozgó térképet minden képkockán, a ping animáció folyamatosan
   piszkítja a 3D réteget, a hit-teszt pedig 700+ poligonon futna mozgatásonként. */
/* Alaprajz nézetben nincs egyetlen 3D transzform sem, a perspective és a
   preserve-3d viszont így is külön réteget tart fenn minden szintnek, és
   kizárja a lapos gyorsútvonalat. A .flat2d csak a szintanimáció lefutása
   után kerül fel, hogy a translateZ visszaút ne ugorjon. */
.flat2d .stage{perspective:none}
.flat2d .world,.flat2d .floor{transform-style:flat}

.navving .rail,.navving .plate,.navving .tools button,.navving .legend-btn{backdrop-filter:none}
.navving .ring{animation-play-state:paused}
/* Navigálás közben a szintek átlátszósága képkockánként változik (a dőléstől
   függ); a .55s-os áttűnés ilyenkor minden képkockán újraindulna, és a köteg
   lomhán kullogna a mozdulat után. */
.navving .floor{pointer-events:none;transition:none}
.navving .room.pick:hover{opacity:1}

/* módfüggő interakció */
.m2 .floor{cursor:default}
.m3 .floor{cursor:pointer}
.m2 .rooms{pointer-events:auto}
.m3 .rooms{pointer-events:none}
.m2 .hit{pointer-events:none}
.m3 .hit{pointer-events:fill}
.room.pick{cursor:pointer}
.room.pick:hover{opacity:.72}
/* A billentyűzetes kurzor. SVG-n az outline böngészőnként máshol és máshogy
   jelenik meg (a bounding boxra, nem az alakzatra), ezért a fókuszt szaggatott
   kontúrral rajzoljuk — az a poligon valódi formáját követi. Szaggatott, hogy
   a folytonos kontúrú kiválasztástól (.sel) ránézésre is elváljon: a kettő
   egyszerre is fennáll, amikor a fókuszált termet ki is választod. */
.room:focus{outline:none}
.room:focus-visible{stroke:var(--accent);stroke-width:.55;stroke-dasharray:.85 .5;
  stroke-linejoin:round}
/* A térkép maga egyetlen tab-állomás; a termek közt a nyilak léptetnek. */
.stage:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:0}
/* Nem hallgatói helyiségek: semleges kitöltés, halványan. A .showstaff a
   fejléc kapcsolójától kerül fel, olyankor visszakapja a kategóriaszínét. */
.room.staff{fill:var(--sunk);opacity:.62}
.showstaff .room.staff{fill:var(--cat);opacity:1}
.room.sel{stroke:var(--accent);stroke-width:.5}

.ftag{position:absolute;white-space:nowrap;pointer-events:none;text-align:right;
  font-family:"Metropolis","Open Sans",system-ui,sans-serif;font-weight:700;font-size:15px;
  color:var(--ink-2);opacity:0;transform-origin:100% 50%;
  transition:opacity .45s var(--ease),color .3s}
.m3 .ftag{opacity:1}
.floor.on .ftag{color:var(--accent)}
.ftag em{display:block;font-style:normal;font-weight:400;font-size:11px;opacity:.7;
  font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:.02em}
.floor.on .ftag{color:var(--accent);font-size:17px}
.m3 .floor:not(.on) .ftag{opacity:.6}

.riser{position:absolute;width:3px;border-radius:2px;background:linear-gradient(var(--route),color-mix(in srgb,var(--route) 15%,transparent));
  transform-origin:50% 100%;opacity:0;transition:opacity .5s var(--ease) .25s}
.m3 .riser{opacity:.9}
.ground{position:absolute;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(closest-side,var(--ground),transparent 72%);
  transition:opacity .6s var(--ease)}
.m3 .ground{opacity:1}

.rl{fill:none;stroke:var(--route);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.rl.casing{stroke:var(--slab);stroke-width:2.7;opacity:.95}
.rl.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:drawin .95s var(--ease) .12s forwards}
@keyframes drawin{to{stroke-dashoffset:0}}
.pin-a,.pin-b{transform-box:fill-box;transform-origin:center;animation:pop .45s var(--ease) both}
.pin-b{animation-delay:.75s}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.mkt{font-family:"Metropolis","Open Sans",system-ui,sans-serif;font-size:1.7px;font-weight:700;fill:#fff;
  text-anchor:middle;pointer-events:none}
.ring{fill:none;stroke:var(--route);stroke-width:.35;opacity:.9;transform-box:fill-box;
  transform-origin:center;animation:ping 2.1s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}

/* ------------------------------------------------------------- chrome */
.rail{position:absolute;right:18px;top:50%;transform:translateY(-50%);z-index:4;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);padding:6px;
  display:flex;flex-direction:column;gap:3px}
.lv{width:44px;height:34px;border-radius:9px;position:relative;display:grid;place-items:center;
  font-family:"Metropolis","Open Sans",system-ui,sans-serif;font-weight:700;font-size:14.5px;color:var(--muted);
  transition:background .18s,color .18s,transform .18s var(--ease)}
.lv:hover{background:var(--sunk);color:var(--ink);transform:translateX(-3px)}
.lv[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lv .pip{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--route)}
.lv[aria-pressed="true"] .pip{background:var(--accent-ink)}

.hud{position:absolute;left:18px;top:18px;z-index:4;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.plate{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-1)}
.fname{padding:9px 14px}
.fname b{font-family:"Metropolis","Open Sans",system-ui,sans-serif;font-size:16.5px;display:block;line-height:1.15}
.fname span{font-size:11px;color:var(--muted)}
.modesw{display:flex;padding:3px;gap:2px}
.modesw button{padding:6px 13px;border-radius:9px;font-size:12.5px;color:var(--muted);
  display:flex;align-items:center;gap:6px;transition:background .18s,color .18s}
.modesw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.tools{position:absolute;right:18px;bottom:18px;z-index:4;display:flex;flex-direction:column;gap:6px}
.tools button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:16px;
  color:var(--ink-2);background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow-1);
  transition:color .16s,border-color .16s}
.tools button:hover{color:var(--accent);border-color:var(--accent)}

.legend-btn{position:absolute;left:18px;bottom:18px;z-index:4;padding:8px 13px;border-radius:10px;
  font-size:12px;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow-1);
  display:flex;align-items:center;gap:7px;transition:border-color .16s,color .16s}
.legend-btn:hover{border-color:var(--accent);color:var(--accent)}
.legend-pop{position:absolute;left:18px;bottom:62px;z-index:5;width:270px;padding:13px 14px;
  opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;
  transition:opacity .26s var(--ease),transform .26s var(--ease)}
.legend-pop.open{opacity:1;transform:none;pointer-events:auto}
.legend-pop .grid{display:grid;gap:6px 12px;grid-template-columns:1fr 1fr;font-size:11.5px;color:var(--ink-2)}
.legend-pop i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;
  vertical-align:-1px;border:1px solid var(--line-2)}
.legend-pop .src{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--muted);line-height:1.5}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
.iconbtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--sunk);color:var(--ink-2);place-items:center}
.optbar{display:flex;gap:10px;align-items:center}
.grab{display:none}

/* ============================== MOBIL ============================== */
@media (max-width:900px){
  body{overscroll-behavior:none}
  /* Telefonon a backdrop-blur minden képkockán újraszámolná az alatta mozgó
     térképet. A panelek amúgy is 92%-ban átlátszatlanok, így alig látszik. */
  .rail,.plate,.tools button,.legend-btn{backdrop-filter:none;background:var(--surface)}
  .app{display:block;height:100dvh;position:relative}

  .head{position:fixed;top:0;left:0;right:0;height:54px;padding:0 12px;gap:8px;
    padding-top:env(safe-area-inset-top)}
  .head{height:calc(54px + env(safe-area-inset-top))}
  .brand b{font-size:17px}
  .brand span{display:none}
  .iconbtn{display:grid}
  .optbar{position:absolute;top:calc(100% + 6px);right:10px;flex-direction:column;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;
    box-shadow:var(--shadow-2);opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;
    transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .optbar.open{opacity:1;transform:none;pointer-events:auto}
  .optbar .seg button{padding:9px 15px;font-size:14px}

  .map-wrap{position:fixed;top:calc(54px + env(safe-area-inset-top));left:0;right:0;bottom:0}

  /* ---- alsó lap ---- */
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:86dvh;z-index:20;
    border-right:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    box-shadow:0 -6px 34px rgba(0,0,0,.20);
    transform:translateY(var(--sheet,60vh));transition:transform .42s var(--ease);
    padding-bottom:env(safe-area-inset-bottom);touch-action:none}
  .side.drag{transition:none}
  .grab{display:block;width:100%;padding:9px 0 5px;flex:none;touch-action:none}
  .grab span{display:block;width:42px;height:4px;border-radius:99px;background:var(--line-2);margin:0 auto}
  .search{padding:6px 14px 12px;border-bottom:1px solid var(--line);touch-action:none}
  .field{padding:13px 14px;border-radius:13px}
  .field input{font-size:16px}          /* iOS: nincs auto-zoom */
  .field kbd{display:none}
  .scroll{touch-action:pan-y;padding-bottom:var(--sheetpad,0px)}

  .res-item{padding:13px 15px;gap:13px;min-height:58px}
  .res-code{font-size:12.5px}
  .res-name{font-size:15px}
  .res-meta{font-size:12px}
  .sec{padding:16px 15px}
  .rcard .name{font-size:19px}
  .tag{font-size:12px;padding:4px 10px}
  .btn{padding:15px 10px;font-size:15px}
  .ep{padding:12px 12px;border-radius:11px}
  .ep .txt span{font-size:15px}
  .ep .x{font-size:22px;padding:4px 6px}
  .sum b{font-size:22px}
  .sum div{padding:12px 11px}
  .step{padding:9px 0;min-height:46px}
  .step .t{font-size:15px}
  .step .d{font-size:12.5px}
  .step .ico{width:32px;height:32px;font-size:13px}
  .empty{padding:20px 16px}

  /* ---- térkép-vezérlők ---- */
  .hud{left:12px;top:12px;gap:8px}
  .modesw{position:fixed;left:12px;bottom:var(--railb,142px);z-index:4;
    transition:bottom .42s var(--ease)}
  .fname{padding:8px 12px}
  .fname b{font-size:15px}
  .fname span{font-size:10.5px}
  .modesw button{padding:9px 14px;font-size:13.5px}
  .tools{display:none}
  .legend-btn,.legend-pop{display:none}
  .rail{top:auto;transform:none;right:10px;bottom:var(--railb,142px);
    transition:bottom .42s var(--ease);flex-direction:column;gap:2px;padding:5px;border-radius:15px}
  .lv{width:42px;height:36px;font-size:15px;border-radius:10px}
  .lv:hover{transform:none}
  .ftag{font-size:13px}
  .floor.on .ftag{font-size:14px}

  .qgrid{display:grid;grid-template-columns:1fr;gap:8px;padding:14px}
  .qbtn{display:flex;align-items:center;gap:12px;padding:14px 15px;border:1px solid var(--line);
    border-radius:13px;background:var(--panel);width:100%;text-align:left;font-size:15px;
    color:var(--ink);min-height:56px}
  .qbtn svg{flex:none;color:var(--accent)}
  .qbtn small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .legfold{padding:0 15px 18px}
  .legfold summary{font-size:13px;color:var(--muted);padding:10px 0;cursor:pointer}
  .legfold .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;color:var(--ink-2);
    padding-bottom:6px}
  .legfold i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;
    vertical-align:-1px;border:1px solid var(--line-2)}
  .foot{padding:0 15px 22px;font-size:11px}
}
@media (max-width:900px){ .legfold{display:block} }

</style>
</head>
<body>


<div class="app m2" id="app">
  <header class="head">
    <div class="brand"><b class="cond">OA Épület</b><span id="sub"></span></div>
    <div class="sp"></div>
    <button class="iconbtn" id="menuBtn" aria-label="Beállítások" aria-expanded="false">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="9" cy="4" r="1.3"/><circle cx="9" cy="9" r="1.3"/><circle cx="9" cy="14" r="1.3"/></svg>
    </button>
    <div class="optbar" id="optbar">
      <div class="seg" role="group" aria-label="Nyelv">
        <button id="langHu" aria-pressed="true">HU</button><button id="langEn" aria-pressed="false">EN</button>
      </div>
      <div class="seg" role="group" aria-label="Helyiségek" id="staffSeg">
        <button id="stOff" aria-pressed="true">Hallgatói</button><button id="stOn" aria-pressed="false">Minden</button>
      </div>
      <div class="seg icons" role="group" aria-label="Téma">
        <button id="thLight" aria-pressed="false" title="Világos">☀</button>
        <button id="thAuto" aria-pressed="true" title="Rendszer">◐</button>
        <button id="thDark" aria-pressed="false" title="Sötét">☾</button>
      </div>
    </div>
  </header>

  <aside class="side" id="side">
    <button class="grab" id="grab" aria-label="Panel húzása"><span></span></button>
    <div class="search">
      <div class="field">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Keresés">
        <kbd>/</kbd>
      </div>
    </div>
    <div class="scroll" id="scroll"></div>
    <div class="foot" id="foot"></div>
  </aside>

  <div class="map-wrap" id="mapwrap">
    <!-- A térkép EGY tab-állomás, nem 182. Odaérve a nyilak léptetnek a
         helyiségek közt, Enter választ — a roving tabindex mintája. Ha minden
         poligon külön tab-állomás lenne, a billentyűzetes felhasználónak
         182-szer kellene tabbolnia, hogy a térképen túljusson. -->
    <div class="stage" id="stage" tabindex="0" role="group"
         aria-describedby="mapHint"><div class="world" id="world"></div></div>
    <p id="mapHint" class="sr-only"></p>
    <!-- A kiválasztás, az útvonal és a szintváltás vizuális visszajelzés; élő
         régió nélkül a képernyőolvasó egyikről sem tudna. -->
    <p id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <div class="hud">
      <div class="plate fname" id="fname"></div>
      <div class="plate modesw" role="group" aria-label="Nézet">
        <button id="m2" aria-pressed="true">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="1.2" y="1.2" width="11.6" height="11.6" rx="1.4"/><path d="M1.2 5.6h11.6M5.6 5.6v7.2"/></svg>
          <span id="m2t">Alaprajz</span></button>
        <button id="m3" aria-pressed="false">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M7 1.3 12.6 4.4 7 7.5 1.4 4.4z"/><path d="M1.4 7.1 7 10.2l5.6-3.1M1.4 9.7 7 12.8l5.6-3.1"/></svg>
          <span id="m3t">Épület</span></button>
      </div>
    </div>

    <div class="rail" id="rail" role="group"></div>
    <div class="tools" role="group" id="tools">
      <button id="zin" title="Nagyítás">+</button>
      <button id="zout" title="Kicsinyítés">−</button>
      <button id="zfit" title="Illesztés">⤢</button>
    </div>
    <button class="legend-btn" id="legBtn">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4">
        <rect x="1" y="1.6" width="4" height="4" rx=".8"/><rect x="7" y="1.6" width="4" height="4" rx=".8"/>
        <rect x="1" y="6.6" width="4" height="4" rx=".8"/><rect x="7" y="6.6" width="4" height="4" rx=".8"/></svg>
      <span id="legT">Jelmagyarázat</span></button>
    <div class="plate legend-pop" id="legPop"></div>
  </div>

/* Amire egy hallgatónak nincs dolga: a 183 helyiségből 87 (47,5%). Nem

/* Az Épület nézet valódi 3D transzformokat használ, ezért a böngésző textúrába
   rajzolja a szinteket, és a nagyítás azt a bitmapet nyújtja fel — ettől lesz
   homályos, ahogy ráközelítesz. Sűrűbb SVG-vel sűrűbb a textúra is. A költség a
   pixelszámmal négyzetesen nő, ezért csak ott emelünk, ahol van rá tartalék:
   telefonon soha, és nagy pixelarányú kijelzőn sem, mert ott a böngésző már
   magától sűrűbben raszterizál. Minden méret a PXM-ből származik (PW/PH, BB,
   OFFX/OFFY, és a fit() is abból számol), így a megjelenés önmagát korrigálja —
   csak a szintek távolságát kell vele együtt skálázni. */
const SS = MOB() ? 1 : Math.min(2, Math.max(1, Math.ceil(2/(devicePixelRatio||1))));
const PXM=10*SS, GAP=(MOB()?84:118)*SS;
const LV=D.levels.map(l=>l.level), LVI=Object.fromEntries(LV.map((l,i)=>[l,i]));
const GW=D.grid.w, GH=D.grid.h, RES=D.grid.res, CELLS=GW*GH;
const PW=D.meta.w*PXM, PH=D.meta.h*PXM;
const BB=(()=>{let a=1e9,b=1e9,c=-1e9,d=-1e9;
  for(const r of D.rooms) for(const p of r.poly){
    if(p[0]<a)a=p[0]; if(p[0]>c)c=p[0]; if(p[1]<b)b=p[1]; if(p[1]>d)d=p[1];}
  return {x0:a,y0:b,x1:c,y1:d,cx:(a+c)/2,cy:(b+d)/2,w:(c-a)*PXM,h:(d-b)*PXM};})();
const OFFX=PW/2-BB.cx*PXM, OFFY=PH/2-BB.cy*PXM;
const ROOM=Object.fromEntries(D.rooms.filter(r=>r.code).map(r=>[r.code,r]));
const lvOf=lv=>D.levels.find(l=>l.level===lv)||{};
const lvName=lv=>lvOf(lv).name||String(lv);

const MASK={};
for(const k in D.masks){const b=atob(D.masks[k]),a=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); MASK[k]=a;}
const walk=(lv,i,j)=>{if(i<0||j<0||i>=GW||j>=GH)return false;
  const k=j*GW+i,a=MASK[lv];return a?(a[k>>3]>>(k&7))&1:0;};
const CELLLIST={};
for(const lv of LV){const a=[];for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)if(walk(lv,i,j))a.push(j*GW+i);
  CELLLIST[lv]=Int32Array.from(a);}
const CLEAR={};
function clearance(lv){
  if(CLEAR[lv])return CLEAR[lv];
  const c=new Uint8Array(CELLS),q=new Int32Array(CELLS);let h=0,t=0;
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const k=j*GW+i;
    if(!walk(lv,i,j)){c[k]=0;q[t++]=k;}else c[k]=255;}
  while(h<t){const k=q[h++],i=k%GW,j=(k-i)/GW,d=c[k];
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;
      const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>=GW||jj>=GH)continue;
      const kk=jj*GW+ii;if(c[kk]===255){c[kk]=Math.min(254,d+1);q[t++]=kk;}}}
  return CLEAR[lv]=c;
}
const RCELL={};
for(const r of D.rooms){
  const list=CELLLIST[r.level];let best=-1,bd=1e9;
  const cs=r.poly.concat([[r.cx,r.cy]]);
  for(let n=0;n<list.length;n++){const k=list[n],i=k%GW,j=(k-i)/GW,x=(i+.5)*RES,y=(j+.5)*RES;
    for(const p of cs){const dd=(p[0]-x)**2+(p[1]-y)**2;if(dd<bd){bd=dd;best=k;}}}
  if(best>=0&&bd<36)RCELL[r.id]=best;
}
function nearestCell(lv,x,y){
  const list=CELLLIST[lv];let best=-1,bd=1e9;
  for(let n=0;n<list.length;n++){const k=list[n],i=k%GW,j=(k-i)/GW;
    const dd=((i+.5)*RES-x)**2+((j+.5)*RES-y)**2;if(dd<bd){bd=dd;best=k;}}
  return bd<49?best:-1;
}

const LIFTS = (D.lifts && D.lifts.length) ? D.lifts : [{

  pts:[[0,54.67,5.97,"OA00FL3"],[1,54.32,6.11,"OA01FL3"],[2,56.21,5.17,"OA10EL3"],
       [3,56.21,5.17,"OA20EL3"],[4,56.21,5.17,"OA30EL1"],[5,56.22,5.17,"OA40EL1"]]

const PORTAL=new Map(), PORTAL_LIFT=new Map(), STAIRXY={};
const link=(map,A,B,w,meta)=>{
  if(!map.has(A))map.set(A,[]); if(!map.has(B))map.set(B,[]);
  map.get(A).push({to:B,w,meta}); map.get(B).push({to:A,w,meta});
};
const nodesOf=st=>st.pts.slice().sort((a,b)=>a[0]-b[0])
  .map(p=>({lv:p[0],c:nearestCell(p[0],p[1],p[2]),code:p[3],x:p[1],y:p[2]}))

  for(const p of pts) STAIRXY[st.id+"/"+p.lv]=p;
  // lépcsőnél csak a szomszédos szintek: végig kell menni rajtuk
  for(let i=0;i+1<pts.length;i++){
    const a=pts[i],b=pts[i+1];
    link(PORTAL, LVI[a.lv]*CELLS+a.c, LVI[b.lv]*CELLS+b.c, 15, {id:st.id,code:a.code,kind:"stairs"});
  }
}
for(const lf of LIFTS){
  const pts=nodesOf(lf);
  // A liftnél minden szintpár közvetlen: egy menetben átvisz, nem szintenként.
  // A súly a hívás/várakozás (25) plusz emeletenként 6 — így egy emeletre a
  // lépcső marad az olcsóbb, több szintnél a lift.
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const a=pts[i],b=pts[j], n=Math.abs(LVI[b.lv]-LVI[a.lv]);
    link(PORTAL_LIFT, LVI[a.lv]*CELLS+a.c, LVI[b.lv]*CELLS+b.c,
         25+6*n, {id:lf.id,code:lf.code,kind:"lift",levels:n});
  }
}
const LIFT_LEVELS=new Set(LIFTS.flatMap(l=>l.pts.map(p=>p[0])));

/* ------------------------------------------------------------------ útvonal */
class Heap{constructor(){this.a=[]}
  push(p,v){const a=this.a;a.push([p,v]);let i=a.length-1;
    while(i>0){const q=(i-1)>>1;if(a[q][0]<=a[i][0])break;[a[q],a[i]]=[a[i],a[q]];i=q}}
  pop(){const a=this.a,top=a[0],l=a.pop();
    if(a.length){a[0]=l;let i=0;for(;;){const x=2*i+1,y=x+1;let m=i;
      if(x<a.length&&a[x][0]<a[m][0])m=x;if(y<a.length&&a[y][0]<a[m][0])m=y;
      if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m}}return top}
  get size(){return this.a.length}}

function findRoute(r1,r2,portals){
  portals=portals||PORTAL;
  const s=RCELL[r1.id],t=RCELL[r2.id];
  if(s===undefined||t===undefined)return null;
  const S0=LVI[r1.level]*CELLS+s,T0=LVI[r2.level]*CELLS+t,N=LV.length*CELLS;
  const dist=new Float32Array(N).fill(Infinity),prev=new Int32Array(N).fill(-1),
        done=new Uint8Array(N),via={};
  dist[S0]=0;const pq=new Heap();pq.push(0,S0);
  while(pq.size){
    const [c,u]=pq.pop(); if(done[u])continue; done[u]=1; if(u===T0)break;
    const li=(u/CELLS)|0,k=u-li*CELLS,lv=LV[li],i=k%GW,j=(k-i)/GW,cl=clearance(lv);
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
      if(!di&&!dj)continue;
      const ii=i+di,jj=j+dj; if(!walk(lv,ii,jj))continue;
      if(di&&dj&&(!walk(lv,i+di,j)||!walk(lv,i,j+dj)))continue;
      const kk=jj*GW+ii,v=li*CELLS+kk,cc=cl[kk];
      const w=RES*(di&&dj?1.4142:1)*(cc<=1?1.6:cc<=2?1.15:1);
      if(c+w<dist[v]){dist[v]=c+w;prev[v]=u;pq.push(c+w,v);}
    }
    for(const p of (portals.get(u)||[]))
      if(c+p.w<dist[p.to]){dist[p.to]=c+p.w;prev[p.to]=u;via[p.to]=p.meta;pq.push(c+p.w,p.to);}
  }
  if(!isFinite(dist[T0]))return null;
  const path=[];let u=T0;while(u!==-1){path.push(u);u=prev[u];}path.reverse();
  return {path,via,a:r1,b:r2};
}
const nXY=u=>{const li=(u/CELLS)|0,k=u-li*CELLS,i=k%GW;
  return {lv:LV[li],x:(i+.5)*RES,y:(((k-i)/GW)+.5)*RES};};
function los(lv,a,b){
  const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/(RES*.5))||1;
  for(let t=0;t<=n;t++){const x=a[0]+(b[0]-a[0])*t/n,y=a[1]+(b[1]-a[1])*t/n;
    if(!walk(lv,Math.floor(x/RES),Math.floor(y/RES)))return false;}
  return true;
}
function smooth(lv,p){
  if(p.length<3)return p;
  const o=[p[0]];let i=0;
  while(i<p.length-1){let j=p.length-1;while(j>i+1&&!los(lv,p[i],p[j]))j--;o.push(p[j]);i=j;}
  return o;
}
function analyse(rt){
  const segs=[];let cur=null;
  for(const u of rt.path){const p=nXY(u);
    if(!cur||cur.lv!==p.lv){if(cur)segs.push(cur);cur={lv:p.lv,pts:[],vias:[]};}
    cur.pts.push([p.x,p.y]);
    if(rt.via[u])cur.vias.push(rt.via[u]);}
  if(cur)segs.push(cur);
  for(const s of segs)s.pts=smooth(s.lv,s.pts);
  let d=0;for(const s of segs)for(let i=0;i+1<s.pts.length;i++)
    d+=Math.hypot(s.pts[i+1][0]-s.pts[i][0],s.pts[i+1][1]-s.pts[i][1]);
  const vert=segs.length-1;
  // A lift nem szintenként telik: hívás/várakozás plusz a menet.
  let vsec=0;
  for(let i=0;i+1<segs.length;i++){
    const v=segs[i+1].vias[0]||segs[i].vias[segs[i].vias.length-1];
    vsec += (v&&v.kind==="lift") ? 35+8*(v.levels||1) : 22;
  }
  return {segs,dist:Math.round(d),vert,min:Math.max(1,Math.ceil((d/1.3+vsec)/60))};
}
function steps(rt,mm){
  const t=T(),o=[];
  o.push({ico:"◉",t:t.go,d:`${rt.a.code} · ${rt.a.name||rt.a.cat}`,lv:rt.a.level});
  mm.segs.forEach((s,si)=>{
    let run=0;
    for(let i=0;i+1<s.pts.length;i++){
      const a=s.pts[i],b=s.pts[i+1],c=s.pts[i+2];
      run+=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(c){
        let g=Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]);
        while(g>Math.PI)g-=2*Math.PI;while(g<-Math.PI)g+=2*Math.PI;
        if(Math.abs(g)>Math.PI/4.5&&run>2.5){
          o.push({ico:g>0?"↷":"↶",t:g>0?t.right:t.left,d:`${t.walk} ~${Math.round(run)} ${t.m}`,lv:s.lv});
          run=0;
        }
      }
    }
    if(run>3)o.push({ico:"↑",t:`${t.walk} ~${Math.round(run)} ${t.m}`,lv:s.lv});
    const nx=mm.segs[si+1];
    if(nx){
      const v=(nx.vias[0]||s.vias[s.vias.length-1]);
      const isLift=!!(v&&v.kind==="lift");
      o.push({ico:isLift?"⇅":"⌁",v:true,lv:nx.lv,
        t:`${isLift?t.byLift:t.stairs} ${nx.lv>s.lv?t.up:t.down} ${t.to.replace("%s",lvName(nx.lv).toLowerCase())}`,
        d:v?`${isLift?t.liftVia:t.via} · ${v.code}`:""});
    }
  });
  o.push({ico:"◆",t:t.arrive,d:`${rt.b.code} · ${rt.b.name||rt.b.cat}`,lv:rt.b.level});
  return o;
}

/* ------------------------------------------------------------------ színek */
const DARK=[11,19,28];
const _c={};
const isDark=()=>{const a=document.documentElement.getAttribute("data-theme");
  return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches;};
function cc(cat){
  const base=D.cats[cat]||"#cfd6dd",key=cat+(isDark()?"|d":"|l");
  if(_c[key])return _c[key];
  let out=base;
  if(isDark()){
    const v=[1,3,5].map(i=>parseInt(base.slice(i,i+2),16));
    const mx=v.map((x,i)=>x*.36+DARK[i]*.64),m=(mx[0]+mx[1]+mx[2])/3;
    out="#"+mx.map(x=>Math.max(0,Math.min(255,Math.round(m+(x-m)*1.8)))
      .toString(16).padStart(2,"0")).join("");
  }
  return _c[key]=out;
}

const NS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);return x;};
const world=$("world"), app=$("app"), stage=$("stage");
const FLOOR={};

function buildFloors(){
  world.textContent="";
  const g=document.createElement("div");
  g.className="ground";
  g.style.cssText=`width:${BB.w*1.5}px;height:${BB.h*1.15}px;left:${-BB.w*.75}px;top:${-BB.h*.57}px`;
  world.appendChild(g);

  D.levels.forEach((L,idx)=>{
    const f=document.createElement("div");
    f.className="floor"; f.style.width=PW+"px"; f.style.height=PH+"px";
    f.dataset.lv=L.level; f.style.setProperty("--i",idx);

    const svg=el("svg",{width:PW,height:PH,viewBox:`0 0 ${D.meta.w} ${D.meta.h}`});
    const rs=D.rooms.filter(r=>r.level===L.level);
    const wallPath=(D.walls[String(L.level)]||[]).map(w=>"M"+w.map(p=>p.join(" ")).join("L")+"Z").join("");

    // A sziluett, az árnyék és a kattintófelület ugyanazt a három réteget rajzolta
    // ki helyiségenként külön poligonnal. Mindhárom egyetlen összefüggő alakzat,
    // ezért egy-egy path alútvonalaiként megy ki: helyiségenként 3 csomópont
    // helyett összesen 3. Az árnyéknál ez a féligáteresztő kitöltés átfedéseinél
    // keletkező sötétebb foltokat is megszünteti.
    const slabD = rs.map(r=>"M"+r.poly.map(p=>p.join(" ")).join("L")+"Z").join("");

    // A képernyőolvasó számára a szintből egyetlen dolog érdekes: a helyiségek.
    // A födém, az árnyék, a falak, a feliratok és az útvonalrajz mind ugyanazt
    // mondják el vizuálisan, amit a panel és az élő régió szövegesen — névtelen
    // grafikus csomópontként viszont csak zajt adnának, ezért aria-hidden.
    f.setAttribute("role","group");
    f.setAttribute("aria-label",L.name);

    // 1. födém-sziluett (helyiségek + falak összeolvasztva) + vetett árnyék
    svg.appendChild(el("path",{class:"slabsh",transform:"translate(0.7 2)",d:slabD||"M0 0","aria-hidden":"true"}));
    svg.appendChild(el("path",{class:"slab",d:(slabD+wallPath)||"M0 0","aria-hidden":"true"}));

    // 2. kattintófelület (3D módban) — billentyűzettel a szintváltó sáv felel meg neki
    const hit=el("path",{class:"hit",fill:"transparent",d:(slabD+wallPath)||"M0 0","aria-hidden":"true"});
    hit.addEventListener("click",e=>{e.stopPropagation();dive(L.level);});
    svg.appendChild(hit);

    // 3. helyiségek
    const gr=el("g",{class:"rooms"});
    for(const r of rs){
      const po=el("polygon",{points:r.poly.map(p=>p.join(",")).join(" "),fill:cc(r.cat),
        class:"room"+(r.code?" pick":"")+(S.sel===r.code?" sel":"")+(STAFF.has(r.cat)?" staff":"")});
      if(STAFF.has(r.cat)) po.style.setProperty("--cat",cc(r.cat));
      if(r.code){
        po.addEventListener("click",e=>{e.stopPropagation();select(r.code);});
        const nm=r.code+" · "+(r.name||r.cat);
        const ti=el("title");ti.textContent=nm;po.appendChild(ti);
        // A <title> egérre buboréknév, de a hozzáférhető nevet nem bízzuk rá:
        // a gombszerepnél az aria-label a kiszámítási sor elején áll, tehát
        // biztosan az jut el a felolvasóig. tabindex=-1: a poligon csak a
        // nyilakkal kap fókuszt, a tab-sorrendben nincs benne.
        po.setAttribute("role","button");
        po.setAttribute("aria-label",nm);
        po.setAttribute("tabindex","-1");
        po.dataset.code=r.code;
      } else {
        po.setAttribute("aria-hidden","true");   // kód nélküli helyiség: nem választható
      }
      gr.appendChild(po);
    }
    svg.appendChild(gr);
    const wallNode=el("path",{d:wallPath||"M0 0",class:"walls","fill-rule":"evenodd","aria-hidden":"true"});
    svg.appendChild(wallNode);

    // 4. feliratok (lustán, csak amikor a szint aktív lesz)
    const gl=el("g",{class:"glabel","aria-hidden":"true"});
    svg.appendChild(gl);
    const rt=el("g",{class:"rt","aria-hidden":"true"}); svg.appendChild(rt);
    f.appendChild(svg);
    const tag=document.createElement("div");
    tag.className="ftag";
    tag.setAttribute("aria-hidden","true");
    tag.innerHTML=`${esc(L.name)}<em>${rs.length}</em>`;
    f.appendChild(tag);
    world.appendChild(f);
    FLOOR[L.level]={box:f,svg,route:rt,labels:gl,rooms:gr,walls:wallNode,tag,idx,built:false,rs};
  });
}

function buildLabels(lv){
  const F=FLOOR[lv]; if(F.built) return; F.built=true;
  const gl=F.labels;
  for(const r of F.rs){
    if(!r.code) continue;
    if(!S.staff && STAFF.has(r.cat)) continue;   // halványítva nem feliratozzuk
    const sc=r.code.slice(4);
    const fs=Math.max(.5,Math.min(1.2,(r.lw-1.4)/(sc.length*.66),r.lh/3.4));
    if(fs<.55) continue;
    const tr=`rotate(${r.ang} ${r.cx} ${r.cy})`;
    const nm=r.lh>3.8&&r.lw>5.5&&r.name;
    const a=el("text",{x:r.cx,y:r.cy+(nm?-.3:.42),class:"lbl","font-size":fs.toFixed(2),transform:tr});
    a.textContent=sc; gl.appendChild(a);
    if(nm){
      const max=Math.max(5,Math.floor((r.lw-1.2)/(fs*.55)));
      const b=el("text",{x:r.cx,y:r.cy+fs*1.3,class:"lbl2","font-size":(fs*.8).toFixed(2),transform:tr});
      b.textContent=r.name.length>max?r.name.slice(0,max-1)+"…":r.name;
      gl.appendChild(b);
    }
  }
}

/* A világ rotateX(x) rotateZ(z)-t kap; ennek az inverze rotateZ(-z) rotateX(-x),
   így a felirat a forgatás közben is a néző felé néz. */
const tagTransform=()=> S.mode===3
  ? `translate(-100%,-50%) rotateZ(${-S.rot.z}deg) rotateX(${-S.rot.x}deg)`
  : `translate(-100%,-50%) rotate(${-bearing()}deg)`;
function orientTags(){ for(const lv of LV) FLOOR[lv].tag.style.transform=tagTransform(); }

function placeTags(){
  // a 3D-forgatás visszaforgatása, hogy a felirat a néző felé nézzen
  for(const lv of LV){
    const F=FLOOR[lv];
    F.tag.style.left=(BB.x0*PXM-14)+"px";
    F.tag.style.top=(BB.cy*PXM+BB.h*.22)+"px";
    F.tag.style.transform=tagTransform();
  }
}

/* Az irány (bearing) mindkét nézetben ugyanaz az `S.rot.z`, de alaprajzon az
   izometrikus alapálláshoz KÉPEST értendő: `rot.z === ROT0.z` esetén a tervlap
   úgy áll, ahogy meg van rajzolva. Így egy csavarás ugyanannyit fordít a két
   nézetben, és a váltás megtartja az irányt. */
function bearing(){ return S.mode===3 ? S.rot.z : S.rot.z-ROT0.z; }
function worldTransform(){
  const v=S.view;
  const base=`translate(${v.x}px,${v.y}px) scale(${v.k})`;
  // Alaprajzon sima 2D-s rotate() megy, nem rotateZ(): az nem kér 3D kontextust,
  // így a .flat2d lapos gyorsútvonala (76 fps telefonon) megmarad.
  return S.mode===3 ? `${base} rotateX(${S.rot.x}deg) rotateZ(${S.rot.z}deg)`
                    : `${base} rotate(${bearing()}deg)`;
}
/* Az aktív szintet a FÖLÖTTE lévők takarják el: a +Z a néző felé mutat, tehát
   a magasabb emelet van elöl, és a födémje ráfekszik az alaprajzra. Öt egymásra
   tett, egyenként 0,82-es födémen keresztül semmi nem látszik — a földszint
   alaprajza gyakorlatilag eltűnt, és minél laposabb volt a dőlés, annál inkább.
   Ezért a fölöttes szintek szintenként halványodnak, a dőlés pedig visszaadja
   őket: élből nézve elcsúsznak az aktív mellől, ott nem takarnak, és a köteg
   megint elmondja, hogy hány emeletes az épület. Az aktív alatti szintek nem
   takarnak, ők maradnak teljes értékű kontextusnak. */
const FLOOR_OP=.82, ABOVE_FADE=.42;
function floorOpacity(idx,ai){
  if(idx===ai) return 1;
  if(idx<ai) return FLOOR_OP;
  const faded=FLOOR_OP*ABOVE_FADE**(idx-ai);
  const cover=Math.cos(S.rot.x*Math.PI/180);      // 1 laposan … 0 élből
  return faded+(FLOOR_OP-faded)*(1-cover)**2;
}
/* A dőléstől függ, ezért nem elég a szintváltáskor beállítani: a gesztus alatt
   képkockánként újra kell számolni, különben a döntés közben a köteg a régi
   átlátszóságával marad. Egy helyen íródik, hogy a két hívó ne csússzon szét. */
function syncFloorOpacity(){
  const ai=LVI[S.level];
  for(const lv of LV){ const F=FLOOR[lv];
    F.box.style.opacity = S.mode===3 ? floorOpacity(F.idx,ai) : (F.idx===ai?1:0); }
}
function updateView(){
  world.style.transform=worldTransform();
  const ai=LVI[S.level];
  for(const lv of LV){
    const F=FLOOR[lv], d=F.idx-ai;
    const z=S.mode===3 ? d*GAP : 0;
    F.box.style.transform=`translate(-50%,-50%) translate(${OFFX}px,${OFFY}px) translateZ(${z}px)`;
    const on=lv===S.level;
    F.box.classList.toggle("on",on);
    // az átlátszóságot a syncFloorOpacity() írja, a ciklus után
    F.rooms.style.opacity = S.mode===3 ? (on?1:0) : 1;
    F.walls.style.opacity = S.mode===3 ? (on?1:.32) : 1;
    F.box.style.pointerEvents = S.mode===3 ? "auto" : (on?"auto":"none");
    // Alaprajz nézetben a rejtett szintek opacity:0-val is rétegben maradnak.
    // A .55s-os áttűnés után visibility:hidden kiveszi őket a festésből és a
    // hit-tesztből; a késleltetés miatt a szintváltás áttűnése megmarad.
    clearTimeout(F.hideT);
    if(S.mode===3 || on) F.box.style.visibility="";
    else F.hideT=setTimeout(()=>{
      if(S.mode!==3 && lv!==S.level) F.box.style.visibility="hidden";
    },600);
    F.box.style.zIndex = 100+F.idx;
    // Csak az aktív szint helyiségei látszanak a képernyőolvasónak: hét szint
    // mind a 183 helyisége egyszerre bejárhatatlan lenne, és a nem aktív
    // szintek amúgy sem kattinthatók. aria-hidden nem tartalmazhatja a fókuszt,
    // ezért ha ott áll, előbb kihozzuk a térkép szintjére.
    if(!on && F.box.contains(document.activeElement)) stage.focus();
    F.box.setAttribute("aria-hidden",on?"false":"true");
    if(on && S.mode===2) buildLabels(lv);
    F.labels.style.opacity = S.mode===3 ? 0 : 1;
  }
  syncFloorOpacity();
  const g=world.querySelector(".ground");
  if(g) g.style.transform=`translateZ(${-ai*GAP-26}px)`;
}

/* ---------- útvonal rajzolása ---------- */
function drawRoute(){
  for(const lv of LV) FLOOR[lv].route.textContent="";
  world.querySelectorAll(".riser").forEach(n=>n.remove());
  if(!S.route) return;
  const mm=S.mm;
  mm.segs.forEach((s,si)=>{
    const g=FLOOR[s.lv].route;
    if(s.pts.length>1){
      const pts=s.pts.map(p=>p.join(",")).join(" ");
      g.appendChild(el("polyline",{points:pts,class:"rl casing"}));
      const line=el("polyline",{points:pts,class:"rl draw"});
      g.appendChild(line);
      const L=line.getTotalLength?line.getTotalLength():200;
      line.style.setProperty("--len",L);
    }
    const nx=mm.segs[si+1];
    if(nx){
      const p=s.pts[s.pts.length-1];
      ring(g,p);
      const dz=(FLOOR[nx.lv].idx-FLOOR[s.lv].idx)*GAP;
      riser(s.lv,p,Math.abs(dz),dz>0);
      ring(FLOOR[nx.lv].route,nx.pts[0]);
    }
  });
  const f=mm.segs[0],l=mm.segs[mm.segs.length-1];
  pin(FLOOR[f.lv].route,f.pts[0],"A","var(--accent)","pin-a");
  pin(FLOOR[l.lv].route,l.pts[l.pts.length-1],"B","var(--route)","pin-b");
}
function pin(g,p,ch,col,cls){
  g.appendChild(el("circle",{cx:p[0],cy:p[1],r:1.75,fill:col,stroke:"var(--slab)",
    "stroke-width":.5,class:cls}));
  const t=el("text",{x:p[0],y:p[1]+.62,class:"mkt "+cls});t.textContent=ch;g.appendChild(t);
}
function ring(g,p){ g.appendChild(el("circle",{cx:p[0],cy:p[1],r:1.5,class:"ring"})); }
function riser(lv,p,h,upward){
  const d=document.createElement("div");
  d.className="riser";
  d.style.left=(p[0]*PXM)+"px";
  d.style.top=(p[1]*PXM)+"px";
  d.style.height=h+"px";
  d.style.transform=`translate(-50%,-100%) rotateX(${upward?-90:90}deg)`;
  FLOOR[lv].box.appendChild(d);
}

/* ------------------------------------------------------------------ nézet */
function projBBox(){
  const three=S.mode===3;
  // Ugyanaz a képlet szolgálja ki a két nézetet: alaprajzon a dőlés 0 (ca=1,
  // sa=0) és nincs szintek közti távolság, de a forgatás ott is beleszámít —
  // enélkül az elforgatott tervlapra rosszul illesztene a ⤢.
  const b=bearing()*Math.PI/180, a=S.rot.x*Math.PI/180;
  const cb=Math.cos(b), sb=Math.sin(b);
  const ca=three?Math.cos(a):1, sa=three?Math.sin(a):0;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const ai=LVI[S.level];
  for(const r of D.rooms){
    if(!three && r.level!==S.level) continue;
    const z = three ? (LVI[r.level]-ai)*GAP : 0;
    for(let i=0;i<r.poly.length;i+=2){
      const X=(r.poly[i][0]-BB.cx)*PXM, Y=(r.poly[i][1]-BB.cy)*PXM;
      const px=X*cb-Y*sb, py=(X*sb+Y*cb)*ca - z*sa;
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
    }
  }
  return {w:Math.max(1,x1-x0), h:Math.max(1,y1-y0), cx:(x0+x1)/2, cy:(y0+y1)/2};
}
function insetFor(n){
  if(!MOB()) return 0;
  return n==="peek" ? 128 : Math.round(innerHeight*.46)+10;
}
function fit(){
  const w0=$("mapwrap").clientWidth, h0=$("mapwrap").clientHeight;
  const inset = insetFor(typeof snap==="undefined"?"peek":snap), sideGap = MOB()?58:0;
  const w = w0-sideGap, h = h0-inset;
  const P = projBBox();
  const k = Math.min(w/P.w, h/P.h) * (MOB()?.95:.9);
  S.view={k, x:-P.cx*k - sideGap/2, y:-P.cy*k - inset/2};
  S.dirty=false;
  updateView();
}
let flatT=0;
function syncFlat(){
  clearTimeout(flatT);
  if(S.mode===3){ app.classList.remove("flat2d"); return; }
  flatT=setTimeout(()=>{ if(S.mode===2) app.classList.add("flat2d"); },1050);
}
function setMode(m){
  if(S.mode===m)return;
  S.mode=m;
  app.classList.toggle("m3",m===3); app.classList.toggle("m2",m===2);
  $("m2").setAttribute("aria-pressed",m===2); $("m3").setAttribute("aria-pressed",m===3);
  applyMapLabel();
  fit(); syncFlat();
}
function dive(lv){
  S.level=lv; renderRail();
  if(S.mode===3) setMode(2); else updateView();
  // A födémre kattintás szintet vált — a nézetváltás mellett ez a lényegi hír.
  sayLevel();
}
(function(){
  const stage=$("stage");
  const pts=new Map();
  let drag=null,moved=0,pinch=null;
  const nowOn =()=>{world.classList.add("now");    app.classList.add("navving");};
  const nowOff=()=>{world.classList.remove("now"); app.classList.remove("navving");};
  /* A két ujj fogása: középpont, távolság és az általuk bezárt szög. A szög a
     csavaráshoz kell — enélkül a kétujjas gesztus csak nagyítani és tolni
     tudott, forgatni nem. */
  const mid=()=>{const a=[...pts.values()], dx=a[1].x-a[0].x, dy=a[1].y-a[0].y;
    return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,
            d:Math.hypot(dx,dy), a:Math.atan2(dy,dx)};};
  /* Ennyi fok elcsavarás után indul a forgatás. Holtjáték nélkül minden
     csippentés forgatna is valamennyit, mert a két ujj sosem pontosan egy
     tengely mentén mozdul; a küszöböt utána levonjuk, hogy induláskor ne
     ugorjon egyet a térkép. */
  const TWIST_DEAD=8;

  /* A pointermove sűrűbben tüzel, mint ahány képkocka van (telefonon 120 Hz+),
     ezért az írást egy rAF-ra fogjuk össze: képkockánként pontosan egy transform. */
  /* A drag objektum egyetlen helyen épül. Korábban a pointerdown és az ujjak
     fogyásakor külön-külön készült, és az utóbbiból kimaradt a pan/rz/rx —
     így a rotálóág undefined-ből számolt, S.rot NaN lett, a transzformot a
     böngésző eldobta, és a térkép megfagyott. */
  const startDrag=(x,y,pan)=>({x,y,vx:S.view.x,vy:S.view.y,rz:S.rot.z,rx:S.rot.x,pan});

  let raf=0, needTags=false;
  const paint=()=>{ raf=0; world.style.transform=worldTransform();
                    // a szintek átlátszósága a dőléstől függ, döntés közben is
                    if(needTags){ needTags=false; orientTags(); syncFloorOpacity(); } };
  const schedule=()=>{ if(!raf) raf=requestAnimationFrame(paint); };
  const scheduleRot=()=>{ needTags=true; schedule(); };

  /* A rect olvasása transform-írás után kényszerített layoutot okoz. Gesztusonként
     egyszer olvassuk ki, nem mozdulatonként. */
  let rect=null;
  const getRect=()=>rect||(rect=$("mapwrap").getBoundingClientRect());
  const dropRect=()=>{rect=null;};
  addEventListener("resize",dropRect,{passive:true});
  addEventListener("orientationchange",dropRect);
  addEventListener("scroll",dropRect,{passive:true});

  stage.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    stage.setPointerCapture(e.pointerId); dropRect(); nowOn();
    if(pts.size===1){
      // Épület nézetben egy ujj forgat, Alaprajzon tol. Shift vagy a középső/jobb
      // gomb egérrel forgatás helyett tolás, hogy asztali gépen is legyen pan.
      drag=startDrag(e.clientX,e.clientY,
        S.mode!==3 || e.shiftKey || e.button===1 || e.button===2);
      moved=0;
    }
    else if(pts.size===2){const m=mid();
      pinch={d:m.d,k:S.view.k,x:S.view.x,y:S.view.y,mx:m.x,my:m.y,
             last:m.a,tw:0,rz:S.rot.z,rot:false,slack:0};drag=null;}
  });
  stage.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){
      const m=mid(), f=m.d/pinch.d;
      const nk=Math.max(.15,Math.min(10,pinch.k*f)), g=nk/pinch.k;

      /* Csavarás. A teljes elfordulást képkockánként gyűjtjük, nem a
         kiinduló szöghöz képest mérjük: így a ±180°-on átfordulva sem ugrik,
         és egy gesztuson belül akárhányszor körbe lehet forgatni. */
      let da=m.a-pinch.last;
      if(da> Math.PI) da-=2*Math.PI; else if(da<-Math.PI) da+=2*Math.PI;
      pinch.last=m.a; pinch.tw+=da;
      const twDeg=pinch.tw*180/Math.PI;
      if(!pinch.rot && Math.abs(twDeg)>TWIST_DEAD){
        pinch.rot=true; pinch.slack=Math.sign(twDeg)*TWIST_DEAD*Math.PI/180;
      }
      const th=pinch.rot ? pinch.tw-pinch.slack : 0;

      const r=getRect();
      const cx=pinch.mx-r.left-r.width/2, cy=pinch.my-r.top-r.height/2;
      /* Alaprajzon a forgatás a két ujj közepe köré megy: a világ ott sima
         2D-s forgatást kap, így a fogáspont alatti térképrész pontosan a hely
         marad. Épület nézetben a rotateZ a megdöntött síkban hat, azt egy
         képernyő-síkú eltolással nem lehet pontosan kiegyenlíteni — ott a
         forgatás az épület közepe körül fordul, ami körbejárásnál amúgy is a
         várt viselkedés. */
      const ct=S.mode===3?1:Math.cos(th), st=S.mode===3?0:Math.sin(th);
      const ox=pinch.x-cx, oy=pinch.y-cy;
      S.view.k=nk;
      S.view.x=cx+(ox*ct-oy*st)*g+(m.x-pinch.mx);
      S.view.y=cy+(ox*st+oy*ct)*g+(m.y-pinch.my);
      if(pinch.rot){
        const nz=pinch.rz+th*180/Math.PI;
        if(Number.isFinite(nz)) S.rot.z=nz;          // sose ragadjon be
      }
      S.dirty=true; pinch.rot?scheduleRot():schedule(); moved=99; return;
    }
    if(!drag)return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    if(drag.pan){
      S.view.x=drag.vx+dx; S.view.y=drag.vy+dy;
      S.dirty=true; schedule();
    }else{
      /* A modell az ujjat követi: a hozzánk közeli oldal arra megy, amerre húzod.
         A világ rotateX(rx) rotateZ(rz)-t kap, egy pont képernyő-x-e cos(θ+rz),
         ennek deriváltja rz szerint -sin(θ+rz); az elöl lévő pontnál θ+rz=90°,
         vagyis -1 — ezért kell a rz-t csökkenteni jobbra húzáskor.
         ~300px vízszintes húzás ≈ negyed fordulat; a dőlés vékonyabb sávban mozog. */
      const nz = drag.rz - dx*0.30;
      const nx = Math.max(TILT_MIN,Math.min(TILT_MAX, drag.rx - dy*0.22));
      if(!Number.isFinite(nz)||!Number.isFinite(nx)) return;   // sose ragadjon be
      S.rot.z = nz; S.rot.x = nx;
      S.dirty=true; scheduleRot();
    }
  },{passive:true});
  const end=e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    // Az utolsó pozíciót még a .now osztály alatt véglegesítjük, különben a
    // visszakapcsoló 1s-os transition ráugrana a függőben lévő képkockára.
    if(raf){cancelAnimationFrame(raf); paint();}
    if(pts.size===0){window.__moved=moved>6;drag=null;setTimeout(nowOff,40);}
    else if(pts.size===1){
      /* A csippentésből egy ujjra fogyva tolunk tovább: a gesztus két ujjal
         indult, hirtelen forgatásba váltani meglepő lenne. */
      const a=[...pts.values()][0];
      drag=startDrag(a.x,a.y,true);
    }
  };
  stage.addEventListener("pointerup",end); stage.addEventListener("pointercancel",end);
  stage.addEventListener("wheel",e=>{e.preventDefault();nowOn();
    zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);setTimeout(nowOff,60);},{passive:false});
  $("zin").onclick=()=>zoom(1.22); $("zout").onclick=()=>zoom(1/1.22); $("zfit").onclick=()=>{ S.rot={...ROT0}; orientTags(); fit(); };
  function zoom(f,cx,cy){
    const nk=Math.max(.15,Math.min(10,S.view.k*f));f=nk/S.view.k;
    const r=getRect();
    const mx=(cx==null?r.width/2:cx-r.left)-r.width/2, my=(cy==null?r.height/2:cy-r.top)-r.height/2;
    S.view.x=mx-(mx-S.view.x)*f; S.view.y=my-(my-S.view.y)*f; S.view.k=nk;
    S.dirty=true; schedule();
  }
})();
$("stage").addEventListener("click",()=>{if(window.__moved)return;
  if(MOB()&&snap==="full"){setSnap("peek");return;}
  if(S.sel){S.sel=null;refreshSel();renderPanel();}});

/* --------------------------------------------------- foglalható termek */
/* Az egyetem hivatalos teremnevei (ingatlan-nyilvántartás) és a hozzájuk
   tartozó foglalások (teremfoglalási tábla). A két forrás a teremnéven
   találkozik — a férőhelyek az összes közös teremnél egyeznek. Az alaprajz
   viszont más kódrendszert használ, ezért ezeket nem tesszük ki a térképre. */
let TM=null, tmLoading=null;
const tmLoad=()=>tmLoading||(tmLoading=fetch("data/termek.json")
  .then(r=>r.ok?r.json():null).then(d=>{TM=d;return d;}).catch(()=>null));

const hhmm=m=>String((m/60)|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
/* "8.00 -  8.45" -> [480, 525] */
function periodSpan(txt){
  const m=String(txt||"").match(/(\d{1,2})[.:](\d{2})\s*-\s*(\d{1,2})[.:](\d{2})/);
  if(!m)return null;
  return [(+m[1])*60+(+m[2]), (+m[3])*60+(+m[4])];
}
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* Egy terem adott napi foglalásai, az egymást követő azonos sávok összevonva. */
function tmDay(room,iso){
  const out=[];
  for(const [d,per,fac,kind] of room.slots){
    if(d!==iso) continue;
    const sp=periodSpan(TM.periods[per]); if(!sp) continue;
    const last=out[out.length-1];
    if(last && last.kind===kind && last.fac===fac && last.to===sp[0]) last.to=sp[1];
    else out.push({from:sp[0],to:sp[1],fac,kind,per});
  }
  return out.sort((a,b)=>a.from-b.from);
}

/* Most szabad-e. Ha a napra nincs adatunk, azt mondjuk meg — nem azt, hogy szabad. */
function tmNow(room,now){
  const iso=isoDay(now);
  if(!TM || iso<TM.from || iso>TM.to) return {state:"nodata"};
  const min=now.getHours()*60+now.getMinutes();
  const day=tmDay(room,iso);
  for(const b of day) if(min>=b.from&&min<b.to) return {state:"busy",b};
  const next=day.find(b=>b.from>min);
  return {state:"free",next};
}

function renderTermek(){
  const t=T(), box=$("scroll");
  if(!TM){ box.innerHTML=`<div class="empty" style="padding:18px 16px">…</div>`; return; }
  const now=new Date(), iso=isoDay(now);
  const KIND={eloadas:"kEloadas",vizsga:"kVizsga",levelezos:"kLevelezos",
              tavos:"kTavos",foglalas:"kFoglalas",egyeb:"kEgyeb"};
  const kn=k=>t[KIND[k]||"kEgyeb"];

  const rows=TM.rooms.map(r=>{
    const st=tmNow(r,now), open=S.tmOpen===r.nev;
    let badge,sub;
    if(st.state==="nodata"){ badge=`<span class="tmb none">–</span>`; sub=t.tmNoData; }
    else if(st.state==="busy"){ badge=`<span class="tmb busy">${t.tmBusy}</span>`;
      sub=`${esc(st.b.fac)} · ${kn(st.b.kind)} · ${t.tmUntil.replace("%s",hhmm(st.b.to))}`; }
    else { badge=`<span class="tmb free">${t.tmFree}</span>`;
      sub=st.next?t.tmFrom.replace("%s",hhmm(st.next.from)):t.tmNothing; }

    const day=TM.from<=iso&&iso<=TM.to?tmDay(r,iso):[];
    const detail=open?`<div class="tmd">
      <div class="tmdh">${t.tmToday} · ${iso}</div>
      ${day.length?day.map(b=>`<div class="tmr"><span class="mono">${hhmm(b.from)}–${hhmm(b.to)}</span>
        <span>${esc(b.fac)} · ${kn(b.kind)}</span></div>`).join("")
       :`<div class="tmr empty2">${TM.from<=iso&&iso<=TM.to?t.tmNothing:t.tmNoData}</div>`}
      ${r.felsz.length?`<div class="tmf">${r.felsz.map(f=>`<span class="tag">${esc(f)}</span>`).join("")}</div>`:""}
    </div>`:"";

    return `<button class="tmrow${open?" open":""}" data-tm="${esc(r.nev)}">
        <span class="tmn"><b>${esc(r.nev)}</b>${r.cim!==r.nev?`<i>${esc(r.cim)}</i>`:""}</span>
        <span class="tms">${sub}</span>
        <span class="tmc mono">${r.fero} fő</span>${badge}</button>${detail}`;
  }).join("");

  box.innerHTML=`<div class="sec"><div class="eyebrow">${t.tmTitle}</div>
    <div class="tmlist">${rows}</div>
    <p class="note">${t.tmNote}<br><span class="mono">${t.tmRange.replace("%s",TM.from).replace("%s",TM.to)}</span></p></div>`;
  box.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{
    S.tmOpen=S.tmOpen===b.dataset.tm?null:b.dataset.tm; renderTermek(); });
}

/* ------------------------------------------------------------------ UI */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
function search(q){
  q=norm(q.trim()); if(!q)return[];
  return D.rooms.filter(r=>r.code).map(r=>{
    const c=norm(r.code),n=norm(r.name||""),k=norm(r.cat);let s=-1;
    if(c===q||c.slice(4)===q)s=0; else if(c.startsWith(q)||c.slice(4).startsWith(q))s=1;
    else if(n.startsWith(q))s=2; else if(n.includes(q))s=3;
    else if(k.includes(q))s=4; else if(c.includes(q))s=5;
    return s<0?null:{r,s};
  }).filter(Boolean).sort((a,b)=>a.s-b.s||a.r.code.localeCompare(b.r.code)).slice(0,50).map(x=>x.r);
}
function renderPanel(){
  S.termek=false;
  const t=T(),box=$("scroll"),q=$("q").value.trim();

      }
      h+=`<div class="sum">
        <div><b class="mono">${mm.dist}</b><i>${t.m}</i><small>${t.dist}</small></div>
        <div><b class="mono">${mm.min}</b><i>${t.min}</i><small>${t.time}</small></div>

      <div class="qgrid">
        <button class="qbtn" data-q="WC"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"

          <circle cx="14" cy="4" r="1.7"/><path d="M11.3 17l1.1-5.4h-1.1l1.4-4.8h2.6l1.4 4.8h-1.1L16.7 17z"/></svg>
          <span>${t.qwc}<small>${sub}</small></span></button>

function quick(key){
  if(key==="@ROOMS"){ S.view0=S.tmOpen=null; S.termek=true;
    renderTermek(); tmLoad().then(()=>{ if(S.termek) renderTermek(); });
    if(MOB()) setSnap("full");
    return; }
  if(key==="@ENTRY"){ const e=ROOM["OA00FK1"]; if(e){S.from=e.code;select(e.code);renderPanel();} return; }
  const src = S.from ? ROOM[S.from]
    : (ROOM["OA00FK1"] || D.rooms.filter(r=>r.circ&&r.level===S.level).sort((a,b)=>b.area-a.area)[0]);
  if(!src) return;
  let best=null;
  for(const r of D.rooms){
    if(!r.code||!(r.name||"").toUpperCase().includes(key)) continue;
    const rt=findRoute(src,r); if(!rt) continue;
    const m=analyse(rt);
    if(!best||m.dist<best.m.dist) best={r,m};
  }
  if(!best) return;
  S.from=src.code; S.to=best.r.code; S.sel=best.r.code;
  recompute(); refreshSel();
}

  S.mms   ={stairs:S.routes.stairs?analyse(S.routes.stairs):null,
            lift:  S.routes.lift  ?analyse(S.routes.lift  ):null};
  // A liftet csak akkor kínáljuk fel, ha tényleg szintet vált vele.
  S.hasLift=!!(S.routes.lift&&S.mms.lift&&S.mms.lift.vert>0);
  S.via="stairs";                       // a lépcső az alapértelmezés
  applyVia();

  if(S.mm&&!S.mm.segs.some(s=>s.lv===S.level)){S.level=S.mm.segs[0].lv;renderRail();}
  updateView();
  if(S.route){ setSnap("mid"); if(!S.dirty) fit(); }

  // egyik sem szól magától, ezért az eredményt bemondjuk.

/* Ugyanazt a szöveget kétszer egymás után a felolvasó nem mondja ki: a csomópont
   tartalma nem változott, nincs mit bejelenteni. Előbb kiürítjük, és a
   következő képkockában írjuk vissza — így az ismételt szintváltás is hallható. */
let liveT;
function say(msg){
  if(!msg) return;
  const n=$("live"); if(!n) return;
  clearTimeout(liveT); n.textContent="";
  liveT=setTimeout(()=>{n.textContent=msg;},60);
}

      .replace("%s",D.rooms.filter(r=>r.level===S.level).length));

/* A térkép hozzáférhető neve együtt mozog azzal, amit mutat: nézet és szint.
   A használati tudnivaló külön bekezdés (aria-describedby), hogy a nevet ne
   kelljen minden fókuszálásnál végighallgatni. */
function applyMapLabel(){
  const t=T();
  stage.setAttribute("aria-label",(S.mode===3?t.mapLabel3:t.mapLabel).replace("%s",lvName(S.level)));
  $("mapHint").textContent=t.mapHint;

  $("tools").setAttribute("aria-label",t.toolsLabel);

  $("zin").setAttribute("aria-label",t.zin);
  $("zout").setAttribute("aria-label",t.zout);
  $("zfit").setAttribute("aria-label",t.zfit);

/* A nyilas léptetés azokat a helyiségeket járja be, amelyek látszanak is:
   hallgatói nézetben a hallgatóit, „Minden"-ben az összeset. A halványított
   termek így nem esnek ki semmiből — kereséssel, megosztott linkkel és a
   fejléc kapcsolójával ugyanúgy elérhetők —, csak nem kell 52 irodán
   átlépkedni a mosdóig. Ez ugyanaz a szabály, ami a feliratokra vonatkozik. */
const navRooms=lv=>D.rooms.filter(r=>r.level===lv&&r.code&&(S.staff||!STAFF.has(r.cat)));
/* olvasási sorrend a Home/End-hez: fentről le, balról jobbra */
const readOrder=(a,b)=>a.cy-b.cy||a.cx-b.cx;

let cursor=null;                       // a billentyűzetes kurzor terem-kódja

function focusRoom(code){
  const r=ROOM[code]; if(!r) return false;
  if(r.level!==S.level) setLevel(r.level);
  const n=roomNode(r); if(!n) return false;
  cursor=code; n.focus();
  return true;
}

/* Belépés a térképre: a kiválasztott terem, ha ezen a szinten van, különben az
   előző kurzor, különben a szint legnagyobb közlekedője — az nagyjából középen
   van, onnan minden irányba el lehet indulni. */
function enterMap(){
  const list=navRooms(S.level); if(!list.length) return false;
  const at=c=>c&&ROOM[c]&&ROOM[c].level===S.level&&list.includes(ROOM[c])?ROOM[c]:null;
  const r=at(S.sel)||at(cursor)
        ||list.filter(x=>x.circ).sort((a,b)=>b.area-a.area)[0]||list.slice().sort(readOrder)[0];
  return focusRoom(r.code);
}

/* A nyíl a megadott irányban legközelebbi helyiségbe lép. Olvasási sorrend
   helyett geometria: a térképen az „alattam lévő terem" az, amit a szem is
   annak lát. Az irányra merőleges eltérés büntet, de nem zár ki — különben egy
   kicsit odébb nyíló folyosónál a nyíl egyszerűen nem csinálna semmit. */
function stepRoom(dx,dy){
  const cur=ROOM[cursor]; if(!cur) return null;
  let best=null,bd=1e9;
  for(const r of navRooms(S.level)){
    if(r===cur) continue;
    const vx=r.cx-cur.cx, vy=r.cy-cur.cy;
    const ahead=vx*dx+vy*dy;                 // irány menti távolság
    if(ahead<=.3) continue;                  // nem arra van
    const side=Math.abs(vx*dy-vy*dx);        // oldalirányú kilógás
    const d=ahead+side*2.2;
    if(d<bd){bd=d;best=r;}
  }
  return best;
}

const ARROW={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
stage.addEventListener("keydown",e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const t=T();

  if(ARROW[e.key]){
    e.preventDefault();
    // Az első nyílnyomás még csak belép a térképre, nem lép odébb.
    if(!cursor||!ROOM[cursor]||ROOM[cursor].level!==S.level){ enterMap(); return; }
    const n=stepRoom(...ARROW[e.key]);
    if(n) focusRoom(n.code); else say(t.aEdge);
    return;
  }
  if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    if(cursor&&ROOM[cursor]) select(cursor); else enterMap();
    return;
  }
  if(e.key==="Home"||e.key==="End"){
    const ord=navRooms(S.level).slice().sort(readOrder);
    if(!ord.length) return;
    e.preventDefault();
    focusRoom((e.key==="Home"?ord[0]:ord[ord.length-1]).code);
    return;
  }
  if(e.key==="PageUp"||e.key==="PageDown"){
    e.preventDefault();
    const i=LVI[S.level]+(e.key==="PageUp"?1:-1);
    if(i<0||i>=LV.length){ say(t.aEdge); return; }
    setLevel(LV[i]);
    // A kurzor a szinttel együtt lép; enélkül a következő nyíl az eltűnt
    // szinten keresne, és a fókusz egy aria-hidden ágon ragadna.
    if(stage.contains(document.activeElement)) enterMap();
    return;
  }
  /* Az Esc két lépés: előbb kijön a teremből a térkép szintjére, és csak a
     másodikra törli a kiválasztást (azt a globális kezelő végzi, ezért itt
     megállítjuk a buborékolást). Egy nyomásra mindkettő meglepő lenne: a
     billentyűzetes felhasználó a fókuszt akarja visszavenni, nem az útvonalát
     eldobni. */
  if(e.key==="Escape"&&document.activeElement!==stage){
    e.stopPropagation(); stage.focus();
  }
});

/* A szintváltás egy helyen: a sáv gombja, a Page Up/Down és a födémre kattintás
   is ide fut be, így a bemondás egyszer van megírva. */
function setLevel(lv){
  if(lv===S.level||LVI[lv]===undefined) return;
  S.level=lv; renderRail(); updateView(); sayLevel();
}

/* ------------------------------------------------------------------ alsó lap */
const side=$("side"), grab=$("grab");
let snap="peek";
function snaps(){
  const h=side.offsetHeight, vh=innerHeight;
  return {full:0, mid:Math.max(0,Math.round(h-vh*.46)), peek:Math.max(0,h-128)};
}
function setSnap(n){
  if(!MOB())return;
  const prev=snap; snap=n;
  const sp=snaps();
  side.style.setProperty("--sheet",sp[n]+"px");
  side.style.setProperty("--sheetpad",sp[n]+"px");
  document.documentElement.style.setProperty("--railb",
    (n==="peek"?142:Math.round(innerHeight*.46)+16)+"px");
  if(prev===n) return;
  if(!S.dirty) fit();
  else { S.view.y -= (insetFor(n)-insetFor(prev))/2; updateView(); }
}
(function(){
  /* A lap húzása. Eddig csak a ~18px magas fogantyú fogadta el a mozdulatot, és
     az elengedés a legközelebbi álláshoz ugrott a sebességtől függetlenül —
     ettől érződött nehézkesnek. Most a teljes fejléc fog, a lista tetejéről
     lefelé húzva is indul, és a lendület számít. */
  const ORDER=["full","mid","peek"];        // fentről lefelé
  const TAKE=6;                             // ennyi px után vesszük át a mozdulatot
  const FLING=0.45;                         // px/ms — efölött lendületnek számít
  let sd=null, samples=[], justDragged=false;
  const cur=()=>parseFloat(getComputedStyle(side).getPropertyValue("--sheet"))||0;

  const begin=(y,fromScroll)=>{
    if(!MOB()) return;
    sd={y0:y,s:cur(),fromScroll,active:false};
    samples=[{t:performance.now(),y}];
  };
  const move=y=>{
    if(!sd) return;
    const dy=y-sd.y0;
    if(!sd.active){
      if(Math.abs(dy)<TAKE) return;              // koppintás még átmehet
      if(sd.fromScroll&&dy<0){ sd=null; return; } // felfelé a lista görgessen
      sd.active=true; side.classList.add("drag");
    }
    const sp=snaps();
    side.style.setProperty("--sheet",
      Math.max(-24,Math.min(sp.peek+80,sd.s+dy))+"px");
    samples.push({t:performance.now(),y});
    if(samples.length>6) samples.shift();
  };
  const finish=()=>{
    if(!sd) return;
    const was=sd.active; sd=null;
    if(!was) return;
    justDragged=true; setTimeout(()=>{justDragged=false;},0);
    side.classList.remove("drag");
    const v=cur(), sp=snaps();
    const a=samples[0], b=samples[samples.length-1];
    const vy=(a&&b&&b.t>a.t) ? (b.y-a.y)/(b.t-a.t) : 0;   // + = lefelé
    let near=0, nd=1e9;
    ORDER.forEach((k,i)=>{const d=Math.abs(sp[k]-v); if(d<nd){nd=d;near=i;}});
    const idx = Math.abs(vy)>FLING
      ? Math.max(0,Math.min(ORDER.length-1, near+(vy>0?1:-1)))  // lendület iránya
      : near;
    setSnap(ORDER[idx]);
  };

  grab.addEventListener("pointerdown",e=>begin(e.clientY,false));
  side.querySelector(".search").addEventListener("pointerdown",e=>begin(e.clientY,false));
  $("scroll").addEventListener("pointerdown",e=>{
    // A lista tetejéről lefelé húzva a lapot mozgatjuk. Mivel a lista már nem
    // tud feljebb görögni, nem kell elvenni a böngészőtől a gesztust.
    if($("scroll").scrollTop<=0) begin(e.clientY,true);
  });
  addEventListener("pointermove",e=>move(e.clientY),{passive:true});
  addEventListener("pointerup",finish); addEventListener("pointercancel",finish);
  grab.addEventListener("click",()=>{ if(justDragged)return;
    setSnap(snap==="peek"?"mid":snap==="mid"?"full":"peek"); });
})();

  const o=$("optbar");

function toast(msg){
  let el=$("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),2200);
}
async function shareCurrent(){
  const t=T(), u=urlOf();
  const url=location.origin+location.pathname+(u.startsWith("#")?u:"");
  const nm=c=>{const r=ROOM[c];return r?(r.name||r.cat)+" · "+c:c;};
  const title=(S.from&&S.to) ? t.shareRoute.replace("%s",nm(S.from)).replace("%s",nm(S.to))
            : t.shareRoom.replace("%s",nm(S.sel||S.to||S.from));
  try{ if(navigator.share){ await navigator.share({title,url}); return; } }
  catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(url); toast(t.shareCopied); }
  catch(e){ prompt(t.share,url); }
}

/* --------------------------------------------------------------- mély link */
/* Az állapot a címsorban él, így az útvonal megosztható, könyvjelzőzhető, és
   a vissza gomb visszalép — telepített appban ez utóbbi nélkül a vissza
   egyszerűen kilépne. Két alak van:
     #OA10E18                       – egy terem kiválasztva
     #from=OA00FK1&to=OA10E18       – útvonal; a from önmagában az „itt vagyok”,
                                      erre mutatnak a folyosókra kerülő QR-kódok.  */
let urlLock=false;                    // a visszaállítás ne írjon vissza a címsorba

function urlOf(){
  const q=[];
  if(S.from) q.push("from="+S.from);
  if(S.to)   q.push("to="+S.to);
  if(S.sel && S.sel!==S.to && S.sel!==S.from) q.push("sel="+S.sel);
  if(!q.length) return location.pathname+location.search;
  if(q.length===1 && q[0].startsWith("sel=")) return "#"+S.sel;   // rövid alak
  return "#"+q.join("&");
}
function pushUrl(replace){
  if(urlLock) return;
  const u=urlOf();
  if(u===location.hash || (!location.hash && u===location.pathname+location.search)) return;
  try{ history[replace?"replaceState":"pushState"]({},"",u); }catch(e){}
}

function readUrl(){
  const h=decodeURIComponent(location.hash.replace(/^#/,"")).trim();
  const out={from:null,to:null,sel:null};
  if(!h) return out;
  if(!h.includes("=")){ out.sel=h.toUpperCase(); return out; }   // #OA10E18
  for(const part of h.split("&")){
    const [k,v]=part.split("=");
    if(v && ["from","to","sel"].includes(k)) out[k]=v.toUpperCase();
  }
  return out;
}

/* A címsorból visszaállított állapot. Ismeretlen kódot csendben elhagyunk —
   egy elgépelt vagy régi link ne törje szét az appot. */
function applyUrl(){
  const u=readUrl();
  const ok=c=>c && ROOM[c] ? c : null;
  urlLock=true;
  S.from=ok(u.from); S.to=ok(u.to); S.sel=ok(u.sel)||S.to||S.from;
  recompute();
  if(S.sel){ const r=ROOM[S.sel];
    if(r && r.level!==S.level){ S.level=r.level; renderRail(); } }
  refreshSel(); renderPanel(); updateView();
  urlLock=false;
  return !!(S.from||S.to||S.sel);
}
addEventListener("popstate",applyUrl);
addEventListener("hashchange",()=>{ if(!urlLock) applyUrl(); });

/* Üresen indulunk: az érkezőnek ne egy általunk kitalált útvonal fogadja.

urlLock=true; const fromUrl=applyUrl(); urlLock=false;
