  const segs=[];let cur=null;
  for(const u of rt.path){const p=nXY(u);
    if(!cur||cur.lv!==p.lv){if(cur)segs.push(cur);cur={lv:p.lv,pts:[],vias:[]};}
    cur.pts.push([p.x,p.y]);
    if(rt.via[u])cur.vias.push(rt.via[u]);}
  if(cur)segs.push(cur);
  for(const s of segs)s.pts=smooth(s.lv,s.pts);
  let d=0;for(const s of segs)for(let i=0;i+1<s.pts.length;i++)
    d+=Math.hypot(s.pts[i+1][0]-s.pts[i][0],s.pts[i+1][1]-s.pts[i][1]);
  // Lépcsőn emeletenként ~22 s; a lift nem szintenként telik: hívás/várakozás plusz a menet.
  let vsec=0, em=0;
  for(let i=0;i+1<segs.length;i++){
    const v=segs[i+1].vias[0]||segs[i].vias[segs[i].vias.length-1], de=Math.abs(emelet(segs[i+1].lv)-emelet(segs[i].lv));
    em+=de; vsec += (v&&v.kind==="lift") ? 35+8*(v.levels||1) : 22*de;
  }
  const vert=Math.round(em);
  return {segs,dist:Math.round(d),vert,sec:d/1.3+vsec,min:Math.max(1,Math.ceil((d/1.3+vsec)/60))};
}
function steps(rt,mm){
  const t=T(),o=[], segs=mm.segs;
  // a helyiség az ajtaján álló számmal (2.20), ha van, különben a tervlapi kóddal
  const nev=r=>`${neptunOf(r.code)||r.code} · ${r.name||r.cat}`;
  const hossz=s=>s.pts.reduce((d,p,i)=>i?d+Math.hypot(p[0]-s.pts[i-1][0],p[1]-s.pts[i-1][1]):0,0);
  const atjaro=(i,j)=>segs[j].vias[0]||segs[i].vias[segs[i].vias.length-1];
  // a lépcsőház kódja azon a szinten, ahol belép (a kapcsolat az alsó szint kódját viszi)
  const lkod=(v,lv)=>{ const st=v.kind!=="lift"&&D.stairs.find(x=>x.id===v.id), q=st&&st.pts.find(p=>p[0]===lv);
    return q?q[3]:v.code; };
  o.push({ico:"◉",t:t.go,d:nev(rt.a),lv:rt.a.level});
  if(rt.outThru&&rt.outThru.length)o.push({ico:"↪",t:t.outThru,d:rt.outThru.map(nev).join(" → "),lv:rt.a.level});
  for(let si=0;si<segs.length;){
    const s=segs[si];
    let run=0;
    for(let i=0;i+1<s.pts.length;i++){
      const a=s.pts[i],b=s.pts[i+1],c=s.pts[i+2];
      run+=Math.hypot(b[0]-a[0],b[1]-a[1]);
      if(c){
        let g=Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]);
        while(g>Math.PI)g-=2*Math.PI;while(g<-Math.PI)g+=2*Math.PI;
        if(Math.abs(g)>Math.PI/4.5&&run>2.5){
          o.push({ico:g>0?"↷":"↶",t:g>0?t.right:t.left,d:`${t.walk} ~${Math.round(run)} ${t.m}`,lv:s.lv});
          run=0;
        }
      }
    }
    if(run>3)o.push({ico:"↑",t:`${t.walk} ~${Math.round(run)} ${t.m}`,lv:s.lv});
    if(si+1>=segs.length) break;
    /* A lépcsőházban a pihenőkön (félemelet, köztes szintek) végigmenve egy
       lépés: „Lépcsőn fel a II. emeletre", nem szintenként egy-egy. Csak ha
       ugyanarra megy tovább, és közben nem kell a szinten sétálni. */
    const v=atjaro(si,si+1), lift=!!(v&&v.kind==="lift"), irany=Math.sign(segs[si+1].lv-s.lv);
    let j=si+1;
    while(j+1<segs.length && hossz(segs[j])<6 && Math.sign(segs[j+1].lv-segs[j].lv)===irany &&
          !!((atjaro(j,j+1)||{}).kind==="lift")===lift) j++;
    const lv=segs[j].lv, n=Math.round(Math.abs(emelet(lv)-emelet(s.lv)));
    o.push({ico:lift?"⇅":"⌁",v:true,lv,
      t:`${lift?t.byLift:t.stairs} ${irany>0?t.up:t.down} ${t.lvTo[lv]}`,
      d:[v&&`${lift?t.liftVia:t.via} · ${lkod(v,s.lv)}`, !lift&&n>1&&t.nLv.replace("%s",n)].filter(Boolean).join(" · ")});
    si=j;
  }
  if(rt.inThru&&rt.inThru.length)o.push({ico:"↪",t:t.inThru,d:rt.inThru.map(nev).join(" → "),lv:rt.b.level});
  o.push({ico:"◆",t:t.arrive,d:nev(rt.b),lv:rt.b.level});
  return o;
}

/* ------------------------------------------------------------------ színek */
/* A helyiségek színe az Egyetemi Tervtár funkcióalaprajzainak színkulcsa
   (Egyetemi Tervtár alapinformációk, 2026.02.24), a kulcs sorrendjében: az
   építészek kérése, hogy a térkép az ő színezésüket kövesse, és ugyanígy
   olvasható legyen, mint a funkcióalaprajzaik. Az értékek a kulcs képéből
   mérve, a jelmagyarázat is ebben a sorrendben áll. */
const CATS={"ELŐADÓ - SZEMINÁRIUM":"#fa9a90","LABOR":"#fcbcb5","IRODÁK":"#fff7da",
  "VIZES HELYISÉGEK":"#87b6b8","SPORT - ÖLTÖZŐK":"#cac7df","HÖK":"#f9daa0","KÖZLEKEDŐK":"#cfcfcf",
  "ELŐTEREK":"#e7e7e7","KÖZÖSSÉGI TEREK":"#ffb062","RAKTÁROZÁS/TÁROLÁS":"#d1d685",
  "DOLGOZÓI TERÜLETEK":"#bdd0d7","ÜZEMELTETÉS":"#99acbf","EGYETEMI SZOLGÁLTATÁS":"#b0c3a8",
  "KÖNYVTÁR":"#d3c7be","KÜLSŐS SZOLGÁLTATÁS":"#b5909b"};
const DARK=[11,19,28];
const _c={};
const isDark=()=>{const a=document.documentElement.getAttribute("data-theme");
  return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches;};
function cc(cat){
  const base=CATS[cat]||D.cats[cat]||"#cfd6dd",key=cat+(isDark()?"|d":"|l");
  if(_c[key])return _c[key];
  let out=base;
  if(isDark()){
    const v=[1,3,5].map(i=>parseInt(base.slice(i,i+2),16));
    const mx=v.map((x,i)=>x*.36+DARK[i]*.64),m=(mx[0]+mx[1]+mx[2])/3;
    out="#"+mx.map(x=>Math.max(0,Math.min(255,Math.round(m+(x-m)*1.8)))
      .toString(16).padStart(2,"0")).join("");
  }
  return _c[key]=out;
}

/* ------------------------------------------------------------------ render */
const NS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);return x;};
const world=$("world"), app=$("app"), stage=$("stage");
const FLOOR={};

function buildFloors(){
  world.textContent="";
  const g=document.createElement("div");
  g.className="ground";
  g.style.cssText=`width:${BB.w*1.5}px;height:${BB.h*1.15}px;left:${-BB.w*.75}px;top:${-BB.h*.57}px`;
  world.appendChild(g);

  D.levels.forEach((L,idx)=>{
    const f=document.createElement("div");
    f.className="floor"; f.style.width=PW+"px"; f.style.height=PH+"px";
    f.dataset.lv=L.level; f.style.setProperty("--i",idx);

    const svg=el("svg",{width:PW,height:PH,viewBox:`0 0 ${D.meta.w} ${D.meta.h}`});
    const rs=D.rooms.filter(r=>r.level===L.level);
    const wallPath=(D.walls[String(L.level)]||[]).map(w=>"M"+w.map(p=>p.join(" ")).join("L")+"Z").join("");

    // A sziluett, az árnyék és a kattintófelület ugyanazt a három réteget rajzolta
    // ki helyiségenként külön poligonnal. Mindhárom egyetlen összefüggő alakzat,
    // ezért egy-egy path alútvonalaiként megy ki: helyiségenként 3 csomópont
    // helyett összesen 3. Az árnyéknál ez a féligáteresztő kitöltés átfedéseinél
    // keletkező sötétebb foltokat is megszünteti.
    const slabD = rs.map(r=>"M"+r.poly.map(p=>p.join(" ")).join("L")+"Z").join("");

    // A képernyőolvasó számára a szintből egyetlen dolog érdekes: a helyiségek.
    // A födém, az árnyék, a falak, a feliratok és az útvonalrajz mind ugyanazt
    // mondják el vizuálisan, amit a panel és az élő régió szövegesen — névtelen
    // grafikus csomópontként viszont csak zajt adnának, ezért aria-hidden.
    f.setAttribute("role","group");
    f.setAttribute("aria-label",L.name);

    // 1. födém-sziluett (helyiségek + falak összeolvasztva) + vetett árnyék
    svg.appendChild(el("path",{class:"slabsh",transform:"translate(0.7 2)",d:slabD||"M0 0","aria-hidden":"true"}));
    svg.appendChild(el("path",{class:"slab",d:(slabD+wallPath)||"M0 0","aria-hidden":"true"}));

    // 2. kattintófelület (3D módban) — billentyűzettel a szintváltó sáv felel meg neki
    const hit=el("path",{class:"hit",fill:"transparent",d:(slabD+wallPath)||"M0 0","aria-hidden":"true"});
    hit.addEventListener("click",e=>{e.stopPropagation();dive(L.level);});
    svg.appendChild(hit);

    // 3. helyiségek
    const gr=el("g",{class:"rooms"});
    for(const r of rs){
      const po=el("polygon",{points:r.poly.map(p=>p.join(",")).join(" "),fill:cc(r.cat),
        class:"room"+(r.code?" pick":"")+(S.sel===r.code?" sel":"")+(STAFF.has(r.cat)?" staff":"")});
      if(r.code){
        po.addEventListener("click",e=>{e.stopPropagation();select(r.code);});
        const nm=r.code+" · "+(r.name||r.cat);
        const ti=el("title");ti.textContent=nm;po.appendChild(ti);
        // A <title> egérre buboréknév, de a hozzáférhető nevet nem bízzuk rá:
        // a gombszerepnél az aria-label a kiszámítási sor elején áll, tehát
        // biztosan az jut el a felolvasóig. tabindex=-1: a poligon csak a
        // nyilakkal kap fókuszt, a tab-sorrendben nincs benne.
        po.setAttribute("role","button");
        po.setAttribute("aria-label",nm);
        po.setAttribute("tabindex","-1");
        po.dataset.code=r.code;
      } else {
        po.setAttribute("aria-hidden","true");   // kód nélküli helyiség: nem választható
      }
      gr.appendChild(po);
    }
    svg.appendChild(gr);
    const wallNode=el("path",{d:wallPath||"M0 0",class:"walls","fill-rule":"evenodd","aria-hidden":"true"});
    svg.appendChild(wallNode);

    // 4. feliratok (lustán, csak amikor a szint aktív lesz)
    const gl=el("g",{class:"glabel","aria-hidden":"true"});
    svg.appendChild(gl);
    const rt=el("g",{class:"rt","aria-hidden":"true"}); svg.appendChild(rt);
    f.appendChild(svg);
    const tag=document.createElement("div");
    tag.className="ftag";
    tag.setAttribute("aria-hidden","true");
    tag.innerHTML=`${esc(L.name)}<em>${rs.length}</em>`;
    f.appendChild(tag);
    world.appendChild(f);
    FLOOR[L.level]={box:f,svg,route:rt,labels:gl,rooms:gr,walls:wallNode,tag,idx,built:false,rs};
  });
}

/* Mosdók, lépcsők, lift: ezeket keresik a legtöbben, és az építészek kérték,
   hogy könnyebb legyen odatalálni. Ezeken a teremszám helyett piktogram áll —
   a tervlapi kódjuk (E38, FL2) a hallgatónak semmit nem mond; a kód a
   kiválasztáskor és a felolvasónak továbbra is ott van. A lift a tervlapon
   nem külön helyiség: a LIFTS lépcsőmagjában jár, ott a lépcső mellé kerül. */
const LIFT_ROOMS=new Set(LIFTS.flatMap(l=>l.pts.map(p=>p[3])));
// Épület nézetben magonként egy jelvény: ennyi méteren belül egy mag, ebben a sorrendben
const MAG_M=10, ICO_SOR=["stair","lift","wcw","wcm","acc","wc"];
function iconsOf(r){
  const n=(r.name||"").toUpperCase();
  if(/LÉPCSŐ/.test(n)) return LIFT_ROOMS.has(r.code)?["stair","lift"]:["stair"];
  if(r.cat!=="VIZES HELYISÉGEK") return null;
  if(/AK\.?\s*MENT/.test(n)) return ["acc"];
  if(/N[ŐÖ]I/.test(n)) return ["wcw"];
  if(/FFI/.test(n)) return ["wcm"];
  return /WC|MOSDÓ/.test(n)?["wc"]:null;
}
// a jelvény a terem feliratpontján, a tervlaphoz kötve (a teremmel nem fordul)
function iconBadge(r,ic){
  const R=Math.max(.7,Math.min(1.1,Math.min(r.lw,r.lh)*.4)), gap=R*.15, w=ic.length*R*1.7+gap*(ic.length-1)+R*.3;
  const g=el("g",{class:"ico","data-ico":r.code,transform:`translate(${r.cx} ${r.cy})`});
  g.appendChild(el("rect",{x:-w/2,y:-R,width:w,height:2*R,rx:R,class:"icob"}));
  ic.forEach((k,i)=>g.appendChild(el("use",{href:"#i-"+k,x:-w/2+R*.15+i*(R*1.7+gap),y:-R*.85,width:R*1.7,height:R*1.7})));
  return g;
}
function buildLabels(lv){
  const F=FLOOR[lv]; if(F.built) return; F.built=true;
  const gl=F.labels;
  for(const r of F.rs){
    if(!r.code) continue;
    if(!S.staff && STAFF.has(r.cat)) continue;   // halványítva nem feliratozzuk
    const ic=iconsOf(r);
    if(ic){ gl.appendChild(iconBadge(r,ic)); continue; }
    const sc=roomLabel(r);
    const fs=Math.max(.5,Math.min(1.2,(r.lw-1.4)/(sc.length*.66),r.lh/3.4));
    if(fs<.55) continue;
    const tr=`rotate(${r.ang} ${r.cx} ${r.cy})`;
    const nm=r.lh>3.8&&r.lw>5.5&&r.name;
    const a=el("text",{x:r.cx,y:r.cy+(nm?-.3:.42),class:"lbl","font-size":fs.toFixed(2),transform:tr});
    a.textContent=sc; gl.appendChild(a);
    if(nm){
      const max=Math.max(5,Math.floor((r.lw-1.2)/(fs*.55)));
      const b=el("text",{x:r.cx,y:r.cy+fs*1.3,class:"lbl2","font-size":(fs*.8).toFixed(2),transform:tr});
      b.textContent=r.name.length>max?r.name.slice(0,max-1)+"…":r.name;
      gl.appendChild(b);
    }
  }
}

/* A világ rotateX(x) rotateZ(z)-t kap; ennek az inverze rotateZ(-z) rotateX(-x),
   így a felirat a forgatás közben is a néző felé néz. */
const tagTransform=()=> S.mode===3
  ? `translate(-100%,-50%) rotateZ(${-S.rot.z}deg) rotateX(${-S.rot.x}deg)`
  : `translate(-100%,-50%) rotate(${-bearing()}deg)`;
function orientTags(){ for(const lv of LV) FLOOR[lv].tag.style.transform=tagTransform(); }

function placeTags(){
  // a 3D-forgatás visszaforgatása, hogy a felirat a néző felé nézzen
  for(const lv of LV){
    const F=FLOOR[lv];
    F.tag.style.left=(BB.x0*PXM-14)+"px";
    F.tag.style.top=(BB.cy*PXM+BB.h*.22)+"px";
    F.tag.style.transform=tagTransform();
  }
}

/* Az irány a két nézetben ugyanaz — lásd a ROT0 megjegyzését. Külön függvény
   marad, mert a projBBox, a világ és a szintfeliratok transzformja is ebből
   olvas, és így egy helyen dől el. */
function bearing(){ return S.rot.z; }
/* Egy kamera, két rögzített állás. Az Alaprajz ugyanaz a 3D-s jelenet,
   egyenesen felülről nézve: rotateX(0). Így a nézetváltás mindkét végén
   UGYANAZ a függvénylista áll (translate scale rotateX rotateZ), és a böngésző
   a dőlést és az irányt függvényenként, külön-külön úsztatja át. Eltérő
   listáknál (rotate() ↔ rotateX() rotateZ()) mátrixként interpolálna, és a
   dőlés meg a fordulás egyetlen átlós lendítéssé mosódna össze.
   Nyugalomban viszont az alaprajz lelapul: `flat` esetén sima 2D-s rotate()
   megy, ami ugyanazt a képet adja, de nem kér 3D kontextust — ezen a lapos
   útvonalon múlik a telefonos 76 fps (a 3D 13-ával szemben). A lelapítást a
   syncFlat() végzi, az átmenet lefutása után. */
let flat=true;
function worldTransform(){
  const v=S.view;
  const base=`translate(${v.x}px,${v.y}px) scale(${v.k})`;
  if(S.mode===3) return `${base} rotateX(${S.rot.x}deg) rotateZ(${S.rot.z}deg)`;
  return flat ? `${base} rotate(${bearing()}deg)`
              : `${base} rotateX(0deg) rotateZ(${bearing()}deg)`;
}
/* Ugyanazt a képet más függvénylistával írja ki, áttűnés nélkül. A kiolvasás
   rögzíti a böngészőben a kiinduló állapotot, így a következő írás már innen
   úszik át. Ha gesztus közben hívódik (a .now már fent van), azt nem vesszük
   le — különben a mozdulat hátralévő része késve, áttűnéssel követné az ujjat. */
function setWorldInstant(){
  const volt=world.classList.contains("now");
  world.classList.add("now");
  world.style.transform=worldTransform();
  void getComputedStyle(world).transform;
  if(!volt) world.classList.remove("now");
}
/* Az aktív szintet a FÖLÖTTE lévők takarják el: a +Z a néző felé mutat, tehát
   a magasabb emelet van elöl, és a födémje ráfekszik az alaprajzra. Öt egymásra
   tett, egyenként 0,82-es födémen keresztül semmi nem látszik — a földszint
   alaprajza gyakorlatilag eltűnt, és minél laposabb volt a dőlés, annál inkább.
   Ezért a fölöttes szintek szintenként halványodnak, a dőlés pedig visszaadja
   őket: élből nézve elcsúsznak az aktív mellől, ott nem takarnak, és a köteg
   megint elmondja, hogy hány emeletes az épület. Az aktív alatti szintek nem
   takarnak, ők maradnak teljes értékű kontextusnak. */
const FLOOR_OP=.82, ABOVE_FADE=.42;
function floorOpacity(idx,ai){
  if(idx===ai) return 1;
  if(idx<ai) return FLOOR_OP;
  const faded=FLOOR_OP*ABOVE_FADE**(idx-ai);
  const cover=Math.cos(S.rot.x*Math.PI/180);      // 1 laposan … 0 élből
  return faded+(FLOOR_OP-faded)*(1-cover)**2;
}
/* Mennyire „3D" a kép — a kamera dőléséből, nem a mód kapcsolójából. Az
   alaprajz a 0°-os kamera; a kétujjas felemelés innen folyamatosan emel, és
   REVEAL_DEG-ig nyílik szét a köteg. Az elején pont úgy néz ki minden, mint
   az alaprajzon, ezért nincs ugrás a felemelés első pillanatában.
   REVEAL_DEG = TILT_MIN: az Épület nézet nyugvó állásai (15° fölött) így mind
   teljesen kinyitottak, azokon semmi nem változik. */
const REVEAL_DEG=TILT_MIN;
const camTilt=()=>S.mode===3 ? S.rot.x : 0;
const reveal=()=>Math.min(1,Math.max(0,camTilt()/REVEAL_DEG));
/* A felemelés félútján billen át a kép 3D-s megjelenésbe (.deep: kontúr,
   árnyék, szintfeliratok, a síkbeli feliratok helyett az álló teremszámok),
   és a többi szint is csak innen úszik be. A kettő szándékosan egy ponton
   van: mindkettő rajzolással jár — a .deep az SVG-n belül vált, a beúszó
   szinteket pedig most kell először kifesteni, mert alaprajzon csak az aktív
   szint van kifestve. Így a mozdulat alatt egyszer kell rajzolni, nem
   kétszer, és a felemelés első fele ugyanolyan olcsó, mint maga az alaprajz.
   A határ kétirányú: fölfelé DEEP_AT-nál (7,5°) billen át, lefelé csak
   DEEP_OFF-nál (5°) vissza. Egyetlen határon a remegő ujj minden képkockában
   át-vissza billentette (mérve: 30 lépésből 30-szor), és vele villogott a
   kontúr, az árnyék és a teremszámok. */
const DEEP_AT=.5, DEEP_OFF=1/3;
/* A falak oldallapja (lásd a .wband szabályt): a falak alakja a néző felé —
   a tervlap +y irányába, ami alapállásban lefelé esik — végigsöpörve, a fal
   alá. Két kitöltés: a teljes sáv, és rajta a fal felőli fele világosabban,
   hogy a fal a tövénél sötétebb legyen, és a padlón „üljön".
   A raszterezés olcsósága itt a lényeg: Épület nézetben forgatás közben a
   böngésző a szinteket csempénként újrarajzolja, és egy csempe minden
   path-t feldolgoz, amelyik átfedi. Az első változat a fal eltolt, körvonalas
   másolataiból rakta össze a sávot: a körbejárás lépésideje a GPU-s úton
   kétszeres lett. Ezért konvex falnál (a 95%-uk) a söpört alak egyetlen
   sokszög, a fal és eltolt másolatának konvex burka; a többinél a fal, a
   másolata és minden éle végighúzva, ugyanarra forgatva, hogy az átfedéseik
   ne oltsák ki egymást. És cellánként külön path, hogy egy csempe csak a
   közeli falakat rajzolja, ne az egész szintet.
   Ez a szint saját rajza, tehát nincs rajta dőlésfüggés: a valódi fal
   oldala meredekebb nézetben nőne, ez a sáv laposodik. Alapállásban (58°)
   a kettő ugyanaz; elforgatva a sáv a fal egyik oldalán marad, megvilágított
   élnek hat. Csak az aktív szintnek épül, először akkor, amikor 3D-ben
   aktív lesz. */
const BAND_L=.6, BAND_GRID=6;
const convex=w=>{
  let s=0;
  for(let i=0;i<w.length;i++){ const a=w[i], b=w[(i+1)%w.length], c=w[(i+2)%w.length];
    const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(Math.abs(cr)<1e-9) continue;
    if(!s) s=Math.sign(cr); else if(Math.sign(cr)!==s) return false; }
  return true;
};
const hull=pts=>{
  const p=[...pts].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[], hi=[];
  for(const q of p){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  for(let i=p.length-1;i>=0;i--){ const q=p[i];
    while(hi.length>1&&cr(hi[hi.length-2],hi[hi.length-1],q)<=0) hi.pop(); hi.push(q); }
  return lo.slice(0,-1).concat(hi.slice(0,-1));
};
const sweep=(w,L)=>{
  const up=w.map(p=>[p[0],p[1]+L]);
  if(convex(w)) return [hull(w.concat(up))];
  const out=[w,up];
  for(let i=0;i<w.length;i++){ const a=w[i], b=w[(i+1)%w.length];
    out.push([a,b,[b[0],b[1]+L],[a[0],a[1]+L]]); }
  return out;
};
const polyD=ps=>{
  let a=0;
  for(let i=0;i<ps.length;i++){ const p=ps[i], q=ps[(i+1)%ps.length]; a+=p[0]*q[1]-q[0]*p[1]; }
  if(Math.abs(a)<1e-9) return "";                   // függőleges él: nincs területe
  return "M"+(a>0?ps:[...ps].reverse()).map(p=>p[0].toFixed(3)+" "+p[1].toFixed(3)).join("L")+"Z";
};
function bandOf(lv){
  const F=FLOOR[lv]; if(F.band) return;
  const g=el("g",{class:"wband","aria-hidden":"true"});
  for(const [cls,L] of [["wb1",BAND_L],["wb2",BAND_L/2]]){
    const cells=new Map();
    for(const w of D.walls[String(lv)]||[]){
      const cx=w.reduce((s,p)=>s+p[0],0)/w.length, cy=w.reduce((s,p)=>s+p[1],0)/w.length;
      const k=Math.floor(cx/D.meta.w*BAND_GRID)+","+Math.floor(cy/D.meta.h*BAND_GRID);
      cells.set(k,(cells.get(k)||"")+sweep(w,L).map(polyD).join(""));
    }
    for(const d of cells.values()) if(d) g.appendChild(el("path",{class:cls,d}));
  }
  F.svg.insertBefore(g,F.walls);
  F.band=g;
}
/* A szintek térbeli helye és átlátszósága. A dőléstől függ, ezért a gesztus
   paint()-je is hívja képkockánként — csak kompozitoros tulajdonságot ír
   (a szintdobozok és a lépcsőjelek transzformját, átlátszóságát), így a
   mozgás közben nem kell újrafesteni. */
function syncFloors(){
  const ai=LVI[S.level], r=reveal(), be=Math.max(0,(r-DEEP_AT)/(1-DEEP_AT));
  for(const lv of LV){ const F=FLOOR[lv], on=F.idx===ai;
    F.box.style.transform=`translate(-50%,-50%) translate(${OFFX}px,${OFFY}px) translateZ(${(F.idx-ai)*GAP*r}px)`;
    F.box.style.opacity = S.mode===3 ? (on?1:floorOpacity(F.idx,ai)*be) : (on?1:0);
  }
  // a lépcsőjel a két szint közti teljes távolságra készül; félig nyitott
  // kötegben kilógna a következő szinten túlra
  for(const d of RISERS) d.style.transform=riserT(d.upward,r);
  const deep=S.mode===3 && r>=(app.classList.contains("deep")?DEEP_OFF:DEEP_AT);
  // az oldallap a .deep-pel együtt jelenik meg: ugyanaz az egy rajzolás
  if(deep) bandOf(S.level);
  if(deep!==app.classList.contains("deep")){
    app.classList.toggle("deep",deep);
    // lefelé döntve a feliratok visszajönnek — ha 3D-ben váltottunk szintet,
    // azok még nem épültek meg
    if(!deep) buildLabels(S.level);
  }
  const g=world.querySelector(".ground");
  if(g) g.style.transform=`translateZ(${-ai*GAP*r-26}px)`;
}
function updateView(){
  world.style.transform=worldTransform();
  for(const lv of LV){
    const F=FLOOR[lv];
    const on=lv===S.level;
    F.box.classList.toggle("on",on);
    // a helyet és az átlátszóságot a syncFloors() írja, a ciklus után
    F.rooms.style.opacity = S.mode===3 ? (on?1:0) : 1;
    F.walls.style.opacity = S.mode===3 ? (on?1:.32) : 1;
    const above = S.mode===3 && F.idx>LVI[S.level];
    F.box.classList.toggle("above",above);
    F.box.style.pointerEvents = S.mode===3 ? (above?"none":"auto") : (on?"auto":"none");
    // Alaprajz nézetben a rejtett szintek opacity:0-val is rétegben maradnak.
    // A .55s-os áttűnés után visibility:hidden kiveszi őket a festésből és a
    // hit-tesztből; a késleltetés miatt a szintváltás áttűnése megmarad.
    clearTimeout(F.hideT);
    if(S.mode===3 || on) F.box.style.visibility="";
    else F.hideT=setTimeout(()=>{
      if(S.mode!==3 && lv!==S.level) F.box.style.visibility="hidden";
    },600);
    F.box.style.zIndex = 100+F.idx;
    // Csak az aktív szint helyiségei látszanak a képernyőolvasónak: hét szint
    // mind a 183 helyisége egyszerre bejárhatatlan lenne, és a nem aktív
    // szintek amúgy sem kattinthatók. aria-hidden nem tartalmazhatja a fókuszt,
    // ezért ha ott áll, előbb kihozzuk a térkép szintjére.
    if(!on && F.box.contains(document.activeElement)) stage.focus();
    F.box.setAttribute("aria-hidden",on?"false":"true");
    if(on && S.mode===2) buildLabels(lv);
  }
  syncFloors();
  syncLabels();
  syncDens();
}

/* ---------- a kamera leképezése ---------- */
/* Ahogy a böngésző a világot a képernyőre teszi: a világ transzformja
   translate·scale·rotateX·rotateZ, utána a színpad perspektívája. Az aktív
   szint síkja z=0 (a köteg körülötte nyílik szét), tehát egy síkbeli pont
   (x1,y1) — a rotateZ UTÁNI koordinátákban — a képernyőn:
     z = y1·sin(a),  s = o + (v + k·(x1, y1·cos(a)) − o) · P/(P−z)
   ahol v a nézet eltolása, o a perspektíva origója a világ horgonyához (a
   térkép közepéhez) képest; a scale(k) síkbeli, a z-t nem nagyítja. Két
   helyen kell: a döntés forgáspontja ebből számolja vissza a nézetet, a
   teremszámok ebből kapják a helyüket. Csak Épület nézetben érvényes —
   alaprajzon (.flat2d) nincs perspektíva, ott null. */
const RAD=Math.PI/180;
let camKc=null;
function camK(){
  if(camKc) return camKc;
  const cs=getComputedStyle($("stage")), r=$("mapwrap").getBoundingClientRect();
  const P=parseFloat(cs.perspective), o=cs.perspectiveOrigin.split(" ").map(parseFloat);
  if(!(P>0)) return null;
  return camKc={P, ox:o[0]-r.width/2, oy:o[1]-r.height/2, w:r.width, h:r.height};
}
function screenOf(K,p,a){
  const v=S.view, ca=Math.cos(a*RAD), f=K.P/(K.P-p.y1*Math.sin(a*RAD));
  return { x:K.ox+(v.x+v.k*p.x1-K.ox)*f, y:K.oy+(v.y+v.k*p.y1*ca-K.oy)*f };
}
// A térkép mérete nem csak ablakméret-váltáskor változhat, ezért figyeljük.
// Méretváltáskor a világ horgonya (a térkép közepe) áttűnés nélkül mozdul,
// a teremszámok vele mennek.
new ResizeObserver(()=>{ camKc=null; if(!labWait && LABS.length) placeTlabels(); syncDens(); })
  .observe($("mapwrap"));

/* ---------- az aktív szint rajzának sűrűsége ---------- */
/* Épület nézetben a böngésző a megdöntött szintet nem a nagyításhoz
   raszterezi: perspektívánál a réteg minden képpontjára egy eszközpixelnyi
   textúrát ad (Chromium, GetIdealContentsScale), és a nagyítás ezt nyújtja
   fel. Asztalon az alapnézet több mint húszszorosáig lehet nagyítani, ott a
   falak lépcsős, elmosott sávok lettek: a legélesebb élek meredeksége a
   nagyítással arányosan esett, k=8,6-nál a hatodára. Az SS=2 ezen csak
   kétszeres tartalékkal segített.
   Ezért az aktív szint SVG-je d-szeres CSS-méretet kap (a viewBox marad, a
   rajz vele nő), a saját scale(1/d)-je pedig visszakicsinyíti: a kép
   ugyanaz, a textúra d-szer sűrűbb. A d a sík legnagyobb nagyítását követi a
   képen — a perspektíva a néző felőli szélen nagyít a legjobban —, √2-es
   lépcsőkben, hogy ne minden görgetésnyi nagyítás rajzoljon újra, és 10%
   tűréssel: ennyi nyújtás nem látszik, alapnézetben pedig Firefoxban egy
   fölösleges lépcsőt spórol (ott d=1,41 +7% körbejárási időbe került, és
   ugyanúgy nézett ki, mint d=1).
   - Csak nyugvó képen vált, a mozdulat vagy az áttűnés végét megvárja: a
     váltás a látható szintet újraraszterezi, mozgás közben ez akadás lenne.
   - Csak az aktív szintnél: a többi halványított környezet, és hétszer annyi
     raszter lenne.
   - Alaprajzon is a nagyítást követi. Ott a böngésző amúgy is a nagyításhoz
     raszterez, a d se a képen, se a költségen nem változtat — viszont 3D-be
     emelve már a helyén van, nem kell a felemelés után még egyszer rajzolni.
   - Telefonon nem: ott a legszűkebb a raszterkeret, és ott nem is jelezték.
   - Chromiumban (Chrome, Edge) és Firefoxban: ezekben mértük. A többi motor
     (Safari) másképp raszterezheti a 3D-t, ott a haszna és az ára ismeretlen.
   Firefoxban más a szabály, és rosszabb: ha az SVG-nek nincs saját
   transzformja, az aktív szintet már alapnézetben is kockásra raszterezi,
   a falai ki is maradnak, nagyítva pedig egyetlen elmosódott folt (k=8-nál
   az élek meredeksége 0,03). Saját transzformmal — akár csak scale(1)-gyel —
   a Chromiuméhoz hasonlóan viselkedik, de ugyanahhoz az élességhez kétszer
   akkora sűrűség kell (k=4-nél d=8: 0,61, k=8-nál d=16: 0,72). Ezért ott
   3D-ben minden szint SVG-je kap transzformot, és a d kétszeres szorzót.
   Minden szint, nem csak az aktív: különben szintváltáskor az új aktív a
   mozgás végétől a nyugvó képig kockás volt — élesben így jelentették:
   „váltásnál először éles, utána kicsit homályos, utána megint éles".
   A többi szint transzformja a mérési zajon belül van. A lapos alaprajzon
   viszont nem kap (lásd setDens()): ott nincs rá szükség, és a kattintást
   elvitte a teremtől. */
const DENS_MAX=16;
const CHROMIUM=!!(navigator.userAgentData&&navigator.userAgentData.brands.some(b=>b.brand==="Chromium"));
const GECKO="mozInnerScreenX" in window, DENS_GAIN=GECKO?2:1;
function planeZoom(){
  const v=S.view, K=S.mode===3 && camK();
  if(!K) return v.k;
  // A kép alsó szélén látszó síkbeli pont van a legközelebb a nézőhöz, de
  // legfeljebb az épület széle: azon túl nincs mit élesen rajzolni.
  const a=S.rot.x*RAD, sa=Math.sin(a), e=K.h/2-K.oy, R=Math.hypot(BB.w,BB.h)/2;
  let y1=K.P*(e-(v.y-K.oy))/(v.k*K.P*Math.cos(a)+e*sa);
  if(!(y1<R)) y1=R;
  return v.k*K.P/(K.P-Math.min(y1*sa,K.P*.75));
}
const densFor=need=>Math.min(DENS_MAX,Math.max(1,2**(Math.ceil(2*Math.log2(need)-.28)/2)));
/* own: d=1-nél is saját transzform (Firefox, lásd fent). Csak 3D-ben kell,
   ott viszont minden szintnek, és már a mozgás elejétől (syncOwn(), a
   syncFlat() hívja): a lapos alaprajzon a Firefox az induláskor így kapott
   SVG-be nem talált bele — a kattintás a szintdobozé lett, a teremé nem. */
function setDens(lv,d,own=false){
  const F=FLOOR[lv]; if((F.dens||1)===d && !!F.own===own) return;
  F.dens=d; F.own=own;
  F.svg.setAttribute("width",PW*d); F.svg.setAttribute("height",PH*d);
  F.svg.style.transform=d!==1?`scale(${1/d})`:own?"translateZ(0)":"";
}
const geckoOwn=()=>GECKO && !app.classList.contains("flat2d");
function syncOwn(){
  if(!GECKO || MOB()) return;
  for(const lv of LV) setDens(lv, FLOOR[lv].dens||1, geckoOwn());
}
let densT=0;
function syncDens(){
  clearTimeout(densT);
  if(MOB() || !(CHROMIUM||GECKO)){ for(const lv of LV) setDens(lv,1); return; }
  densT=setTimeout(function tick(){
    // a pulzáló gyűrű végtelen animációja nem mozgás
    const moving=world.classList.contains("now") || world.getAnimations({subtree:true})
      .some(a=>a.playState==="running" && a.effect && a.effect.getTiming().iterations!==Infinity);
    if(moving){ densT=setTimeout(tick,150); return; }
    const d=densFor(planeZoom()*DENS_GAIN);
    for(const lv of LV) setDens(lv, lv===S.level ? d : 1, geckoOwn());
  },250);
}

/* ---------- teremszámok Épület nézetben ---------- */
/* A síkban fekvő feliratok 3D-ben olvashatatlanok: perspektívánál a böngésző
   a szintet a nézet nagyításától független felbontással rajzolja textúrába,
   így a szöveg nagyítva elmosódik, illesztve pedig pár pixeles. Ezért
   Épület nézetben a teremszámok egy lapos, a jeleneten kívüli rétegben
   állnak: élesek, mindig egyenesen olvashatók, és a helyüket ugyanaz a
   leképezés adja, amelyikkel a döntés forgáspontja számol. Csak az aktív
   szintről — hogy melyik szám látszik, azt a placeTlabels() dönti el. */
const tlab=$("tlabels");
let LABS=[], labFor=null, labStaff=null, labSig="", labT=0, labWait=false;
function labelSet(){
  const F=FLOOR[S.level];
  if(labFor===F.rs && labStaff===S.staff) return;
  labFor=F.rs; labStaff=S.staff; LABS=[]; tlab.textContent="";
  const add=(r,e,ic)=>{ tlab.appendChild(e);
    // a felirat helye a világ síkjában, és a terem feliratnak szánt
    // dobozának két oldala (a világ pixelében). A piktogram a terem
    // méretétől függetlenül kint van, és elsőbbséget kap: egy kis mosdó
    // ugyanúgy kell, mint egy nagy.
    LABS.push({e,r, X:(r.cx-BB.cx)*PXM, Y:(r.cy-BB.cy)*PXM,
      lo:ic?Infinity:Math.min(r.lw,r.lh)*PXM, hi:ic?Infinity:Math.max(r.lw,r.lh)*PXM,
      area:ic?Infinity:r.lw*r.lh, w:0,h:0,on:false}); };
  const ikonos=[];
  for(const r of F.rs){
    // ugyanaz a szabály, mint az alaprajzi feliratoknál
    if(!r.code || (!S.staff && STAFF.has(r.cat))) continue;
    if(iconsOf(r)){ ikonos.push(r); continue; }
    const e=document.createElement("span");
    e.className="tlabel off"; e.textContent=roomLabel(r); add(r,e,false);
  }
  /* A piktogramok magonként egy jelvényben. Egy mag (lépcső, mellette a
     férfi, a női és az akadálymentes mosdó) pár méteren belül van, és
     Épület nézetben a képernyőn egymásra esnének: egyenként a fele sem
     látszott (telefonon a II. emeleten 10-ből 3), és épp a lépcső maradt ki.
     Alaprajzon a szint rajzában helyiségenként áll, ott elfér. */
  const magok=[];
  for(const r of ikonos){
    const kozel=magok.filter(m=>m.some(q=>Math.hypot(q.cx-r.cx,q.cy-r.cy)<MAG_M));
    const m=kozel.flat().concat(r);
    for(const k of kozel) magok.splice(magok.indexOf(k),1);
    magok.push(m);
  }
  for(const m of magok){
    const ic=[...new Set(m.flatMap(iconsOf))].sort((a,b)=>ICO_SOR.indexOf(a)-ICO_SOR.indexOf(b));
    const e=document.createElement("span");
    e.className="tlabel off tico"; e.dataset.ico=m.map(r=>r.code).join(" ");
    e.innerHTML=ic.map(k=>`<svg viewBox="0 0 24 24"><use href="#i-${k}"/></svg>`).join("");
    // a jelvény a mag közepén; a „terme" a mag, a teremszámok szabályai rá is állnak
    const cx=m.reduce((a,r)=>a+r.cx,0)/m.length, cy=m.reduce((a,r)=>a+r.cy,0)/m.length;
    add({code:null,level:F.rs[0].level,cat:m[0].cat,cx,cy,lw:0,lh:0,mag:m},e,true);
  }
  for(const L of LABS){ L.w=L.e.offsetWidth; L.h=L.e.offsetHeight; }
}
/* Melyik szám látszik. Az első változat akkor mutatta, ha a szám belefért a
   terem VETÜLETÉBE — élből nézve a terem vékony csík, így a számok eltűntek
   (58°-on 16 látszott, 85°-on 1), a határon pedig a remegő ujj ki-be
   kapcsolgatta őket (nagyítva, 80° körül 24 lépésből 23-szor), és
   körbejáráskor is, mert a vetület a teremmel együtt fordul, a felirat nem.
   Ezért:
   - Hogy egy terem elég nagy-e a számához, azt csak a nagyítás és a mélység
     dönti el, a dőlés és az irány nem: a feliratnak szánt dobozát
     rövidülés nélkül mérjük a képernyőn (k · perspektíva a terem mélységében).
   - Élből nézve sem lógnak egymásra: amelyik szám egy nagyobb teremével
     ütközne, az kimarad.
   - Mindkét döntés kétirányú: megjelenni 15%-kal nagyobb terem és 6 px
     szabad hely kell, mint ottmaradni, és ami már látszik, azt egy újonnan
     beférő nem szoríthatja ki. Enélkül a remegő ujj alatt 24 lépésből
     120-szor kapcsoltak; bármelyik hiszterézis egyedül is elég, együtt
     biztos. Egy időzítős várakozást is kipróbáltunk rá, az mérhetően nem
     segített.
   - A kép szélén a szám a térképpel együtt lép ki és be, a keret levágja —
     ahogy magát a termet is. Ezért addig látszik, amíg bármelyik része bent
     van: ki-be csak ott vált, ahol már úgysem látszik. Egy korábbi változat
     a szélen is döntött, és erős nagyításnál a remegő ujj alatt ott
     ingázott. */
function placeTlabels(){
  const K=camK(); if(!K) return;
  const b=S.rot.z*RAD, cb=Math.cos(b), sb=Math.sin(b), sa=Math.sin(S.rot.x*RAD), d=devicePixelRatio||1;
  for(const L of LABS){
    const x1=L.X*cb-L.Y*sb, y1=L.X*sb+L.Y*cb, s=screenOf(K,{x1,y1},S.rot.x);
    L.cx=s.x+K.w/2; L.cy=s.y+K.h/2;
    const f=S.view.k*K.P/(K.P-y1*sa), m=L.on?1:1.15;
    L.ok = L.cx+L.w/2>0 && L.cx-L.w/2<K.w && L.cy+L.h/2>0 && L.cy-L.h/2<K.h &&
           L.hi*f>=L.w*m && L.lo*f>=L.h*m;
    L.kozep = L.cx>0 && L.cx<K.w && L.cy>0 && L.cy<K.h;
  }
  const foglalt=[];
  // sorrend: ami már látszik; aztán akinek a közepe a képben van (egy
  // nagyrészt kilógó ne szorítson ki egy egészen látszót); aztán a nagyobb terem
  /* A mosdó- és lépcsőjelvény körül meredek szögben nagyobb a szabad hely,
     amíg egy szám előjönne: a jelvény széles, és 80°-nál a mellette álló
     szám egy remegésnyi dőlésre 13 px-t is ugrik (a sík rövidülése
     változik, a jelvény a mag közepén alig mozdul) — 6 px-nél ki-be
     kapcsolt. Laposabb szögben az ugrás kicsi, ott a nagyobb szabad hely
     csak számokat vinne el (telefonon a földszinten 12-ből 6-ot). */
  const pIco=6+12*Math.max(0,Math.min(1,(S.rot.x-65)/20));
  /* Két szám közt is: élhez közel a különböző mélységű számok egy remegésnyi
     dőlésre egymáshoz képest is elmozdulnak (81° és 82,5° közt 7 px-t, a
     földszinti F03 és az aula felirata), és 6 px-nél ki-be kapcsolt. */
  const pSzam=6+8*Math.max(0,Math.min(1,(S.rot.x-70)/15));
  for(const L of LABS.filter(L=>L.ok).sort((A,B)=>(B.on-A.on)||(B.kozep-A.kozep)||(B.area-A.area))){
    const x0=L.cx-L.w/2, y0=L.cy-L.h/2, x1=x0+L.w, y1=y0+L.h;
    if(foglalt.some(q=>{ const p=L.on?0:q[4]?pIco:pSzam; return x0-p<q[2]&&q[0]<x1+p&&y0-p<q[3]&&q[1]<y1+p; })){ L.ok=false; continue; }
    foglalt.push([x0,y0,x1,y1,L.area===Infinity]);
  }
  for(const L of LABS){
    // A rejtett is a helyére megy: úgy tűnik elő, ahol a terme van, és a
    // böngésző is mindig a valódi helyét látja. Eszközpixelre kerekítve, hogy
    // nyugalomban a szöveg éles maradjon.
    L.e.style.transform=`translate(${Math.round((L.cx-L.w/2)*d)/d}px,${Math.round((L.cy-L.h/2)*d)/d}px)`;
    if(L.ok!==L.on){ L.on=L.ok; L.e.classList.toggle("off",!L.ok); }
  }
}
/* Mikor látszanak. Gesztus közben (.now) képkockánként mennek a világgal,
   ugyanabban a képkockában írva. Animált váltáskor (gomb, illesztés,
   szintváltás, a panel mozgása) a világot a böngésző úsztatja a
   kompozitoron, azt innen nem lehet képkockára pontosan követni: a mozgás
   idejére eltűnnek, és a végén az új helyükön úsznak be. Csak ha a kamera
   tényleg mozdult — egy kiválasztás vagy útvonal-frissítés nem villantja el
   őket. */
const camSig=()=>[S.mode,S.level,S.view.x,S.view.y,S.view.k,S.rot.x,S.rot.z].join();
function syncLabels(){
  if(S.mode!==3 || !app.classList.contains("deep")){
    clearTimeout(labT); labWait=false; labSig=""; tlab.classList.add("off"); return;
  }
  labelSet();
  const sig=camSig(), moved=sig!==labSig; labSig=sig;
  if(world.classList.contains("now")){ clearTimeout(labT); labWait=false; }
  else if(moved){
    tlab.classList.add("off"); labWait=true; clearTimeout(labT);
    labT=setTimeout(()=>{ labWait=false; syncLabels(); },1050);
    return;
  }
  if(labWait) return;
  placeTlabels(); tlab.classList.remove("off");
}

/* ---------- útvonal rajzolása ---------- */
function drawRoute(){
  for(const lv of LV) FLOOR[lv].route.textContent="";
  world.querySelectorAll(".riser").forEach(n=>n.remove());
  RISERS.length=0;
  if(!S.route) return;
  const mm=S.mm;
  mm.segs.forEach((s,si)=>{
    const g=FLOOR[s.lv].route;
    if(s.pts.length>1){
      const pts=s.pts.map(p=>p.join(",")).join(" ");
      g.appendChild(el("polyline",{points:pts,class:"rl casing"}));
      const line=el("polyline",{points:pts,class:"rl draw"});
      g.appendChild(line);
      const L=line.getTotalLength?line.getTotalLength():200;
      line.style.setProperty("--len",L);
    }
    const nx=mm.segs[si+1];
    if(nx){
      const p=s.pts[s.pts.length-1];
      ring(g,p);
      const dz=(FLOOR[nx.lv].idx-FLOOR[s.lv].idx)*GAP;
      riser(s.lv,p,Math.abs(dz),dz>0);
      ring(FLOOR[nx.lv].route,nx.pts[0]);
    }
  });
  const f=mm.segs[0],l=mm.segs[mm.segs.length-1];
  pin(FLOOR[f.lv].route,f.pts[0],"A","var(--accent)","pin-a");
  pin(FLOOR[l.lv].route,l.pts[l.pts.length-1],"B","var(--route)","pin-b");
}
function pin(g,p,ch,col,cls){
  g.appendChild(el("circle",{cx:p[0],cy:p[1],r:1.75,fill:col,stroke:"var(--slab)",
    "stroke-width":.5,class:cls}));
  const t=el("text",{x:p[0],y:p[1]+.62,class:"mkt "+cls});t.textContent=ch;g.appendChild(t);
}
function ring(g,p){ g.appendChild(el("circle",{cx:p[0],cy:p[1],r:1.5,class:"ring"})); }
/* A lépcsőjel a nyitott köteg szintközére készül, és a köteggel együtt nyílik
   (r = reveal()). Transzformmal, nem magassággal: az csak a réteget mozgatja,
   a magasság átfestetné. */
const RISERS=[];
const riserT=(upward,r)=>`translate(-50%,-100%) rotateX(${upward?-90:90}deg) scaleY(${r})`;
function riser(lv,p,h,upward){
  const d=document.createElement("div");
  d.className="riser";
  d.style.left=(p[0]*PXM)+"px";
  d.style.top=(p[1]*PXM)+"px";
  d.style.height=h+"px";
  d.upward=upward;
  d.style.transform=riserT(upward,reveal());
  FLOOR[lv].box.appendChild(d);
  RISERS.push(d);
}

/* ------------------------------------------------------------------ nézet */
function projBBox(){
  const three=S.mode===3;
  // Ugyanaz a képlet szolgálja ki a két nézetet: alaprajzon a dőlés 0 (ca=1,
  // sa=0) és nincs szintek közti távolság, de a forgatás ott is beleszámít —
  // enélkül az elforgatott tervlapra rosszul illesztene a ⤢.
  const b=bearing()*Math.PI/180, a=S.rot.x*Math.PI/180;
  const cb=Math.cos(b), sb=Math.sin(b);
  const ca=three?Math.cos(a):1, sa=three?Math.sin(a):0;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  const ai=LVI[S.level];
  for(const r of D.rooms){
    if(!three && r.level!==S.level) continue;
    const z = three ? (LVI[r.level]-ai)*GAP : 0;
    for(let i=0;i<r.poly.length;i+=2){
      const X=(r.poly[i][0]-BB.cx)*PXM, Y=(r.poly[i][1]-BB.cy)*PXM;
      const px=X*cb-Y*sb, py=(X*sb+Y*cb)*ca - z*sa;
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py;
    }
  }
  return {w:Math.max(1,x1-x0), h:Math.max(1,y1-y0), cx:(x0+x1)/2, cy:(y0+y1)/2};
}
function insetFor(n){
  if(!MOB()) return 0;
  return n==="peek" ? 128 : Math.round(innerHeight*.46)+10;
}
function fit(){
  const w0=$("mapwrap").clientWidth, h0=$("mapwrap").clientHeight;
  const inset = insetFor(typeof snap==="undefined"?"peek":snap), sideGap = MOB()?58:0;
  const w = w0-sideGap, h = h0-inset;
  const P = projBBox();
  const k = Math.min(w/P.w, h/P.h) * (MOB()?.95:.9);
  S.view={k, x:-P.cx*k - sideGap/2, y:-P.cy*k - inset/2};
  S.dirty=false;
  updateView();
}
let flatT=0;
function syncFlat(){
  clearTimeout(flatT);
  if(S.mode===3){ app.classList.remove("flat2d"); syncOwn(); return; }
  // Az átmenet lefutása után lapul le az alaprajz: a kép nem változik, csak a
  // 3D-s kameraforma cserélődik a lapos 2D-sre, és a gyors útvonal visszajön.
  flatT=setTimeout(()=>{ if(S.mode!==2) return;
    flat=true; setWorldInstant(); app.classList.add("flat2d"); syncOwn(); },1050);
}
/* Az átmenet idejére az SVG-belső áttűnések kikapcsolnak — lásd a .switching
   szabályt. Kicsivel az 1s-os mozgás után vesszük le, és minden váltás
   újraindítja az órát, hogy egy gyors oda-vissza kattintás se hagyja fent. */
let switchT=0;
function markSwitching(){
  app.classList.add("switching");
  clearTimeout(switchT);
  switchT=setTimeout(()=>app.classList.remove("switching"),1150);
}
/* keepView: a nézet marad, ahol van. A kétujjas döntés gesztus közben vált
   Alaprajzról Épületre, ott egy újraillesztés kiugratná a térképet a kéz alól. */
function setMode(m,keepView){
  if(S.mode===m)return;
  markSwitching();
  // A lapos alaprajzból előbb a vele azonos képet adó 3D-s kameraformára
  // váltunk, még a régi módban — innen úszik át a dőlés tisztán.
  if(flat){ flat=false; setWorldInstant(); }
  S.mode=m;
  app.classList.toggle("m3",m===3); app.classList.toggle("m2",m===2);
  $("m2").setAttribute("aria-pressed",m===2); $("m3").setAttribute("aria-pressed",m===3);
  applyMapLabel();
  if(keepView) updateView(); else fit();
  syncFlat();
}
function dive(lv){
  S.level=lv; renderRail();
  if(S.mode===3) setMode(2); else updateView();
  // A födémre kattintás szintet vált — a nézetváltás mellett ez a lényegi hír.
  sayLevel();
}
(function(){
  const stage=$("stage");
  const pts=new Map();
  let drag=null,moved=0,pinch=null,tilted=false,pivot=null;
  const nowOn =()=>{world.classList.add("now");    app.classList.add("navving");};
  const nowOff=()=>{world.classList.remove("now"); app.classList.remove("navving");};
  /* A két ujj fogása: középpont, távolság és az általuk bezárt szög. A szög a
     csavaráshoz kell — enélkül a kétujjas gesztus csak nagyítani és tolni
     tudott, forgatni nem. */
  const mid=()=>{const a=[...pts.values()], dx=a[1].x-a[0].x, dy=a[1].y-a[0].y;
    return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,
            d:Math.hypot(dx,dy), a:Math.atan2(dy,dx), p:a};};
  /* Ennyi fok elcsavarás után indul a forgatás. Holtjáték nélkül minden
     csippentés forgatna is valamennyit, mert a két ujj sosem pontosan egy
     tengely mentén mozdul; a küszöböt utána levonjuk, hogy induláskor ne
     ugorjon egyet a térkép. */
  const TWIST_DEAD=8;
  /* A döntés a kétujjas mozdulatok közül az egyetlen, amelyik KIZÁRJA a
     többit: ugyanaz a függőleges elmozdulás tolásnak is olvasható, a kettő
     nem mehet egyszerre. Ezért a gesztus az első határozott mozdulatnál
     eldől — döntés vagy minden más —, és a fogás végéig ott marad.
     A küszöbök ezt a döntést teszik határozottá:
       TILT_TAKE  mindkét ujjnak ennyit kell FÜGGŐLEGESEN, azonos irányba
       TILT_SKEW  ennél jobban nem lóghat el oldalra (≈19°-os kúp)
       PINCH_BAND ennél jobban nem változhat az ujjak távolsága
       PAN_TAKE   ennyi oldalirányú elmozdulás után már tolásnak vesszük  */
  const TILT_TAKE=16, TILT_SKEW=.35, PINCH_BAND=.06, PAN_TAKE=12, TILT_RATE=.25;

  /* A döntés a fogás alatti pont körül megy, nem a világ középpontja (az
     épület közepe) körül. Nagyítva az épület közepe messze a képen kívül
     lehet, és a körülötte billenő sík a látott részt százpixelnyit elhúzta
     volna az ujjak alól. Így a pont ott marad, ahová az ujjak letették — mint
     a Google Mapsnél. A leképezés (camK, screenOf) közös a teremszámokkal;
     egy adott dőléshez ebből visszaszámolható az a nézet-eltolás, amelynél
     a pont ugyanott marad. */
  // a képernyőpont (a világ horgonyához képest) alatti síkbeli pont
  const planeAt=(K,sx,sy,a)=>{
    const v=S.view, ca=Math.cos(a*RAD), sa=Math.sin(a*RAD), e=sy-K.oy;
    let y1=K.P*(e-(v.y-K.oy))/(v.k*K.P*ca+e*sa);
    // Az épületen messze túl — vagy meredeken a horizont fölé — fogva a pont
    // a kamera közelébe kerülne; az épület méretére vágjuk. A forgáspont
    // ilyenkor a vágott pont vetülete, nem az ujjaké, így az sem ugrik.
    const R=Math.hypot(BB.w,BB.h)/2;
    if(!Number.isFinite(y1)) y1=0;
    y1=Math.max(-R,Math.min(R,y1));
    const x1=((sx-K.ox)*(K.P-y1*sa)/K.P+K.ox-v.x)/v.k;
    return {x1,y1};
  };
  // az a nézet-eltolás, amelynél a p síkbeli pont a dőlés mellett is s-en marad
  const viewKeeping=(K,p,s,a)=>{
    const f=(K.P-p.y1*Math.sin(a*RAD))/K.P, k=S.view.k;
    return { x:K.ox+(s.x-K.ox)*f-k*p.x1, y:K.oy+(s.y-K.oy)*f-k*p.y1*Math.cos(a*RAD) };
  };
  const keepPivot=(pv,a)=>{
    if(!pv) return;
    const v=viewKeeping(pv.K,pv.p,pv.s,a);
    if(Number.isFinite(v.x)&&Number.isFinite(v.y)){ S.view.x=v.x; S.view.y=v.y; }
  };

  /* A pointermove sűrűbben tüzel, mint ahány képkocka van (telefonon 120 Hz+),
     ezért az írást egy rAF-ra fogjuk össze: képkockánként pontosan egy transform. */
  /* A drag objektum egyetlen helyen épül. Korábban a pointerdown és az ujjak
     fogyásakor külön-külön készült, és az utóbbiból kimaradt a pan/rz/rx —
     így a rotálóág undefined-ből számolt, S.rot NaN lett, a transzformot a
     böngésző eldobta, és a térkép megfagyott. */
  const startDrag=(x,y,pan)=>({x,y,vx:S.view.x,vy:S.view.y,rz:S.rot.z,rx:S.rot.x,pan});

  let raf=0, needTags=false, pinchDue=false;
  const paint=()=>{ raf=0;
                    if(pinchDue){ pinchDue=false; if(pinch&&pts.size>=2) pinchStep(); }
                    world.style.transform=worldTransform();
                    // a szintek átlátszósága a dőléstől függ, döntés közben is
                    if(needTags){ needTags=false; orientTags(); syncFloors(); }
                    syncLabels(); syncDens(); };
  const schedule=()=>{ if(!raf) raf=requestAnimationFrame(paint); };
  const scheduleRot=()=>{ needTags=true; schedule(); };

  /* A rect olvasása transform-írás után kényszerített layoutot okoz. Gesztusonként
     egyszer olvassuk ki, nem mozdulatonként. */
  let rect=null;
  const getRect=()=>rect||(rect=$("mapwrap").getBoundingClientRect());
  const dropRect=()=>{rect=null;};
  addEventListener("resize",dropRect,{passive:true});
  addEventListener("orientationchange",dropRect);
  addEventListener("scroll",dropRect,{passive:true});

  /* Egy sima kattintás a teremé. A mutatót (pointer capture) és a navigáló
     állapotot (.navving: a szintek nem kapnak kattintást) csak akkor vesszük
     át, amikor a mozdulat tényleg húzássá válik. Korábban már a lenyomáskor
     átvettük, és egérrel így a felengedés és a kattintás is a színpadra
     ment, nem a teremre: asztalon egyetlen termet sem lehetett kiválasztani,
     a színpadra kattintás pedig még a kijelölést is törölte. Érintésnél ez
     nem látszott, ott a koppintás a koppintott elemet kapja. */
  const CLICK_SLOP=6;
  let taken=false;
  const take=()=>{ if(taken) return; taken=true;
    for(const id of pts.keys()) try{ stage.setPointerCapture(id); }catch(_){}
    nowOn(); };
  stage.addEventListener("pointerdown",e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    dropRect();
    if(pts.size===1) taken=false; else take();
    if(pts.size===1){
      // Épület nézetben egy ujj forgat, Alaprajzon tol. Shift vagy a középső/jobb
      // gomb egérrel forgatás helyett tolás, hogy asztali gépen is legyen pan.
      drag=startDrag(e.clientX,e.clientY,
        S.mode!==3 || e.shiftKey || e.button===1 || e.button===2);
      moved=0; tilted=false; pivot=null;
    }
    else if(pts.size===2){const m=mid();
      pinch={d:m.d,k:S.view.k,x:S.view.x,y:S.view.y,mx:m.x,my:m.y,
             last:m.a,tw:0,rz:S.rot.z,rot:false,slack:0,
             ay:m.p[0].y,by:m.p[1].y,lock:null,rx:0,tslack:0};drag=null;}
  });
  /* A kétujjas mozdulatot képkockánként egyszer értékeljük, a két ujj együttes
     állásán — a pointermove csak feljegyzi az ujjak helyét. Az események
     ujjanként jönnek, és eseményenként számolva az egyik ujj már az új helyén
     állt, a másik még a régin. Akadozó képnél egy lépés 30–75 px, és ettől a
     fél lépéstől a két ujj távolsága és szöge egy pillanatra annyit változott,
     hogy a döntést csippentésnek és csavarásnak vette: élesben a lefelé húzás
     alig akart visszaváltani Alaprajzra, amikor az Épület nézet lelassult. */
  const pinchStep=()=>{
    const m=mid(), f=m.d/pinch.d;
    const nk=Math.max(.15,Math.min(10,pinch.k*f)), g=nk/pinch.k;

    /* Csavarás. A teljes elfordulást képkockánként gyűjtjük, nem a
       kiinduló szöghöz képest mérjük: így a ±180°-on átfordulva sem ugrik,
       és egy gesztuson belül akárhányszor körbe lehet forgatni. */
    let da=m.a-pinch.last;
    if(da> Math.PI) da-=2*Math.PI; else if(da<-Math.PI) da+=2*Math.PI;
    pinch.last=m.a; pinch.tw+=da;
    const twDeg=pinch.tw*180/Math.PI;
    if(!pinch.rot && Math.abs(twDeg)>TWIST_DEAD){
      pinch.rot=true; pinch.slack=Math.sign(twDeg)*TWIST_DEAD*Math.PI/180;
    }
    const th=pinch.rot ? pinch.tw-pinch.slack : 0;

    /* Döntés vagy minden más — az első határozott mozdulat dönti el. */
    const dmx=m.x-pinch.mx, dmy=m.y-pinch.my;
    let felemel=false;
    if(!pinch.lock){
      const day=m.p[0].y-pinch.ay, dby=m.p[1].y-pinch.by;
      const egyutt=day*dby>0 && Math.min(Math.abs(day),Math.abs(dby))>TILT_TAKE;
      if(Math.abs(f-1)>PINCH_BAND||Math.abs(twDeg)>TWIST_DEAD||Math.abs(dmx)>PAN_TAKE)
        pinch.lock="map";
      else if(egyutt && Math.abs(dmx)<Math.abs(dmy)*TILT_SKEW){
        pinch.lock="tilt"; tilted=true; felemel=true;
      }
    }
    if(pinch.lock==="tilt" && !felemel){
      // Felfelé húzva emelkedik a dőlés (élből nézet) — ugyanaz az irány,
      // mint az Épület nézet egyujjas mozdulatánál. Két ujjal egészen 0°-ig
      // le lehet dönteni: ott a kép már az alaprajz, és elengedve az is lesz.
      const nx=Math.max(0,Math.min(TILT_MAX,
               pinch.rx-(dmy-pinch.tslack)*TILT_RATE));
      if(Number.isFinite(nx)) S.rot.x=nx;
      keepPivot(pivot,S.rot.x);
      S.dirty=true; needTags=true; moved=99; return;
    }

    const r=getRect();
    const cx=pinch.mx-r.left-r.width/2, cy=pinch.my-r.top-r.height/2;
    /* Alaprajzon a forgatás a két ujj közepe köré megy: a világ ott sima
       2D-s forgatást kap, így a fogáspont alatti térképrész pontosan a hely
       marad. Épület nézetben a rotateZ a megdöntött síkban hat, azt egy
       képernyő-síkú eltolással nem lehet pontosan kiegyenlíteni — ott a
       forgatás az épület közepe körül fordul, ami körbejárásnál amúgy is a
       várt viselkedés. */
    const ct=S.mode===3?1:Math.cos(th), st=S.mode===3?0:Math.sin(th);
    const ox=pinch.x-cx, oy=pinch.y-cy;
    S.view.k=nk;
    S.view.x=cx+(ox*ct-oy*st)*g+(m.x-pinch.mx);
    S.view.y=cy+(ox*st+oy*ct)*g+(m.y-pinch.my);
    if(pinch.rot){
      const nz=pinch.rz+th*180/Math.PI;
      if(Number.isFinite(nz)) S.rot.z=nz;          // sose ragadjon be
    }
    if(felemel){
      /* A döntés innen indul. A küszöbig megtett tolás marad — a térkép
         eddig az ujjakat követte, és a fenti ág ezt az utolsó lépést is még
         a két ujj szerint vette át. Ha itt visszarántanánk, a döntés egy
         ugrással indulna.
         Alaprajzról a döntés emel át Épület nézetbe, 0°-ról: az alaprajz
         maga a 0°-os kamera, így a felemelés első képkockája pontosan
         ugyanaz, ami előtte volt. A dőlést még a nézetváltás ELŐTT
         nullázzuk, hogy a setMode() ne a régi, 58°-os állással írjon ki egy
         képkockát. A szétnyílást és a beúszást a syncFloors() vezeti a
         dőlésből. */
      if(S.mode!==3){ S.rot.x=0; setMode(3,true); }
      pinch.rx=S.rot.x; pinch.tslack=dmy;
      // A forgáspont az ujjak közepe — alatta még mindig ugyanaz a pont
      // van, ahová letették őket. A leképezést a setMode() után kérjük:
      // alaprajzon (.flat2d) nincs perspektíva.
      const K=camK();
      if(K){
        const p=planeAt(K,m.x-r.left-r.width/2,m.y-r.top-r.height/2,S.rot.x);
        pivot={K,p,s:screenOf(K,p,S.rot.x)};
      }
      S.dirty=true; needTags=true; moved=99; return;
    }
    S.dirty=true; if(pinch.rot) needTags=true; moved=99;
  };
  stage.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){ pinchDue=true; schedule(); return; }
    if(!drag)return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    if(!taken){ if(moved<=CLICK_SLOP) return; take(); }
    if(drag.pan){
      S.view.x=drag.vx+dx; S.view.y=drag.vy+dy;
      S.dirty=true; schedule();
    }else{
      /* A modell az ujjat követi: a hozzánk közeli oldal arra megy, amerre húzod.
         A világ rotateX(rx) rotateZ(rz)-t kap, egy pont képernyő-x-e cos(θ+rz),
         ennek deriváltja rz szerint -sin(θ+rz); az elöl lévő pontnál θ+rz=90°,
         vagyis -1 — ezért kell a rz-t csökkenteni jobbra húzáskor.
         ~300px vízszintes húzás ≈ negyed fordulat; a dőlés vékonyabb sávban mozog. */
      const nz = drag.rz - dx*0.30;
      const nx = Math.max(TILT_MIN,Math.min(TILT_MAX, drag.rx - dy*0.22));
      if(!Number.isFinite(nz)||!Number.isFinite(nx)) return;   // sose ragadjon be
      S.rot.z = nz; S.rot.x = nx;
      S.dirty=true; scheduleRot();
    }
  },{passive:true});
  const end=e=>{
    // a még függő kétujjas lépés a két ujj utolsó állásán, mielőtt az egyik kiesne
    if(pinchDue && pinch && pts.size>=2){ pinchDue=false; pinchStep(); }
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    // Az utolsó pozíciót még a .now osztály alatt véglegesítjük, különben a
    // visszakapcsoló 1s-os transition ráugrana a függőben lévő képkockára.
    if(raf){cancelAnimationFrame(raf); paint();}
    if(pts.size===0){
      window.__moved=moved>CLICK_SLOP;drag=null;taken=false;
      /* A döntés oda-vissza jár. Az Épület nézet 15° (TILT_MIN) alatt nem
         nyugszik meg: elengedve oda úszik, amelyiknek a kép épp mutatja
         magát. Ha nincs 3D-s megjelenésben (.deep — a határa kétirányú, lásd
         DEEP_AT), vissza Alaprajzra; ha abban van, föl 15°-ra. Az ujjak
         felemelésekor döntünk, nem közben — így a határon nem billeg ide-oda
         a két nézet közt. Csak
         a kétujjas döntés vált nézetet; az Épület nézet egyujjas mozdulata
         körbejárás, attól nem szabad kiesni a nézetből. Az úszás a .navving
         levétele UTÁN megy, hogy átúszhasson, ne csattanjon, és a forgáspont
         körül, hogy az ujjak alatti pont most se mozduljon el.
         Visszaúszás után a dőlés az alapállásra áll: a következő Épület gomb
         ne egy félbehagyott, 15° alatti szögre érkezzen. */
      const kint = tilted && S.mode===3;
      const leszall = kint && !app.classList.contains("deep");
      const cel = leszall ? 0 : kint && S.rot.x<TILT_MIN ? TILT_MIN : null;
      const pv=pivot;
      // a forgáspont a MOSTANI képernyőhelyén marad: ha a döntés után még
      // toltak vagy csippentettek is, azt nem vonjuk vissza
      if(cel!==null && pv) pv.s=screenOf(pv.K,pv.p,S.rot.x);
      tilted=false; pivot=null;
      setTimeout(()=>{ nowOff();
        if(cel===null) return;
        keepPivot(pv,cel);
        if(leszall){ setMode(2,true); S.rot.x=ROT0.x; }
        else { S.rot.x=cel; updateView(); }
      },40);
    }
    else if(pts.size===1){
      /* A csippentésből egy ujjra fogyva tolunk tovább: a gesztus két ujjal
         indult, hirtelen forgatásba váltani meglepő lenne. */
      const a=[...pts.values()][0];
      drag=startDrag(a.x,a.y,true);
    }
  };
  stage.addEventListener("pointerup",end); stage.addEventListener("pointercancel",end);
  stage.addEventListener("wheel",e=>{e.preventDefault();nowOn();
    zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY);setTimeout(nowOff,60);},{passive:false});
  $("zin").onclick=()=>zoom(1.22); $("zout").onclick=()=>zoom(1/1.22); $("zfit").onclick=()=>{ S.rot={...ROT0}; orientTags(); fit(); };
  function zoom(f,cx,cy){
    const nk=Math.max(.15,Math.min(10,S.view.k*f));f=nk/S.view.k;
    const r=getRect();
    const mx=(cx==null?r.width/2:cx-r.left)-r.width/2, my=(cy==null?r.height/2:cy-r.top)-r.height/2;
    S.view.x=mx-(mx-S.view.x)*f; S.view.y=my-(my-S.view.y)*f; S.view.k=nk;
    S.dirty=true; schedule();
  }
})();
$("stage").addEventListener("click",()=>{if(window.__moved)return;
  if(MOB()&&snap==="full"){setSnap("peek");return;}
  if(S.sel){S.sel=null;refreshSel();renderPanel();}});

/* --------------------------------------------------- foglalható termek */
/* Az egyetem hivatalos teremnevei (ingatlan-nyilvántartás) és a Neptun
   órarendje (tools/build-termek.py). A kettő a teremnéven találkozik. Az
   alaprajz más kódrendszert használ; a térképpel a NEPTUN tábla köti össze,
   ott, ahol már van megerősített pár. */
let TM=null, tmLoading=null, tmDone=false;
/* Más formátumú (régi) adatból inkább semmi, mint hibás állapot: egy
   gyorsítótárban ragadt régi fájl így „nincs adat"-ot ad, nem kivételt.
   Egy deploy utáni első megnyitáskor viszont még a RÉGI service worker
   válaszol, és az a régi fájlt adja a saját gyorsítótárából — az új csak
   akkor veszi át, amikor már települt. Ezért ilyenkor egyszer újrakérjük,
   egyedi paraméterrel a cím végén: azt a régi gyorsítótár nem ismeri, így a
   hálózatról jön. */
const tmOk=d=>d&&d.het1&&d.rooms&&d.targyak?d:null;
const tmGet=(u,o)=>fetch(u,o).then(r=>r.ok?r.json():null).catch(()=>null);
const tmLoad=()=>tmLoading||(tmLoading=tmGet("data/termek.json")
  .then(d=>tmOk(d)||tmGet("data/termek.json?v="+Date.now(),{cache:"no-store"}))
  .then(d=>{ TM=tmOk(d); tmDone=true; return TM; }));

const hhmm=m=>String((m/60)|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const isoDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const utcOf=iso=>{ const [y,m,d]=iso.split("-").map(Number); return Date.UTC(y,m-1,d); };

/* Az adat heti ismétlődés (hetek bitmaszkja), nem napra kibontott foglalás:
   egy ISO naphoz a félév hete és a hét napja kell. UTC-ben számolunk, hogy az
   óraátállítás ne csússzon bele. null, ha a nap az oktatási heteken kívül
   esik — ott nincs adatunk, és ezt kell mondani, nem azt, hogy szabad. */
function tmWeek(iso){
  const n=Math.round((utcOf(iso)-utcOf(TM.het1))/864e5), w=Math.floor(n/7)+1;
  return n<0||w>TM.hetek ? null : {w, day:n%7+1};
}
const tmLast=()=>new Date(utcOf(TM.het1)+(7*TM.hetek-1)*864e5).toISOString().slice(0,10);

/* Egy terem adott napi órái, időrendben. */
function tmDay(room,iso){
  const k=tmWeek(iso);
  if(!k||TM.szunnap.includes(iso)) return [];
  return room.slots.filter(s=>s[0]===k.day&&(s[3]>>(k.w-1))&1)
    .map(([,from,to,,kind,ti])=>({from,to,kind,subj:TM.targyak[ti]}))
    .sort((a,b)=>a.from-b.from||a.to-b.to);
}

/* Most szabad-e. Ha a napra nincs adatunk, azt mondjuk meg — nem azt, hogy
   szabad. Ünnepnapon nincs óra. A közös termekben (kozos) más kar is tart
   órát, és azokról az adatban nincs semmi: ott az óra hiánya csak annyit
   jelent, hogy a mi karunké nincs — „Szabad?", nem „Szabad". */
function tmNow(room,now){
  const iso=isoDay(now);
  if(!TM||!tmWeek(iso)) return {state:"nodata"};
  if(TM.szunnap.includes(iso)) return {state:"holiday"};
  const min=now.getHours()*60+now.getMinutes(), day=tmDay(room,iso);
  const cur=day.filter(b=>b.from<=min&&min<b.to);
  if(cur.length){
    // az egymásba érő órák végéig foglalt
    let until=Math.max(...cur.map(b=>b.to));
    for(const b of day) if(b.from<=until&&b.to>until) until=b.to;
    return {state:"busy",b:cur[0],until};
  }
  return {state:room.kozos?"maybe":"free",next:day.find(b=>b.from>min)};
}

/* Egy terem sora (név, Neptun-kód, állapot, férőhely) és a kinyitott része
   (a mai órák, a felszereltség). A foglalható termek listája és a térképen
   kiválasztott terem adatlapja ugyanezt mutatja, csak az utóbbin nem
   kattintható a sor. */
const TMKIND={eloadas:"kEloadas",gyakorlat:"kGyakorlat",labor:"kLabor"};
function tmRow(r,now,t,tag,attr){
  const st=tmNow(r,now), kn=k=>t[TMKIND[k]||"kEgyeb"];
  let badge,sub;
  if(st.state==="nodata"){ badge=`<span class="tmb none">–</span>`; sub=t.tmNoData; }
  else if(st.state==="holiday"){ badge=`<span class="tmb none">–</span>`; sub=t.tmHoliday; }
  else if(st.state==="busy"){ badge=`<span class="tmb busy">${t.tmBusy}</span>`;
    sub=`${esc(st.b.subj)} · ${kn(st.b.kind)} · ${t.tmUntil.replace("%s",hhmm(st.until))}`; }
  else {
    const nx=st.next?t.tmFrom.replace("%s",hhmm(st.next.from)):t.tmNoMore;
    badge=st.state==="maybe"?`<span class="tmb maybe">${t.tmMaybe}</span>`
                            :`<span class="tmb free">${t.tmFree}</span>`;
    sub=st.state==="maybe"?`${t.tmMaybeSub.replace("%s",esc(TM.kar.join(", ")||"NIK"))} · ${nx}`:nx;
  }
  return `<${tag} class="${attr.cls}"${attr.data||""}>
      <span class="tmn"><b>${esc(r.nev)}</b><i>${esc(r.neptun)}</i></span>
      <span class="tms">${sub}${attr.ido?` · <b>${attr.ido}</b>`:""}</span>
      <span class="tmc mono">${r.fero?r.fero+" fő":""}</span>${badge}</${tag}>`;
}
function tmDetail(r,now,t){
  const iso=isoDay(now), day=tmDay(r,iso), kn=k=>t[TMKIND[k]||"kEgyeb"];
  return `<div class="tmd">
      <div class="tmdh">${t.tmToday} · ${iso}</div>
      ${day.length?day.map(b=>`<div class="tmr"><span class="mono">${hhmm(b.from)}–${hhmm(b.to)}</span>
        <span>${esc(b.subj)} · ${kn(b.kind)}</span></div>`).join("")
       :`<div class="tmr empty2">${!tmWeek(iso)?t.tmNoData:TM.szunnap.includes(iso)?t.tmHoliday:t.tmNothing}</div>`}
      ${r.felsz.length?`<div class="tmf">${r.felsz.map(f=>`<span class="tag">${esc(f)}</span>`).join("")}</div>`:""}
    </div>`;
}
/* A térképen kiválasztott terem foglaltsága, ha tudjuk, melyik Neptun-terem
   (NEPTUN tábla, csak megerősített párok). A hallgató a Neptun-órarendjében
   a hivatalos nevet látja, ezért az is ott áll. Az adatot az első
   kiválasztáskor töltjük be; ha közben megjött, csak ez a rész kerül be az
   adatlapba — az egész panel újrarajzolása elvinné a billentyűzetes
   fókuszt a gombjairól. */
function tmCard(code,t){
  if(!tmDone){ tmLoad().then(()=>{
      const top=document.querySelector("#scroll .rcard .top");
      if(S.sel===code && !S.termek && top && !top.parentNode.querySelector(".rtm"))
        top.insertAdjacentHTML("afterend",tmCard(code,T())); });
    return ""; }
  const nev=neptunOf(code), r=nev&&TM&&TM.rooms.find(x=>x.nev===nev); if(!r) return "";
  const now=new Date();
  return `<div class="rtm">${tmRow(r,now,t,"div",{cls:"tmrow"})}${tmDetail(r,now,t)}</div>`;
}

/* ---------- párosító mód (?parosit) ---------- */
const pairAll=()=>Object.entries({...NEPTUN,...localPairs}).filter(([,v])=>v)
  .sort((a,b)=>a[1].localeCompare(b[1],"hu",{numeric:true}));
const pairText=()=>pairAll().map(([c,n])=>`${n} = ${c}`).join("\n");
// a Neptun-kód emelete (BA.F.05, BA.1.13, BA.4.01) az app szintszámozásában
const nepLevel=x=>({F:0,"1":2,"2":3,"3":4,"4":5})[x.neptun.split(".")[1]];
function pairBar(t){
  if(!tmDone) tmLoad().then(()=>{ if(!S.termek) renderPanel(); });
  return `<div class="sec pairbar"><div class="eyebrow row">${t.pairTitle}
      <span class="mono">${pairAll().length} / ${TM?TM.rooms.length:"…"}</span></div>
    <p class="note">${t.pairHint}</p>
    <textarea id="pText" readonly rows="4" aria-label="${t.pairTitle}">${esc(pairText())}</textarea>
    <div class="btn-row"><button class="btn" id="pCopy">${t.pairCopy}</button>
      <button class="btn" id="pExit">${t.pairExit}</button></div></div>`;
}
/* A kiválasztott teremhez a Neptun-termek listája: elöl az azonos emeletiek,
   férőhellyel — a terem mérete mellett ez segít dönteni —, és ha egy név már
   máshol áll, azt is mutatja. */
function pairPick(r,t){
  if(!TM) return "";
  const cur=neptunOf(r.code), all=Object.entries({...NEPTUN,...localPairs});
  const owner=nev=>(all.find(([c,v])=>v===nev&&c!==r.code)||[])[0];
  const rooms=[...TM.rooms].sort((a,b)=>(nepLevel(a)!==r.level)-(nepLevel(b)!==r.level));
  return `<div class="sec"><div class="eyebrow">${t.pairFor.replace("%s",esc(r.code))} · ${r.area} m²</div>
    <div class="tmlist">${rooms.map(x=>{ const o=owner(x.nev), lv=nepLevel(x);
      return `<button class="tmrow${cur===x.nev?" open":""}" data-pair="${esc(x.nev)}">
        <span class="tmn"><b>${esc(x.nev)}</b><i>${esc(x.neptun)}</i></span>
        <span class="tms">${o?t.pairTaken.replace("%s",esc(o)):lv!=null?esc(lvName(lv)):""}</span>
        <span class="tmc mono">${x.fero?x.fero+" fő":""}</span></button>`; }).join("")}
      <button class="tmrow${cur?"":" open"}" data-pair=""><span class="tmn"><b>${t.pairNone}</b></span></button></div></div>`;
}
function setPair(code,nev){
  // egy Neptun-terem egy tervlapi teremhez tartozik: a korábbi párja elengedi
  if(nev) for(const [c,v] of Object.entries({...NEPTUN,...localPairs})) if(v===nev&&c!==code) localPairs[c]="";
  localPairs[code]=nev;
  try{ localStorage.setItem(PAIR_KEY,JSON.stringify(localPairs)); }catch(_){}
  relabel(); renderPanel();
}
// a feliratok lustán épülnek: új név után újra kell kérni őket, 2D-ben és 3D-ben is
function relabel(){
  for(const lv of LV){ const F=FLOOR[lv]; F.built=false; F.labels.textContent=""; }
  labFor=null; buildLabels(S.level); updateView();
}

/* A foglalható termek sorrendje: elöl, ami most szabad, utána a „Szabad?"
   (közös terem), aztán a foglalt — az előbb szabaduló elöl —, végül, amiről
   nincs adat. A szabadok közül, ha a hallgató megadta, honnan indul (QR,
   „Innen"), a legközelebbi jön elöl; különben az, amelyik tovább szabad. A
   gyalogos idő a portától számol, ha más nincs megadva, mint az útvonal. */
let tmIdoKesz={};
function tmIdok(src){
  if(tmIdoKesz.src===src.code) return tmIdoKesz.ido;
  const k=dijkstra(src,PORTAL,null), ido={};
  if(k) for(const r of TM.rooms){ const c=codeOfNev(r.nev), rt=c&&routeTo(k,src,ROOM[c]);
    if(rt) ido[r.nev]=analyse(rt).min; }
  tmIdoKesz={src:src.code,ido}; return ido;
}
function renderTermek(){
  const t=T(), box=$("scroll");
  if(!TM){ box.innerHTML=`<div class="empty" style="padding:18px 16px">${tmDone?t.tmNoData:"…"}</div>`; return; }
  const now=new Date(), src=ROOM[S.from]||ROOM[START], ido=src?tmIdok(src):{};
  const CSOP={free:0,maybe:1,busy:2}, VEGE=24*60;
  const sorrend=TM.rooms.map((r,i)=>{ const st=tmNow(r,now), g=CSOP[st.state]??3;
    const kulcs=g===2?st.until : g<2?(S.from?(ido[r.nev]??99):-(st.next?st.next.from:VEGE)) : 0;
    return {r,i,g,kulcs}; }).sort((a,b)=>a.g-b.g||a.kulcs-b.kulcs||a.i-b.i);

  const rows=sorrend.map(({r})=>{
    const open=S.tmOpen===r.nev, code=open&&codeOfNev(r.nev);
    return tmRow(r,now,t,"button",{cls:"tmrow"+(open?" open":""),data:` data-tm="${esc(r.nev)}"`,
        ido:ido[r.nev]!=null?t.tmWalk.replace("%s",ido[r.nev]):""})
      +(open?tmDetail(r,now,t)+(code?`<button class="btn tmgo" data-goto="${esc(code)}">${t.tmGoto}</button>`:""):"");
  }).join("");

  const shared=TM.rooms.some(r=>r.kozos)?`<br>${t.tmShared}`:"";
  box.innerHTML=`<div class="sec"><div class="eyebrow">${t.tmTitle}</div>
    <div class="tmlist">${rows}</div>
    <p class="note">${t.tmNote}${shared}<br><span class="mono">${
      t.tmRange.replace("%s",esc(TM.felev)).replace("%s",TM.het1).replace("%s",tmLast())}</span></p></div>`;
  box.querySelectorAll("[data-tm]").forEach(b=>b.onclick=()=>{
    S.tmOpen=S.tmOpen===b.dataset.tm?null:b.dataset.tm; renderTermek(); });
  box.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>select(b.dataset.goto));
}
// a Neptun-teremhez tartozó tervlapi terem, ha rajta van a térképen
const codeOfNev=nev=>Object.keys({...NEPTUN,...(PAIRING?localPairs:{})}).find(c=>ROOM[c]&&neptunOf(c)===nev)||null;

/* ------------------------------------------------------------------ UI */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"");
function search(q){
  q=norm(q.trim()); if(!q)return[];
  /* Az ajtószámot sokan pont nélkül írják be („110"), a Neptun teljes
     alakjában pedig épületjel is van előtte (BA.1.10, BA.F.01). */
  const nodot=x=>x.replace(/^ba[.\s]/,"").replace(/[.\s/]/g,""), qd=nodot(q);
  return D.rooms.filter(r=>r.code).map(r=>{
    const c=norm(r.code),n=norm(r.name||""),k=norm(r.cat),np=norm(neptunOf(r.code)||"");let s=-1;
    // aki „F01"-et keres, az órarendje szerintit keresi: a Neptun-név előbb jön
    if(np&&(np===q||nodot(np)===qd))s=0; else if(c===q||c.slice(4)===q)s=.5;
    else if(np&&np.startsWith(q))s=1; else if(c.startsWith(q)||c.slice(4).startsWith(q))s=1.5;
    else if(n.startsWith(q))s=2; else if(n.includes(q))s=3;
    else if(k.includes(q))s=4; else if(c.includes(q))s=5;
    return s<0?null:{r,s};
  }).filter(Boolean).sort((a,b)=>a.s-b.s||a.r.code.localeCompare(b.r.code)).slice(0,50).map(x=>x.r);
}
function renderPanel(){
  S.termek=false;
  const t=T(),box=$("scroll"),q=$("q").value.trim();
  if(q){
    const list=search(q);
    box.innerHTML=list.length?list.map(r=>`
      <button class="res-item" data-code="${esc(r.code)}" aria-current="${S.sel===r.code}">
        <span class="dotc" style="background:${cc(r.cat)};color:${cc(r.cat)}"></span>
        <span class="res-main"><span class="res-code mono">${neptunOf(r.code)?esc(neptunOf(r.code))+" · ":""}${esc(r.code)}</span>
        <span class="res-name">${esc(r.name||r.cat)}</span></span>
        <span class="res-meta">${esc(lvOf(r.level).short)}</span></button>`).join("")
      :`<div class="empty">${t.nores}</div>`;
    box.querySelectorAll(".res-item").forEach(b=>b.onclick=()=>select(b.dataset.code));

  }
  let h="";
  /* Ugyanaz a gomb a teremnél és az útvonalnál is: egy kiválasztott terem
     önmagában is megosztható link („ez a terem"), nem csak a kész útvonal. */
  const shrBtn=`<button class="shr" title="${t.share}" aria-label="${t.share}"><svg width="15" height="15"
      viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">

  // párosításkor a koppintás után a választó legyen elöl (telefonon a panel
  // csak félig nyílik), az összesítő utána
  if(PAIRING && !S.sel) h+=pairBar(t);
  if(S.sel){
    const r=ROOM[S.sel], nep=neptunOf(r.code);
    // párosított teremnél a Neptun-név a cím: a hallgató az órarendjében ezt látja
    h+=`<div class="sec"><div class="eyebrow row">${t.room}${S.from||S.to?"":shrBtn}</div>
      <div class="rcard"><div class="top" style="--cat:${cc(r.cat)}">
        <div class="code mono">${esc(r.code)}${nep?" · "+esc(r.name||r.cat):""}</div>
