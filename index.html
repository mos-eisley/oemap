      ${tmCard(r.code,t)}
      <div class="btn-row"><button class="btn" id="bF">${t.setFrom}</button>
        <button class="btn primary" id="bT">${t.setTo}</button></div></div></div>`;
    if(PAIRING) h+=pairPick(r,t)+pairBar(t);
  }
  /* Cél nélkül a gyorsgombok is kellenek, akkor is, ha csak az indulás adott
     (falra ragasztott QR, totem: #from=…) — onnan számolnak. A mosdóválasztó
     felül, hogy telefonon a félig nyitott panelen is látsszon. */
  const gyors=!S.to&&(!S.sel||S.sel===S.from);
  if(S.wc&&gyors){
    const sub=S.from?t.qsub.replace("%s",ROOM[S.from].name||ROOM[S.from].code):t.qsub0;
    h+=`<div class="sec"><div class="eyebrow">${t.qwc} · ${esc(sub)}</div>
      <div class="tmlist">${S.wc.lista.map(x=>`<button class="tmrow" data-wc="${x.r.code}">
        <span class="tmn"><b>${t[x.lbl]}</b><i>${esc(x.r.code)}</i></span>
        <span class="tms">${esc(lvName(x.r.level))} · ${x.mm.dist} ${t.m}</span>
        <span class="tmc mono">${x.mm.min} ${t.min}</span></button>`).join("")||`<p class="note">${t.none}</p>`}</div></div>`;
  }
  if(S.from||S.to){
    h+=`<div class="sec"><div class="eyebrow row">${t.route}${shrBtn}</div><div class="ends">
      ${epRow("from")}${epRow("to")}</div>`;
    if(S.from&&S.to&&!S.route) h+=`<p class="note">${t.none}</p>`;
    else if(S.route){
      const mm=S.mm,st=steps(S.route,mm);
      if(S.hasLift){
        const opt=(key,ico,label)=>{
          const m=S.mms[key]; if(!m) return "";
          return `<button class="via${S.via===key?" on":""}" data-via="${key}">
            <span class="vico">${ico}</span>
            <span class="vtx"><b>${label}</b>
              <small class="mono">${m.dist} ${t.m} · ${m.min} ${t.min}</small></span></button>`;
        };
        h+=`<div class="eyebrow sub">${t.viaLabel}</div>
            <div class="viasw">${opt("stairs","⌁",t.optStairs)}${opt("lift","⇅",t.optLift)}</div>`;
      }
      h+=`<div class="sum">
        <div><b class="mono">${mm.dist}</b><i>${t.m}</i><small>${t.dist}</small></div>
        <div><b class="mono">${mm.min}</b><i>${t.min}</i><small>${t.time}</small></div>
        <div><b class="mono">${mm.vert}</b><small>${t.vert}</small></div></div>
        ${QR_KELL()?`<button class="qrsend" id="qrSend"><svg width="16" height="16" viewBox="0 0 16 16"
          fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="1.2" width="8"
          height="13.6" rx="1.6"/><path d="M7 12.2h2"/></svg>${t.qrSend}</button>`:""}
        <ol class="steps">${st.map((x,i)=>`<li><button class="step ${x.v?"v":""}" data-s="${i}">
          <span class="ico">${x.ico}</span><span class="b"><span class="t">${esc(x.t)}</span>
          ${x.d?`<span class="d">${esc(x.d)}</span>`:""}</span></button></li>`).join("")}</ol>
        ${mm.vert?`<p class="note">${S.hasLift?t.lift:t.noLiftHere}</p>`:""}`;
      window.__steps=st;
    } else h+=`<p class="note" style="border:0;padding-top:8px">${t.hint2}</p>`;
    h+=`</div>`;
  }
  if(gyors){
    const sub=S.from?t.qsub.replace("%s",ROOM[S.from].name||ROOM[S.from].code):t.qsub0;
    if(!S.from&&!S.wc) h+=`<div class="empty" style="padding:18px 16px 4px">${t.hint}</div>`;
    h+=`<div class="qgrid">
        <button class="qbtn" data-q="WC"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5"><circle cx="6.5" cy="4" r="1.7"/><path d="M4.4 17V11H3.4l1.4-4.2h3.4L9.6 11H8.6v6z"/>
          <circle cx="14" cy="4" r="1.7"/><path d="M11.3 17l1.1-5.4h-1.1l1.4-4.8h2.6l1.4 4.8h-1.1L16.7 17z"/></svg>
          <span>${t.qwc}<small>${sub}</small></span></button>
        <button class="qbtn" data-q="BÜFÉ"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5"><path d="M3.5 8h9v4a4.5 4.5 0 0 1-9 0z"/>
          <path d="M12.5 9h1.8a2 2 0 0 1 0 4h-.6"/><path d="M2.5 17.2h11"/><path d="M6 3.2v2M9.5 2.6v2.6"/></svg>
          <span>${t.qbufe}<small>${sub}</small></span></button>
        <button class="qbtn" data-q="@ROOMS"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5"><rect x="2.6" y="3.4" width="14.8" height="13.2" rx="1.6"/>
          <path d="M2.6 8h14.8M7.6 8v8.6"/><circle cx="12.6" cy="12.2" r="1.5"/></svg>
          <span>${t.qrooms}<small>${t.qroomsSub}</small></span></button>
        <button class="qbtn" data-q="@ENTRY"><svg width="19" height="19" viewBox="0 0 20 20" fill="none"
          stroke="currentColor" stroke-width="1.5"><path d="M11.5 2.8h4.2v14.4h-4.2"/>
          <path d="M8.6 10H2.9M5.6 6.9 2.5 10l3.1 3.1"/></svg>
          <span>${t.qentry}<small>${START}</small></span></button>
      </div>
      <details class="legfold"><summary>${t.legend2}</summary>
        <div class="grid">${Object.keys(CATS).map(n=>
          `<div><i style="background:${cc(n)}"></i>${esc(n.toLowerCase())}</div>`).join("")}</div></details>`;
  }
  box.innerHTML=h;
  box.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>quick(b.dataset.q));
  box.querySelectorAll("[data-wc]").forEach(b=>b.onclick=()=>{
    S.from=S.wc.src; S.to=S.sel=b.dataset.wc; recompute(); refreshSel(); });
  const bF=$("bF"),bT=$("bT");
  if(bF)bF.onclick=()=>{S.from=S.sel;recompute();};
  if(bT)bT.onclick=()=>{S.to=S.sel;recompute();};
  box.querySelectorAll("[data-via]").forEach(b=>b.onclick=()=>setVia(b.dataset.via));
  box.querySelectorAll(".shr").forEach(b=>b.onclick=shareCurrent);
  const qs=$("qrSend"); if(qs) qs.onclick=qrNyit;
  box.querySelectorAll("[data-ep]").forEach(b=>b.onclick=e=>{
    if(e.target.dataset.clear){S[e.target.dataset.clear]=null;recompute();return;}
    const c=S[b.dataset.ep];if(c)select(c);});
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const x=window.__steps[+b.dataset.s];
    setLevel(x.lv);});
  box.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>setPair(S.sel,b.dataset.pair));
  const pc=$("pCopy"), px=$("pExit");
  if(pc) pc.onclick=async()=>{ const ta=$("pText");
    try{ await navigator.clipboard.writeText(ta.value); pc.textContent=t.pairCopied; }
    catch(_){ ta.focus(); ta.select(); } };
  if(px) px.onclick=()=>{ location.href=location.pathname+location.hash; };
}
/* Mi számít találatnak a gyorsgomboknál. A névben keresés magában kevés: a
   „BÜFÉ" a büfé raktárára (OA00F05) is illik, és onnan közelebb esett, mint a
   büfé. */
const QUICK_OK=(key,r)=>{
  const n=(r.name||"").toUpperCase();
  if(key==="BÜFÉ") return n==="BÜFÉ";
  return n.includes(key);
};
/* A mosdó gomb nem egy „legközelebbit" ad, hanem fajtánként egyet: női, férfi,
   akadálymentes, szinttel és perccel — nem kérdez rá a nemre, és nem jegyez
   meg semmit (a totemen a következő emberé a gép). Csak a folyosóról nyíló
   mosdó számít: a porta mögötti dolgozói öltözők WC-je (OAX1A09, OAX1A12) és
   egy raktárból nyíló mosdó (OA20E26) csak más helyiségen át érhető el
   (`via`). A III–IV. emeleten nincs női mosdó — ott a sor a II. emeletit
   adja, az akadálymentes pedig mellette áll. */
const DOLGOZOI_WC=new Set(["OAX1A09","OAX1A12"]);
const WC_FAJTA=[["wcw","wcWomen"],["wcm","wcMen"],["acc","wcAcc"]];
function mosdok(src){
  const k=dijkstra(src,PORTAL,null); if(!k) return [];
  const best={};
  for(const r of D.rooms){
    // az iconsOf() a lépcsőházakat is jelöli, azokat nem kell végigszámolni
    const ic=r.code&&!r.via&&!DOLGOZOI_WC.has(r.code)&&r.cat==="VIZES HELYISÉGEK"&&iconsOf(r); if(!ic) continue;
    const rt=routeTo(k,src,r); if(!rt) continue;
    // menetidő a lépcsővel együtt, ahogy az útvonal is számolja; a nemre nem jelölt mosdó bárkié
    const mm=analyse(rt);
    for(const f of ic.flatMap(x=>x==="wc"?["wcw","wcm"]:[x])) if(!best[f]||mm.sec<best[f].mm.sec) best[f]={r,mm};
  }
  return WC_FAJTA.filter(([f])=>best[f]).map(([f,lbl])=>({f,lbl,...best[f]}));
}
function quick(key){
  if(key==="@ROOMS"){ S.view0=S.tmOpen=null; S.termek=true;
    renderTermek(); tmLoad().then(()=>{ if(S.termek) renderTermek(); });
    if(MOB()) setSnap("full");
    return; }
  if(key==="@ENTRY"){ const e=ROOM[START]; if(e){S.from=e.code;select(e.code);renderPanel();} return; }
  const src = S.from ? ROOM[S.from]
    : (ROOM[START] || D.rooms.filter(r=>r.circ&&r.level===S.level).sort((a,b)=>b.area-a.area)[0]);
  if(!src) return;
  if(key==="WC"){ S.wc={src:src.code,lista:mosdok(src)}; renderPanel(); if(MOB()) setSnap("mid"); return; }
  let best=null;
  for(const r of D.rooms){
    if(!r.code||!QUICK_OK(key,r)) continue;
    const rt=findRoute(src,r); if(!rt) continue;
    // menetidő, a lépcsővel együtt: a vízszintes táv magában a portáról három
    // emelettel feljebb lévő mosdót adta „legközelebbinek"
    const m=analyse(rt), sec=m.sec;
    if(!best||sec<best.sec) best={r,m,sec};
  }
  if(!best) return;
  S.from=src.code; S.to=best.r.code; S.sel=best.r.code;
  recompute(); refreshSel();
}

function epRow(kind){
  const t=T(),c=S[kind],r=c?ROOM[c]:null;
  return `<button class="ep ${kind==="to"?"to":""}" data-ep="${kind}"><span class="pin"></span>
    <span class="txt"><small>${kind==="from"?t.start:t.dest}</small>
    <span>${r?esc((r.name||r.cat)+" · "+r.code):"—"}</span></span>
    ${r&&!(kind==="from"&&c===START&&S.to)?`<span class="x" data-clear="${kind}">×</span>`:""}</button>`;
}
function renderRail(){
  const rail=$("rail");
  rail.innerHTML=D.levels.slice().reverse().map(l=>{
    const on=S.mm&&S.mm.segs.some(s=>s.lv===l.level);
    return `<button class="lv" data-l="${l.level}" aria-pressed="${S.level===l.level}"
      title="${esc(lvName(l.level))}">${esc(l.short)}${on?'<span class="pip"></span>':""}</button>`;}).join("");
  rail.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLevel(+b.dataset.l));
  applyMapLabel();
  $("fname").innerHTML=`<b class="cond">${esc(lvName(S.level))}</b>
    <span>${esc(D.meta.building)} · ${D.rooms.filter(r=>r.level===S.level).length} ${T().nRooms}</span>`;
}
function renderLegend(){
  const t=T();
  $("legT").textContent=t.legend;
  $("legPop").innerHTML=`<div class="grid">${Object.keys(CATS).map(n=>
    `<div><i style="background:${cc(n)}"></i>${esc(n.toLowerCase())}</div>`).join("")}</div>
    <div class="src">${esc(D.meta.source)}</div>`;
}
/* A poligon a szintjén belüli sorrendben épült, ugyanabból a listából. */
function roomNode(r){
  const F=FLOOR[r.level]; if(!F) return null;
  return F.rooms.children[D.rooms.filter(x=>x.level===r.level).indexOf(r)]||null;
}
function refreshSel(){
  for(const lv of LV){
    FLOOR[lv].rooms.querySelectorAll(".room").forEach(p=>{
      p.classList.remove("sel"); p.removeAttribute("aria-pressed");
    });
  }
  if(!S.sel)return;
  const node=roomNode(ROOM[S.sel]);
  // aria-pressed: a gombszerepű poligonnál ez mondja meg a felolvasónak, hogy
  // ez a terem épp ki van választva — a kontúr csak a szemnek szól.
  if(node){node.classList.add("sel"); node.setAttribute("aria-pressed","true");}
}
function select(code){
  const r=ROOM[code];if(!r)return;
  // A billentyűzetes kurzor minden kiválasztást követ — egérrel, keresőből vagy
  // linkről is —, így a nyilas bejárás onnan folytatódik, ahol a szem tart.
  S.sel=cursor=code; S.wc=null; $("q").value="";
  if(r.level!==S.level){S.level=r.level;renderRail();updateView();}
  refreshSel(); renderPanel(); setSnap("mid");
  document.querySelectorAll(".res-item").forEach(b=>
    b.setAttribute("aria-current",b.dataset.code===code));
  say(T().aSel.replace("%s",code+" · "+(r.name||r.cat)).replace("%s",lvName(r.level)));
  pushUrl();
}
function applyVia(){
  S.route=S.routes[S.via]||S.routes.stairs;
  S.mm  =S.mms[S.via]   ||S.mms.stairs;
}
function setVia(v){
  if(v===S.via||!S.routes[v])return;
  S.via=v; applyVia();
  drawRoute(); renderRail(); renderPanel();
  if(S.mm&&!S.mm.segs.some(x=>x.lv===S.level)){S.level=S.mm.segs[0].lv;renderRail();}
  updateView();
  pushUrl(true);       // finomítás, nem új lépés: a vissza gomb ne a lépcsős változatra vigyen
}
function recompute(){
  if(S.to) S.wc=null;
  // cél van, indulás nincs: a portáról
  if(S.to && !S.from && ROOM[START] && S.to!==START) S.from=START;
  const pair=S.from&&S.to&&S.from!==S.to;
  const a=pair?ROOM[S.from]:null, b=pair?ROOM[S.to]:null;
  S.routes={stairs:pair?findRoute(a,b,PORTAL):null, lift:pair?findRoute(a,b,PORTAL_LIFT):null};
  S.mms   ={stairs:S.routes.stairs?analyse(S.routes.stairs):null,
            lift:  S.routes.lift  ?analyse(S.routes.lift  ):null};
  // A liftet csak akkor kínáljuk fel, ha tényleg szintet vált vele.
  S.hasLift=!!(S.routes.lift&&S.mms.lift&&S.mms.lift.vert>0);
  S.via="stairs";                       // a lépcső az alapértelmezés
  applyVia();
  $("q").value="";
  drawRoute(); renderRail(); renderPanel();
  if(S.mm&&!S.mm.segs.some(s=>s.lv===S.level)){S.level=S.mm.segs[0].lv;renderRail();}
  updateView();
  if(S.route){ setSnap("mid"); if(!S.dirty) fit(); }
  // Az útvonal a térképen rajzolódik ki, a számai a panelben — a felolvasónak
  // egyik sem szól magától, ezért az eredményt bemondjuk.
  if(pair){
    const t=T();
    say(S.mm ? t.aRoute.replace("%s",S.mm.dist).replace("%s",S.mm.min).replace("%s",S.mm.vert)
             : t.aNoRoute);
  }
  pushUrl();
}
function applyLang(){
  const t=T();
  $("sub").textContent=t.sub; $("q").placeholder=t.ph;
  $("m2t").textContent=t.plan; $("m3t").textContent=t.bld;
  $("stOff").textContent=t.stStudent; $("stOn").textContent=t.stAll;
  $("staffSeg").setAttribute("aria-label",t.stTitle);

  $("foot").textContent=t.foot;
  $("langHu").setAttribute("aria-pressed",S.lang==="hu");
  $("langEn").setAttribute("aria-pressed",S.lang==="en");

}
function applyTheme(first){
  if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",S.theme);
  ["Light","Auto","Dark"].forEach(k=>$("th"+k).setAttribute("aria-pressed",S.theme===k.toLowerCase()));
  if(!first){
    for(const k in _c)delete _c[k];
    buildFloors(); placeTags(); refreshSel(); drawRoute(); updateView(); renderLegend(); renderPanel();
  }
}

/* ------------------------------------------- billentyűzet és képernyőolvasó */

/* Ugyanazt a szöveget kétszer egymás után a felolvasó nem mondja ki: a csomópont
   tartalma nem változott, nincs mit bejelenteni. Előbb kiürítjük, és a
   következő képkockában írjuk vissza — így az ismételt szintváltás is hallható. */
let liveT;
function say(msg){
  if(!msg) return;
  const n=$("live"); if(!n) return;
  clearTimeout(liveT); n.textContent="";
  liveT=setTimeout(()=>{n.textContent=msg;},60);
}
function sayLevel(){

/* A nyilas léptetés azokat a helyiségeket járja be, amelyek látszanak is:
   hallgatói nézetben a hallgatóit, „Minden"-ben az összeset. A halványított
   termek így nem esnek ki semmiből — kereséssel, megosztott linkkel és a
   fejléc kapcsolójával ugyanúgy elérhetők —, csak nem kell 52 irodán
   átlépkedni a mosdóig. Ez ugyanaz a szabály, ami a feliratokra vonatkozik. */
const navRooms=lv=>D.rooms.filter(r=>r.level===lv&&r.code&&(S.staff||!STAFF.has(r.cat)));
/* olvasási sorrend a Home/End-hez: fentről le, balról jobbra */
const readOrder=(a,b)=>a.cy-b.cy||a.cx-b.cx;

let cursor=null;                       // a billentyűzetes kurzor terem-kódja

function focusRoom(code){
  const r=ROOM[code]; if(!r) return false;
  if(r.level!==S.level) setLevel(r.level);
  const n=roomNode(r); if(!n) return false;
  cursor=code; n.focus();
  return true;
}

/* Belépés a térképre: a kiválasztott terem, ha ezen a szinten van, különben az
   előző kurzor, különben a szint legnagyobb közlekedője — az nagyjából középen
   van, onnan minden irányba el lehet indulni. */
function enterMap(){
  const list=navRooms(S.level); if(!list.length) return false;
  const at=c=>c&&ROOM[c]&&ROOM[c].level===S.level&&list.includes(ROOM[c])?ROOM[c]:null;
  const r=at(S.sel)||at(cursor)
        ||list.filter(x=>x.circ).sort((a,b)=>b.area-a.area)[0]||list.slice().sort(readOrder)[0];
  return focusRoom(r.code);
}

/* A nyíl a megadott irányban legközelebbi helyiségbe lép. Olvasási sorrend
   helyett geometria: a térképen az „alattam lévő terem" az, amit a szem is
   annak lát. Az irányra merőleges eltérés büntet, de nem zár ki — különben egy
   kicsit odébb nyíló folyosónál a nyíl egyszerűen nem csinálna semmit. */
function stepRoom(dx,dy){
  const cur=ROOM[cursor]; if(!cur) return null;
  let best=null,bd=1e9;
  for(const r of navRooms(S.level)){
    if(r===cur) continue;
    const vx=r.cx-cur.cx, vy=r.cy-cur.cy;
    const ahead=vx*dx+vy*dy;                 // irány menti távolság
    if(ahead<=.3) continue;                  // nem arra van
    const side=Math.abs(vx*dy-vy*dx);        // oldalirányú kilógás
    const d=ahead+side*2.2;
    if(d<bd){bd=d;best=r;}
  }
  return best;
}

const ARROW={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
stage.addEventListener("keydown",e=>{
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const t=T();

  if(ARROW[e.key]){
    e.preventDefault();
    // Az első nyílnyomás még csak belép a térképre, nem lép odébb.
    if(!cursor||!ROOM[cursor]||ROOM[cursor].level!==S.level){ enterMap(); return; }
    const n=stepRoom(...ARROW[e.key]);
    if(n) focusRoom(n.code); else say(t.aEdge);
    return;
  }
  if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    if(cursor&&ROOM[cursor]) select(cursor); else enterMap();
    return;
  }
  if(e.key==="Home"||e.key==="End"){
    const ord=navRooms(S.level).slice().sort(readOrder);
    if(!ord.length) return;
    e.preventDefault();
    focusRoom((e.key==="Home"?ord[0]:ord[ord.length-1]).code);
    return;
  }
  if(e.key==="PageUp"||e.key==="PageDown"){
    e.preventDefault();
    const i=LVI[S.level]+(e.key==="PageUp"?1:-1);
    if(i<0||i>=LV.length){ say(t.aEdge); return; }
    setLevel(LV[i]);
    // A kurzor a szinttel együtt lép; enélkül a következő nyíl az eltűnt
    // szinten keresne, és a fókusz egy aria-hidden ágon ragadna.
    if(stage.contains(document.activeElement)) enterMap();
    return;
  }
  /* Az Esc két lépés: előbb kijön a teremből a térkép szintjére, és csak a
     másodikra törli a kiválasztást (azt a globális kezelő végzi, ezért itt
     megállítjuk a buborékolást). Egy nyomásra mindkettő meglepő lenne: a
     billentyűzetes felhasználó a fókuszt akarja visszavenni, nem az útvonalát
     eldobni. */
  if(e.key==="Escape"&&document.activeElement!==stage){
    e.stopPropagation(); stage.focus();
  }
});

/* A szintváltás egy helyen: a sáv gombja, a Page Up/Down és a födémre kattintás
   is ide fut be, így a bemondás egyszer van megírva. */

  if(lv===S.level||LVI[lv]===undefined) return;
  S.level=lv; renderRail(); updateView(); sayLevel();
}

const side=$("side"), grab=$("grab");
let snap="peek";
function snaps(){
  const h=side.offsetHeight, vh=innerHeight;
  return {full:0, mid:Math.max(0,Math.round(h-vh*.46)), peek:Math.max(0,h-128)};
}
function setSnap(n){
  if(!MOB())return;
  const prev=snap; snap=n;
  const sp=snaps();
  side.style.setProperty("--sheet",sp[n]+"px");
  side.style.setProperty("--sheetpad",sp[n]+"px");
  document.documentElement.style.setProperty("--railb",
    (n==="peek"?142:Math.round(innerHeight*.46)+16)+"px");
  if(prev===n) return;
  if(!S.dirty) fit();
  else { S.view.y -= (insetFor(n)-insetFor(prev))/2; updateView(); }
}
(function(){
  /* A lap húzása. Eddig csak a ~18px magas fogantyú fogadta el a mozdulatot, és
     az elengedés a legközelebbi álláshoz ugrott a sebességtől függetlenül —
     ettől érződött nehézkesnek. Most a teljes fejléc fog, a lista tetejéről
     lefelé húzva is indul, és a lendület számít. */
  const ORDER=["full","mid","peek"];        // fentről lefelé
  const TAKE=6;                             // ennyi px után vesszük át a mozdulatot
  const FLING=0.45;                         // px/ms — efölött lendületnek számít
  let sd=null, samples=[], justDragged=false;
  const cur=()=>parseFloat(getComputedStyle(side).getPropertyValue("--sheet"))||0;

  const begin=(y,fromScroll)=>{
    if(!MOB()) return;
    sd={y0:y,s:cur(),fromScroll,active:false};
    samples=[{t:performance.now(),y}];
  };
  const move=y=>{
    if(!sd) return;
    const dy=y-sd.y0;
    if(!sd.active){
      if(Math.abs(dy)<TAKE) return;              // koppintás még átmehet
      if(sd.fromScroll&&dy<0){ sd=null; return; } // felfelé a lista görgessen
      sd.active=true; side.classList.add("drag");
    }
    const sp=snaps();
    side.style.setProperty("--sheet",
      Math.max(-24,Math.min(sp.peek+80,sd.s+dy))+"px");
    samples.push({t:performance.now(),y});
    if(samples.length>6) samples.shift();
  };
  const finish=()=>{
    if(!sd) return;
    const was=sd.active; sd=null;
    if(!was) return;
    justDragged=true; setTimeout(()=>{justDragged=false;},0);
    side.classList.remove("drag");
    const v=cur(), sp=snaps();
    const a=samples[0], b=samples[samples.length-1];
    const vy=(a&&b&&b.t>a.t) ? (b.y-a.y)/(b.t-a.t) : 0;   // + = lefelé
    let near=0, nd=1e9;
    ORDER.forEach((k,i)=>{const d=Math.abs(sp[k]-v); if(d<nd){nd=d;near=i;}});
    const idx = Math.abs(vy)>FLING
      ? Math.max(0,Math.min(ORDER.length-1, near+(vy>0?1:-1)))  // lendület iránya
      : near;
    setSnap(ORDER[idx]);
  };

  grab.addEventListener("pointerdown",e=>begin(e.clientY,false));
  side.querySelector(".search").addEventListener("pointerdown",e=>begin(e.clientY,false));
  $("scroll").addEventListener("pointerdown",e=>{
    // A lista tetejéről lefelé húzva a lapot mozgatjuk. Mivel a lista már nem
    // tud feljebb görögni, nem kell elvenni a böngészőtől a gesztust.
    if($("scroll").scrollTop<=0) begin(e.clientY,true);
  });
  addEventListener("pointermove",e=>move(e.clientY),{passive:true});
  addEventListener("pointerup",finish); addEventListener("pointercancel",finish);
  grab.addEventListener("click",()=>{ if(justDragged)return;
    setSnap(snap==="peek"?"mid":snap==="mid"?"full":"peek"); });
})();
$("q").addEventListener("focus",()=>setSnap("full"));

  $("menuBtn").setAttribute("aria-expanded",o.classList.contains("open"));};
document.addEventListener("click",e=>{
  const o=$("optbar");
  if(o.classList.contains("open")&&!o.contains(e.target)&&e.target!==$("menuBtn")){
    o.classList.remove("open");$("menuBtn").setAttribute("aria-expanded","false");}});

/* -------------------------------------------------------- telefonra küldés */
/* Asztalon és a totemen a kész útvonal QR-kódja: a telefon kamerájával
   beolvasva ugyanez az útvonal nyílik meg rajta, a lift választásával együtt,
   és a hallgató viszi magával. Telefonon nem kell, ott a megosztás gomb tudja
   ugyanezt. A link a mély link (urlOf), a cím ?totem és ?parosit része
   nélkül: a telefon ne váljon totemmé. */
/* QR-kód (ISO/IEC 18004): bájt mód (UTF-8), M szint, 1–10. verzió. Saját kód, mert
   az app függőség nélkül, offline fut; dekódolással ellenőrizve, nem szemre. */

/* M szint (~15% javítható): képernyőn a csillanás ennyit ront, és egy ~120 karakteres
   link még 45×45-ös kódba fér. [javító bájt/blokk, rövid blokk, adatbájt/rövid blokk,
   egy bájttal hosszabb blokk] */
const QR_BLK=[,[10,1,16,0],[16,1,28,0],[26,1,44,0],[18,2,32,0],[24,2,43,0],
  [16,4,27,0],[18,4,31,0],[22,2,38,2],[22,3,36,2],[26,4,43,1]];

/* Hogy az adatból ne álljon össze keresőnek látszó minta vagy nagy egyszínű folt. */
const QR_MASK=[(r,c)=>(r+c)%2==0,(r,c)=>r%2==0,(r,c)=>c%3==0,(r,c)=>(r+c)%3==0,
  (r,c)=>((r>>1)+(c/3|0))%2==0,(r,c)=>r*c%2+r*c%3==0,
  (r,c)=>(r*c%2+r*c%3)%2==0,(r,c)=>((r+c)%2+r*c%3)%2==0];

/* GF(256), a QR polinomjával (0x11D) */
function qrMul(a,b){
  let r=0;
  for(let i=7;i>=0;i--) r=(r<<1^(r>>7)*0x11d)^(b>>i&1)*a;
  return r;
}

/* Reed–Solomon: a hibajavítás az osztási maradék (generátor gyökei: α^0…α^(n−1)) */
function qrEcc(data,n){
  const g=Array(n).fill(0),r=Array(n).fill(0);
  g[n-1]=1;
  for(let i=0,a=1;i<n;i++,a=qrMul(a,2))
    for(let j=0;j<n;j++) g[j]=qrMul(g[j],a)^(g[j+1]||0);
  for(const b of data){
    const f=b^r.shift(); r.push(0);
    for(let j=0;j<n;j++) r[j]^=qrMul(g[j],f);
  }
  return r;
}

/* BCH: a formátum- és a verziómező védelme */
function qrBch(d,gen,deg){
  let r=d;
  for(let i=0;i<deg;i++) r=r<<1^(r>>deg-1)*gen;
  return d<<deg|r;
}

/* A szabvány négy büntetőszabálya (egyszínű sorozat, kereső-szerű 1:1:3:1:1,
   2×2-es blokk, sötét arány); a legkevesebb pontú maszk a legkönnyebben olvasható. */
function qrPenalty(m){
  const n=m.length;
  let p=0,dark=0;
  for(const l of [...m,...m.map((_,c)=>m.map(row=>row[c]))]){
    for(let i=1,run=1;i<=n;i++)
      if(l[i]===l[i-1]) run++;
      else{ if(run>=5) p+=run-2; run=1; }
    p+=40*(l.join("").match(/(?=10111010000|00001011101)/g)||[]).length;
  }
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const x=m[r][c]; dark+=x;
    if(r&&c&&x==m[r-1][c]&&x==m[r][c-1]&&x==m[r-1][c-1]) p+=3;
  }
  return p+10*Math.floor(Math.abs(20*dark-10*n*n)/(n*n));
}

/* Sorok tömbje, 1 = sötét, csendzóna nélkül. A forceMask (0–7) csak a teszteknek kell. */
function qrMatrix(text,forceMask){
  if(forceMask!=null&&!QR_MASK[forceMask]) throw new Error("QR: a maszk 0–7 lehet");
  const data=new TextEncoder().encode(text);
  let v=0,b,nd;   /* a legkisebb verzió, amibe belefér; a hosszmező 10-estől 16 bites */
  do{
    if(++v>10) throw new Error(`QR: túl hosszú (${data.length} bájt, legfeljebb 213)`);
    b=QR_BLK[v]; nd=b[1]*b[2]+b[3]*(b[2]+1);
  }while(data.length*8+(v<10?12:20)>nd*8);

  const bits=[],put=(x,k)=>{ while(k--) bits.push(x>>k&1); };
  put(4,4); put(data.length,v<10?8:16); for(const x of data) put(x,8);
  put(0,Math.min(4,nd*8-bits.length)); put(0,-bits.length&7);
  for(let pad=0xec;bits.length<nd*8;pad^=0xfd) put(pad,8);   /* 0xEC, 0x11, … */
  const cw=[];
  for(let i=0;i<nd;i++) cw.push(bits.slice(i*8,i*8+8).reduce((a,x)=>a*2+x));

  /* Blokkonként külön javítás, felváltva fűzve: egy folt több blokk közt oszlik meg. */
  const blocks=[],seq=[];
  for(let i=0,k=0;i<b[1]+b[3];i++) blocks.push(cw.slice(k,k+=b[2]+(i>=b[1])));
  const ecc=blocks.map(x=>qrEcc(x,b[0]));
  for(let i=0;i<=b[2];i++) for(const x of blocks) if(i<x.length) seq.push(x[i]);
  for(let i=0;i<b[0];i++) for(const x of ecc) seq.push(x[i]);

  const n=17+4*v,m=[...Array(n)].map(()=>Array(n).fill(0)),fn=m.map(r=>[...r]);
  const set=(r,c,d)=>{ m[r][c]=d?1:0; fn[r][c]=1; };
  const square=(R,C,k,dark)=>{
    for(let r=R-k;r<=R+k;r++) for(let c=C-k;c<=C+k;c++)
      if(r>=0&&r<n&&c>=0&&c<n) set(r,c,dark(Math.max(Math.abs(r-R),Math.abs(c-C))));
  };
  for(let i=0;i<n;i++){ set(6,i,i%2==0); set(i,6,i%2==0); }   /* időzítő sávok */
  for(const [R,C] of [[3,3],[3,n-4],[n-4,3]]) square(R,C,4,d=>d!=2&&d!=4);
  const al=v<2?[]:v<7?[6,n-7]:[6,(n-1)/2,n-7];
  for(const R of al) for(const C of al)
    if(!(R==6&&(C==6||C==n-7)||C==6&&R==n-7)) square(R,C,2,d=>d!=1);
  /* Formátum- és verziómező: pontozáskor világos, csak a maszk után kerül be, mint a
     szabványban és a python-qrcode-ban — így egy linkre ugyanaz a kép, mint a matricán. */
  const info=(mask,at)=>{
    const f=qrBch(mask,0x537,10)^0x5412;   /* M = 00; az XOR-tól sosem csupa világos */
    for(let i=0;i<15;i++){
      at(i<6?i:i<8?i+1:8,i<8?8:i<9?7:14-i,f>>i&1);
      at(i<8?8:n-15+i,i<8?n-1-i:8,f>>i&1);
    }
    at(n-8,8,1);
    if(v>6){
      const g=qrBch(v,0x1f25,12);
      for(let i=0;i<18;i++){ at(i/3|0,n-11+i%3,g>>i&1); at(n-11+i%3,i/3|0,g>>i&1); }
    }
  };
  info(0,(r,c)=>set(r,c,0));

  /* Cikcakk kétoszlopos sávokban, a 6. (időzítő) oszlop kimarad; a maradékbit világos. */
  for(let c=n-1,k=0;c>0;c-=2){
    if(c==6) c=5;
    for(let i=0;i<n;i++){
      const r=c+1&2?i:n-1-i;
      for(const cc of [c,c-1])
        if(!fn[r][cc]&&k<seq.length*8){ m[r][cc]=seq[k>>3]>>7-(k&7)&1; k++; }
    }
  }

  let best,bm,bp=Infinity;
  for(const mk of forceMask==null?[0,1,2,3,4,5,6,7]:[forceMask]){
    const t=m.map((row,r)=>row.map((x,c)=>fn[r][c]?x:x^QR_MASK[mk](r,c)));
    const p=forceMask==null?qrPenalty(t):0;
    if(p<bp){ best=t; bm=mk; bp=p; }
  }
  info(bm,(r,c,x)=>{ best[r][c]=x; });
  return best;
}

/* SVG path, soronként egy téglalap szakaszonként. 4 modul csendzóna: a szabvány kéri,
   enélkül nem olvasható (a régi generátor hibája volt). viewBox: 0 0 (méret+8) (méret+8) */
function qrPath(m){
  let d="";
  m.forEach((row,r)=>{
    for(const s of row.join("").matchAll(/1+/g)) d+=`M${s.index+4} ${r+4}h${s[0].length}v1h-${s[0].length}z`;
  });
  return d;
}

const QR_KELL=()=>!MOB()||TOTEM;
let qrVissza=null;
function qrLink(){ const u=urlOf(); return location.origin+location.pathname+(u.startsWith("#")?u:""); }
function qrNyit(){
  const t=T(), url=qrLink(), m=qrMatrix(url), n=m.length+8;
  // modulonként egész pixel (~260 px-es kód): így a modulhatárok nem mosódnak el
  const px=Math.max(4,Math.round(260/n))*n;

    <h2 id="qrH">${t.qrTitle}</h2><p>${t.qrHint}</p>
    <div class="qrimg"><svg width="${px}" height="${px}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"
      role="img" aria-label="${esc(t.qrImg)}"><rect width="${n}" height="${n}" fill="#fff"/>
      <path fill="#000" d="${qrPath(m)}"/></svg></div>
    <p class="qrut">${esc(nev(S.from))} → ${esc(nev(S.to))}</p>
    <p class="mono">${S.mm.dist} ${t.m} · ${S.mm.min} ${t.min}${S.via==="lift"?" · "+t.optLift:""}</p>
    <p class="qrurl mono">${esc(url.replace(/^https?:\/\//,""))}</p></div>`;
  $("qrX").onclick=qrBezar;
  qrVissza=document.activeElement;
  d.showModal();
}
function qrBezar(){ const d=$("qrDlg"); if(d.open) d.close(); }
$("qrDlg").addEventListener("click",e=>{ if(e.target===e.currentTarget) qrBezar(); });   // a háttérre
$("qrDlg").addEventListener("close",()=>{
  // vissza oda, ahonnan nyílt; ha a panel közben újrarajzolódott, az új gombra
  const b=qrVissza&&qrVissza.isConnected?qrVissza:$("qrSend");
  qrVissza=null; if(b) b.focus();
});

/* --------------------------------------------------------------- mély link */
/* Az állapot a címsorban él, így az útvonal megosztható, könyvjelzőzhető, és
   a vissza gomb visszalép — telepített appban ez utóbbi nélkül a vissza
   egyszerűen kilépne. Két alak van:
     #OA10E18                       – egy terem kiválasztva
     #from=OA00FK1&to=OA10E18       – útvonal; a from önmagában az „itt vagyok”,
                                      erre mutatnak a folyosókra kerülő QR-kódok.
     …&via=lift                     – a liftes változat: a telefonra küldött
                                      útvonal ne lépcsőn nyíljon meg.  */
let urlLock=false;                    // a visszaállítás ne írjon vissza a címsorba

function urlOf(){
  const q=[];
  if(S.from) q.push("from="+S.from);
  if(S.to)   q.push("to="+S.to);
  if(S.from && S.to && S.via==="lift" && S.hasLift) q.push("via=lift");
  if(S.sel && S.sel!==S.to && S.sel!==S.from) q.push("sel="+S.sel);
  if(!q.length) return location.pathname+location.search;
  if(q.length===1 && q[0].startsWith("sel=")) return "#"+S.sel;   // rövid alak
  return "#"+q.join("&");
}
function pushUrl(replace){
  if(urlLock) return;
  const u=urlOf();
  if(u===location.hash || (!location.hash && u===location.pathname+location.search)) return;
  try{ history[replace?"replaceState":"pushState"]({},"",u); }catch(e){}
}

function readUrl(){
  const h=decodeURIComponent(location.hash.replace(/^#/,"")).trim();
  const out={from:null,to:null,sel:null,via:null};
  if(!h) return out;
  if(!h.includes("=")){ out.sel=h.toUpperCase(); return out; }   // #OA10E18
  // a ? is elválasztó: egy link végére írt ?totem a hash-be kerül, és vinné a from-ot
  for(const part of h.split(/[&?]/)){
    const [k,v]=part.split("=");
    if(v && ["from","to","sel"].includes(k)) out[k]=v.toUpperCase();
    else if(k==="via" && v==="lift") out.via=v;
  }
  return out;
}

/* A címsorból visszaállított állapot. Ismeretlen kódot csendben elhagyunk —
   egy elgépelt vagy régi link ne törje szét az appot. */
function applyUrl(){
  const u=readUrl();
  const ok=c=>c && ROOM[c] ? c : null;
  urlLock=true; qrBezar();             // a nyitva maradt QR a régi útvonalat mutatná
  S.from=ok(u.from); S.to=ok(u.to); S.sel=ok(u.sel)||S.to||S.from;
  recompute();                          // ez lépcsőre állít, a link választása utána jön
  if(u.via==="lift" && S.hasLift) setVia("lift");
  if(S.sel){ const r=ROOM[S.sel];
    if(r && r.level!==S.level){ S.level=r.level; renderRail(); } }
  refreshSel(); renderPanel(); updateView();
  urlLock=false;
  return !!(S.from||S.to||S.sel);
}
addEventListener("popstate",applyUrl);
addEventListener("hashchange",()=>{ if(!urlLock) applyUrl(); });

/* ------------------------------------------------------------------ totem */
/* Totem-mód (?totem a címben, a totem saját helyével: ?totem#from=OA00FK1).
   Az e-totemen ott maradt az előző ember útvonala, nyelve, nézete. Egy perc
   tétlenség után visszaáll a totem saját állapotára: a címben megadott „itt
   vagyok", magyar nyelv, alaprajz, a tervlap rajzolt állása, zárt panel,
   hallgatói nézet. Tíz másodperccel előtte szól, és bármilyen érintés
   megállítja; gesztus közben soha nem áll vissza. Naponta egyszer újratölt
   (nyugvó állapotban), hogy a friss adat és a friss kód is megjöjjön. Csak
   ha valaki használta: a már alaphelyzetben álló kép percenként nem ugrál. */
/* A „totem" a cím kereső részébe való (?totem#from=…), de egy meglévő link
   végére írva a # után kerül (#from=OA00FK1?totem, …&totem): ott a böngésző a
   hash részének veszi, és a totem mód csendben nem kapcsolt be — kívülről
   semmi nem mutatta. Ezért a hash-ben is elfogadjuk, és átírjuk a kereső
   részbe: a hash-t az app minden lépésnél újraírja, egy újratöltés után onnan
   elveszne. */
const TOTEM=(()=>{
  const kulcs=x=>/^totem(=|$)/i.test(x);
  const keresoben=[...new URLSearchParams(location.search).keys()].some(kulcs);
  const resz=location.hash.replace(/^#/,"").split(/[&?]/).filter(Boolean);
  if(!resz.some(kulcs)) return keresoben;
  const hash=resz.filter(x=>!kulcs(x)).join("&");
  const kereso=keresoben?location.search:(location.search?location.search+"&":"?")+"totem";
  try{ history.replaceState(null,"",location.pathname+kereso+(hash?"#"+hash:"")); }catch(e){}
  return true;
})();
const TOTEM_HAZ=location.hash, TOTEM_IDLE=60e3, TOTEM_SZOL=10e3, TOTEM_UJRA=20*3600e3, BETOLTVE=Date.now();
let totemUtolso=Date.now(), totemPiszkos=false, totemSzolt=false;
function totemAlap(){
  if(Date.now()-BETOLTVE>TOTEM_UJRA){
    try{ history.replaceState(null,"",location.pathname+location.search+TOTEM_HAZ); }catch(e){}
    location.reload(); return;
  }
  toast.off(); totemPiszkos=totemSzolt=false;
  $("q").value=""; S.wc=null; S.tmOpen=null; S.termek=false; S.via="stairs";
  if(S.leg) toggleLeg(false);
  $("optbar").classList.remove("open");
  qrBezar();
  if(S.staff) setStaff(false);
  S.lang="hu";
  try{ history.replaceState(null,"",location.pathname+location.search+TOTEM_HAZ); }catch(e){}
  S.level=0; applyUrl(); applyLang();
  if(S.mode!==2) setMode(2);
  S.rot={...ROT0}; orientTags(); S.dirty=false; fit();
  setSnap(MOB()?"peek":"full");
}
if(TOTEM){
  const jel=()=>{ totemUtolso=Date.now(); totemPiszkos=true; if(totemSzolt){ totemSzolt=false; toast.off(); } };
  for(const ev of ["pointerdown","pointermove","keydown","wheel","input"])
    addEventListener(ev,jel,{capture:true,passive:true});
  setInterval(()=>{
    const csend=Date.now()-totemUtolso;
    if(app.classList.contains("navving")) return;            // gesztus közben soha
    if(!totemPiszkos){ if(csend>=TOTEM_IDLE && Date.now()-BETOLTVE>TOTEM_UJRA) totemAlap(); return; }
    if(csend>=TOTEM_IDLE) totemAlap();
    else if(csend>=TOTEM_IDLE-TOTEM_SZOL && !totemSzolt){ totemSzolt=true; toast(T().totemSoon,TOTEM_SZOL+1500); }
  },1000);
}

/* ------------------------------------------------------------------ start */
applyTheme(true);
buildFloors(); placeTags();
S.level=0;
/* Üresen indulunk: az érkezőnek ne egy általunk kitalált útvonal fogadja.
   Ha a címsorban van állapot (megosztott link vagy falra ragasztott QR),
   az dönt. */
applyLang();
urlLock=true; const fromUrl=applyUrl(); urlLock=false;
if(!fromUrl){ recompute(); refreshSel(); }
fit(); syncFlat();
setSnap(MOB()?"peek":"full");
// enélkül kívülről nem látszik, hogy a cím totem módot kért-e
if(TOTEM) toast(T().totemOn,5000);
addEventListener("orientationchange",()=>setTimeout(()=>{setSnap(snap);fit();},260));
if("serviceWorker" in navigator)
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
