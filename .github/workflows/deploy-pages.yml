name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # az ellenőrzés a pull requesteken is fut; a deploy csak a main-en
  pull_request:
  workflow_dispatch:

# Alapból csak olvasás; a Pages-jogot csak a deploy job kapja meg.
permissions:
  contents: read

# Egyszerre egy deploy fusson; a folyamatban lévőt nem szakítjuk meg.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Böngésző nélküli kapu a deploy előtt: a beágyazott szkript lefordul-e, az
  # adatfájlok ép JSON-ok-e, és az összeállító őr átengedi-e a csomagot.
  # Korábban a main teszt nélkül ment élesbe: egy elírás az index.html
  # szkriptjében üres appot adott volna minden telefonon. A teljes, böngészős
  # tesztsor (npm test, ~25 perc) helyben fut, lásd a CLAUDE.md-t.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Scripts compile, data files are valid
        run: node tools/ellenor.js
      - name: The published bundle passes its guard
        run: node tools/pages-csomag.js "$RUNNER_TEMP/_site"

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A GITHUB_TOKEN jogosultságai a Pages-re történő deployhoz.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # A Pages-t egyszer kézzel kell bekapcsolni (Settings → Pages →
      # Source: GitHub Actions). A GITHUB_TOKEN deployolni tud, létrehozni a
      # Pages site-ot nem — ahhoz repo admin jog kell, lásd a README-t.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Ha egy futás a deploy lépésnél bukik el (pl. az OIDC token időtúllépése),
      # NE a hibás jobot indítsd újra: a feltöltés már lefutott, és a második
      # próbálkozás egy második "github-pages" artifactot hagy, amitől a deploy
      # elutasítja a futást. Helyette a teljes workflow-t futtasd újra, vagy
      # indítsd kézzel (Run workflow) — az saját artifactot kap.
      # A repó privát, de a Pages site NEM az: ami bekerül az artifactba, az
      # nyilvános URL-en letölthető az oldalról. Ezért csak egy engedélylista
      # kerül ki (tools/pages-csomag.js): az app, a service worker, a
      # manifest, a mérőlap, a betűk, az ikonok és a data/ futásidejű fájljai.
      # Korábban a munkafa ment ki (path: .), és amíg a Pages élt, vele a
      # CLAUDE.md, a README, a docs/, a tools/, a tests/ és a .claude/ is.
      # Az összeállító elbukik, ha a csomagban tiltott fájl van, ha a service
      # worker készletéből, a lapok hivatkozásaiból vagy a megnyitható
      # épületek adatából valami hiányzik; a tests/csomag.js (helyben) azt
      # is méri, hogy az app a csomagból egyetlen hiányzó fájl nélkül fut.
      - name: Assemble the published bundle (allowlist)
        run: node tools/pages-csomag.js _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
